name: Set up pinned Bun
description: Install the Bun version pinned in package.json without requiring Windows symlink privileges.

outputs:
  bun-version:
    description: Installed Bun version
    value: ${{ steps.verify.outputs.bun-version }}

runs:
  using: composite
  steps:
    - name: Set up Bun on hosted or non-Windows runner
      if: runner.environment != 'self-hosted' || runner.os != 'Windows'
      uses: oven-sh/setup-bun@v2

    - name: Set up Bun on self-hosted Windows runner
      if: runner.environment == 'self-hosted' && runner.os == 'Windows'
      shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
      run: |
        $ErrorActionPreference = "Stop"

        $packageManager = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
        if ($packageManager -notmatch '^bun@(?<version>\d+\.\d+\.\d+)$') {
          throw 'package.json must pin packageManager as bun@x.y.z.'
        }

        $version = $Matches.version
        $installRoot = Join-Path $env:RUNNER_TEMP "matrundan-bun-$version-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
        $archivePath = Join-Path $installRoot "bun.zip"
        $downloadUrl = "https://github.com/oven-sh/bun/releases/download/bun-v$version/bun-windows-x64.zip"

        New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
        Invoke-WebRequest -UseBasicParsing -Uri $downloadUrl -OutFile $archivePath
        Expand-Archive -LiteralPath $archivePath -DestinationPath $installRoot -Force

        $binDirectory = Join-Path $installRoot "bun-windows-x64"
        Copy-Item -LiteralPath (Join-Path $binDirectory "bun.exe") -Destination (Join-Path $binDirectory "bunx.exe") -Force
        $binDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify pinned Bun
      id: verify
      shell: bash
      run: echo "bun-version=$(bun --version)" >> "$GITHUB_OUTPUT"
