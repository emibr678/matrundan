name: Set up CI runtime
description: Install the repository-pinned Node/Bun toolchain, dependency cache and locked dependencies.

runs:
  using: composite
  steps:
    - name: Set up pinned Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22.12.0
    - name: Set up pinned Bun
      id: bun
      uses: ./.github/actions/setup-bun
    - name: Cache Bun downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
