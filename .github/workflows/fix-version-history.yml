name: Fix version history

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'hotfix/version-history-0-10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Correct previous changelog version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/matrundan/version.ts")
          text = path.read_text()
          needle = 'summary:\n      "Gruppcentrerad gamification'
          summary_index = text.index(needle)
          entry_start = text.rfind("  {\n", 0, summary_index)
          prefix = text[entry_start:summary_index]
          if "version: APP_VERSION" not in prefix or "date: APP_VERSION_DATE" not in prefix:
              raise SystemExit("0.9.0-posten hade inte förväntade dynamiska värden")
          corrected = prefix.replace('version: APP_VERSION', 'version: "0.9.0"', 1)
          corrected = corrected.replace('date: APP_VERSION_DATE', 'date: "2026-07-25"', 1)
          path.write_text(text[:entry_start] + corrected + text[summary_index:])
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/matrundan/version.ts
          git commit -m "Rätta versionsnumret för 0.9.0 i historiken"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
