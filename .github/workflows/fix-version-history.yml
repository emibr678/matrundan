name: Fix version history

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'hotfix/version-history-0-10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Correct previous changelog version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/matrundan/version.ts")
          text = path.read_text()
          old = '''  {
            version: APP_VERSION,
            date: APP_VERSION_DATE,
            summary:
              "Gruppcentrerad gamification'''
          new = '''  {
            version: "0.9.0",
            date: "2026-07-25",
            summary:
              "Gruppcentrerad gamification'''
          if old not in text:
              raise SystemExit("Kunde inte hitta 0.9.0-posten")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/matrundan/version.ts
          git commit -m "Rätta versionsnumret för 0.9.0 i historiken"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
