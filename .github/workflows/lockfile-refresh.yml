name: Temporary lockfile refresh

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - package.json
      - .github/workflows/lockfile-refresh.yml

# Temporary diagnostic only. The workflow may create one unattached Git blob so
# the connector can retrieve Bun's exact bytes; it never updates a tree or ref.
permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  generate:
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Regenerate Bun lockfile from a clean state
        run: |
          rm -f bun.lock
          bun install --lockfile-only >/dev/null

      - name: Verify manifest and portability
        run: |
          git diff --exit-code -- package.json
          if grep -E -q '@lovable\.dev|lovable-core-prod|sandbox-npm-cache' bun.lock; then
            echo 'Lockfile still contains Lovable-specific package references.' >&2
            exit 1
          fi

      - name: Verify regenerated lockfile is frozen-installable
        run: bun install --frozen-lockfile >/dev/null

      - name: Stage and verify exact canonical lockfile
        run: |
          git add -- bun.lock
          git show :bun.lock > bun.lock.canonical
          test "$(git hash-object bun.lock.canonical)" = "$(git rev-parse :bun.lock)"
          echo "LOCKFILE_BLOB_SHA=$(git rev-parse :bun.lock)"

      - name: Store canonical lockfile as unattached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const cp = require('child_process');

          (async () => {
            const data = fs.readFileSync('bun.lock.canonical');
            const expectedSha = cp.execSync('git hash-object bun.lock.canonical', { encoding: 'utf8' }).trim();
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ content: data.toString('base64'), encoding: 'base64' }),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`GitHub blob upload failed: ${response.status} ${body}`);
            const result = JSON.parse(body);
            if (result.sha !== expectedSha) {
              throw new Error(`Git blob mismatch: ${result.sha} != ${expectedSha}`);
            }
            console.log(`REMOTE_LOCKFILE_BLOB_SHA=${result.sha}`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          JS
