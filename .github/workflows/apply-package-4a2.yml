name: Apply Package 4A.2 bundled Leaflet

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/package-4a2-bundled-leaflet'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/package-4a2-bundled-leaflet
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bundle Leaflet locally
        run: |
          bun add leaflet@1.9.4
          bun add --dev @types/leaflet@1.9.21

          cat > src/lib/matrundan/leaflet-global.ts <<'EOF'
          import "leaflet/dist/leaflet.css";

          export type LatLngTuple = [number, number];
          export type LeafletHandler = () => void;

          type LeafletTarget = LeafletMap | LeafletLayerGroup;

          export interface LeafletLayer {
            addTo(target: LeafletTarget): this;
            remove(): this;
            on(event: string, handler: LeafletHandler): this;
            off(event: string, handler: LeafletHandler): this;
          }

          export interface LeafletLayerGroup extends LeafletLayer {
            addLayer(layer: LeafletLayer): this;
          }

          export interface LeafletMap {
            setView(center: LatLngTuple, zoom: number, options?: Record<string, unknown>): this;
            fitBounds(bounds: LeafletBounds, options?: Record<string, unknown>): this;
            zoomIn(delta?: number): this;
            zoomOut(delta?: number): this;
            getZoom(): number;
            getCenter(): { lat: number; lng: number };
            invalidateSize(options?: Record<string, unknown>): this;
            on(event: string, handler: LeafletHandler): this;
            off(event: string, handler: LeafletHandler): this;
            remove(): void;
          }

          export interface LeafletBounds {
            isValid(): boolean;
          }

          export interface LeafletApi {
            Browser: { retina: boolean };
            map(element: HTMLElement, options?: Record<string, unknown>): LeafletMap;
            tileLayer(url: string, options?: Record<string, unknown>): LeafletLayer;
            layerGroup(): LeafletLayerGroup;
            marker(position: LatLngTuple, options?: Record<string, unknown>): LeafletLayer;
            circle(position: LatLngTuple, options?: Record<string, unknown>): LeafletLayer;
            divIcon(options?: Record<string, unknown>): unknown;
            latLngBounds(points: LatLngTuple[]): LeafletBounds;
          }

          let leafletPromise: Promise<LeafletApi> | null = null;

          export function waitForLeaflet(): Promise<LeafletApi> {
            if (typeof window === "undefined") {
              return Promise.reject(new Error("Leaflet kan bara laddas i webbläsaren."));
            }

            leafletPromise ??= import("leaflet").then((module) =>
              (module.default ?? module) as unknown as LeafletApi,
            );
            return leafletPromise;
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/routes/__root.tsx")
          text = path.read_text()
          text = re.sub(
              r'\nimport \{\n  LEAFLET_CSS_ID,\n  LEAFLET_CSS_INTEGRITY,\n  LEAFLET_CSS_URL,\n  LEAFLET_SCRIPT_ID,\n  LEAFLET_SCRIPT_INTEGRITY,\n  LEAFLET_SCRIPT_URL,\n\} from "@/lib/matrundan/leaflet-global";\n',
              "\n",
              text,
          )
          text = re.sub(
              r'\n        <link\n          id=\{LEAFLET_CSS_ID\}\n          rel="stylesheet"\n          href=\{LEAFLET_CSS_URL\}\n          integrity=\{LEAFLET_CSS_INTEGRITY\}\n          crossOrigin="anonymous"\n        />\n        <script\n          id=\{LEAFLET_SCRIPT_ID\}\n          src=\{LEAFLET_SCRIPT_URL\}\n          integrity=\{LEAFLET_SCRIPT_INTEGRITY\}\n          crossOrigin="anonymous"\n          defer\n        />',
              "",
              text,
          )
          path.write_text(text)

          test_path = Path("tests/e2e/mobile-matstallen.spec.ts")
          test = test_path.read_text()
          needle = '  await expect(page.getByRole("region", { name: /Karta med \\d+ av \\d+ matställen/ })).toBeVisible();\n'
          replacement = needle + '  await expect(page.getByText("Laddar kartan...")).toBeHidden();\n'
          if replacement not in test:
              test = test.replace(needle, replacement)
          test_path.write_text(test)
          PY

          bunx prettier --write package.json bun.lock src/lib/matrundan/leaflet-global.ts src/routes/__root.tsx tests/e2e/mobile-matstallen.spec.ts
          rm .github/workflows/apply-package-4a2.yml

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src/lib/matrundan/leaflet-global.ts src/routes/__root.tsx tests/e2e/mobile-matstallen.spec.ts .github/workflows/apply-package-4a2.yml
          git commit -m "Bundle Leaflet locally for Lovable preview"
          git push origin HEAD:fix/package-4a2-bundled-leaflet
