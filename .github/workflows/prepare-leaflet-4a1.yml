name: Prepare Leaflet dependency files

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Add Leaflet dependencies
        run: |
          bun add leaflet@1.9.4
          bun add --dev @types/leaflet@1.9.21

      - name: Upload dependency files
        uses: actions/upload-artifact@v4
        with:
          name: leaflet-dependency-files
          path: |
            package.json
            bun.lock
