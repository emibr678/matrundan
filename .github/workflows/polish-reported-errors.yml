# Temporary workflow for branch-local visual polish.
name: Polish reported errors branch

on:
  push:
    branches:
      - feature/rapporterade-fel-ux

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rapporterade-fel-ux
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply visual polish from browser review
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('src/routes/rapporterade-fel.tsx')
          text = route.read_text()
          text = text.replace(
              'className="flex gap-2 overflow-x-auto pb-1" aria-label="Filtrera rapporterade fel"',
              'className="grid grid-cols-2 gap-2 sm:flex sm:flex-wrap" aria-label="Filtrera rapporterade fel"',
              1,
          )
          text = text.replace(
              'className="shrink-0 rounded-full"',
              'className="w-full justify-between rounded-full sm:w-auto sm:justify-center"',
              1,
          )
          text = text.replace(
              '<SheetContent side="right" className="w-full overflow-y-auto sm:max-w-xl">',
              '<SheetContent side="right" className="w-full max-w-none overflow-y-auto p-4 sm:max-w-xl sm:p-6">',
              1,
          )
          route.write_text(text)

          test = Path('tests/e2e/mobile-reported-errors.spec.ts')
          text = test.read_text()
          text = text.replace(
              '  await expectNoHorizontalOverflow(page, "rapportlistan");\n\n  await testInfo.attach',
              '  await expectNoHorizontalOverflow(page, "rapportlistan");\n  await page.waitForTimeout(600);\n\n  await testInfo.attach',
              1,
          )
          text = text.replace(
              '  await expectNoHorizontalOverflow(page, "panelen för rättelseförslag");\n\n  await testInfo.attach',
              '  await expectNoHorizontalOverflow(page, "panelen för rättelseförslag");\n  await page.waitForTimeout(600);\n\n  await testInfo.attach',
              1,
          )
          test.write_text(text)
          PY
          bunx prettier --write src/routes/rapporterade-fel.tsx tests/e2e/mobile-reported-errors.spec.ts tests/e2e/mobile-search-hygiene.spec.ts tests/e2e/v1-13-osm-note-publishing.spec.ts src/components/matrundan/ReportedErrorsSettingsLink.tsx
      - name: Commit polish
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/rapporterade-fel.tsx tests/e2e/mobile-reported-errors.spec.ts tests/e2e/mobile-search-hygiene.spec.ts tests/e2e/v1-13-osm-note-publishing.spec.ts src/components/matrundan/ReportedErrorsSettingsLink.tsx
          git commit -m "fix: polish reported errors mobile UX"
          git push origin HEAD:feature/rapporterade-fel-ux
