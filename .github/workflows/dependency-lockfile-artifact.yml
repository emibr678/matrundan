name: Dependency lockfile artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - .github/workflows/dependency-lockfile-artifact.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Regenerate Bun lockfile only
        run: bun install --lockfile-only

      - name: Verify generated lockfile
        run: |
          test "$(bun --version)" = "1.3.14"
          test -s bun.lock
          git status --short -- package.json bun.lock

      - name: Store generated lockfile as unattached Git blob
        id: lockfile-blob
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('bun.lock').toString('base64');
            const { data } = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content,
              encoding: 'base64',
            });
            core.info(`Generated lockfile blob SHA: ${data.sha}`);
            core.setOutput('sha', data.sha);

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: bun.lock
          retention-days: 1
          if-no-files-found: error
