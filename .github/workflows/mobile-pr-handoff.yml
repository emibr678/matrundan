name: Mobile PR handoff

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  receipt:
    name: Surface verified mobile handoff
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_API_TOKEN: ${{ github.token }}
      CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out trusted default-branch tooling
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          show-progress: false

      - name: Verify candidate and upsert the canonical PR receipt
        run: node scripts/mobile-pr-handoff.mjs
