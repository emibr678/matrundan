name: Apply stable map diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - src/routes/mapdiagnostik.tsx
      - .github/workflows/apply-mapdiagnostic-stabil.yml
      - .github/workflows/fix-mapdiagnostic-memo.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
      - name: Stabilize, generate route tree and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/mapdiagnostik.tsx')
          text = path.read_text()
          anchor = '  const [run, setRun] = React.useState(0);'
          replacement = '  const localDiagnosticStyle = React.useMemo(() => localStyle(), []);\n  const [run, setRun] = React.useState(0);'
          if 'const localDiagnosticStyle' not in text:
              if anchor not in text:
                  raise SystemExit('run state anchor missing')
              text = text.replace(anchor, replacement, 1)
          text = text.replace('          style={localStyle()}', '          style={localDiagnosticStyle}', 1)
          path.write_text(text)
          PY
          bun install --frozen-lockfile
          bunx prettier --write src/routes/mapdiagnostik.tsx
          bun run build
          bunx tsc --noEmit
          bunx eslint src/routes/mapdiagnostik.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/mapdiagnostik.tsx src/routeTree.gen.ts
          git rm -f .github/workflows/apply-mapdiagnostic-stabil.yml .github/workflows/fix-mapdiagnostic-memo.yml
          git commit -m "Stabilisera och registrera kartdiagnostiken"
          git push
