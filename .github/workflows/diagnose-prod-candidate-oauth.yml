name: Diagnose prod candidate OAuth

on:
  push:
    branches:
      - ops/issue-260-prod-candidate-oauth-smoke

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  oauth-target:
    name: Verify prod candidate Google OAuth target
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify fresh-browser OAuth target without signing in
        env:
          CANDIDATE_URL: https://prod-candidate-app.matrundan.workers.dev
          EXPECTED_SUPABASE_HOST: wsikirbxqejjwtgxcvjl.supabase.co
          FORBIDDEN_SUPABASE_HOST: wpihfmwbubvdiaavtpia.supabase.co
          EXPECTED_RELEASE_SHA: 1600502fcb86a5527d0eb7ff5752fe650975d13b
        run: |
          bun - <<'BUN'
          import { chromium } from "@playwright/test";

          const candidateUrl = process.env.CANDIDATE_URL;
          const expectedHost = process.env.EXPECTED_SUPABASE_HOST;
          const forbiddenHost = process.env.FORBIDDEN_SUPABASE_HOST;
          const expectedRelease = process.env.EXPECTED_RELEASE_SHA;
          if (!candidateUrl || !expectedHost || !forbiddenHost || !expectedRelease) {
            throw new Error("Missing diagnostic configuration.");
          }

          const health = await fetch(`${candidateUrl}/api/health`, {
            headers: { accept: "application/json", "cache-control": "no-cache" },
          });
          const healthPayload = await health.json();
          if (!health.ok || healthPayload?.status !== "ok" || healthPayload?.release !== expectedRelease) {
            throw new Error(`Candidate health/release mismatch: ${health.status} ${JSON.stringify(healthPayload)}`);
          }

          const browser = await chromium.launch();
          try {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const consoleErrors = [];
            page.on("console", (message) => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });

            let oauthUrl = null;
            await page.route("**/auth/v1/authorize**", async (route) => {
              oauthUrl = route.request().url();
              await route.abort();
            });

            await page.goto(candidateUrl, { waitUntil: "domcontentloaded", timeout: 30_000 });
            const button = page.getByRole("button", { name: "Fortsätt med Google" });
            await button.waitFor({ state: "visible", timeout: 20_000 });
            await button.click();

            for (let attempt = 0; attempt < 40 && !oauthUrl; attempt += 1) {
              await page.waitForTimeout(250);
            }
            if (!oauthUrl) {
              throw new Error(
                `No Supabase OAuth authorize request observed. Browser errors: ${consoleErrors.join(" | ") || "none"}`,
              );
            }

            const target = new URL(oauthUrl);
            if (target.hostname === forbiddenHost) {
              throw new Error(`Production candidate attempted Google OAuth against staging Supabase: ${target.hostname}`);
            }
            if (target.hostname !== expectedHost) {
              throw new Error(`Unexpected Google OAuth Supabase host: ${target.hostname}; expected ${expectedHost}`);
            }
            if (target.pathname !== "/auth/v1/authorize") {
              throw new Error(`Unexpected OAuth authorize path: ${target.pathname}`);
            }
            if (target.searchParams.get("provider") !== "google") {
              throw new Error(`Unexpected OAuth provider: ${target.searchParams.get("provider")}`);
            }
            if (consoleErrors.some((message) => message.includes("MATRUNDAN_ENVIRONMENT_MISMATCH"))) {
              throw new Error(`Environment mismatch guard fired on correct prod candidate: ${consoleErrors.join(" | ")}`);
            }

            console.log(`Verified fresh-browser Google OAuth target: ${target.hostname}${target.pathname}`);
            console.log(`Verified candidate release SHA: ${expectedRelease}`);
          } finally {
            await browser.close();
          }
          BUN
