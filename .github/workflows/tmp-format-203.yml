name: Temporary format #203

on:
  push:
    branches:
      - agent/issue-203-grouped-visit-reviews

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-203-grouped-visit-reviews
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format only #203 files
        run: |
          bunx prettier --write \
            src/components/matrundan/VisitReviewsSection.tsx \
            src/lib/matrundan/example-review-scenarios.test.ts \
            src/lib/matrundan/visit-reviews.test.ts \
            src/lib/matrundan/visit-reviews.ts \
            tests/e2e/v1-35-grouped-visit-reviews.spec.ts

      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- \
            src/components/matrundan/VisitReviewsSection.tsx \
            src/lib/matrundan/example-review-scenarios.test.ts \
            src/lib/matrundan/visit-reviews.test.ts \
            src/lib/matrundan/visit-reviews.ts \
            tests/e2e/v1-35-grouped-visit-reviews.spec.ts; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/matrundan/VisitReviewsSection.tsx \
            src/lib/matrundan/example-review-scenarios.test.ts \
            src/lib/matrundan/visit-reviews.test.ts \
            src/lib/matrundan/visit-reviews.ts \
            tests/e2e/v1-35-grouped-visit-reviews.spec.ts
          git commit -m "Formattera #203-kandidaten"
          git push origin HEAD:agent/issue-203-grouped-visit-reviews
