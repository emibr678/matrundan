name: Apply Package 3C UI review

on:
  push:
    branches: [fix/package-3c-geoapify-review]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/package-3c-geoapify-review
      - uses: oven-sh/setup-bun@v2
      - name: Apply reviewed UI changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/matrundan/AddPlaceDialog.tsx')
          text = path.read_text()

          def replace(old, new):
              global text
              if old not in text:
                  raise SystemExit('Expected block not found:\n' + old[:300])
              text = text.replace(old, new, 1)

          replace(
            '  { value: 9999, label: "Hela landet" },',
            '  { value: 9999, label: "Större område (50 km)" },',
          )
          replace(
            '  const [results, setResults] = React.useState<PlaceSuggestion[]>([]);',
            '  const [results, setResults] = React.useState<PlaceSuggestion[]>([]);\n  const [pendingSuggestion, setPendingSuggestion] = React.useState<PlaceSuggestion | null>(null);',
          )
          replace(
            '      setResults([]);\n      setCenter(null);',
            '      setResults([]);\n      setPendingSuggestion(null);\n      setCenter(null);',
          )
          replace(
            '''            raw: r.raw,
          }));''',
            '''            distanceKm: r.distanceKm,
            website: r.website,
            phone: r.phone,
            externalUrl: r.externalUrl,
            attribution: r.attribution,
            raw: r.raw,
          }));''',
          )

          start = text.index('  const pickSuggestion = async (s: PlaceSuggestion) => {')
          end = text.index('\n\n\n  const submitManual', start)
          text = text[:start] + '''  const pickSuggestion = (s: PlaceSuggestion) => {
    setPendingSuggestion(s);
    setName(s.name);
    setCategory(s.category);
    setCuisines((s.cuisines ?? []).join(", "));
    setAddress(s.address);
    setManualArea(s.area ?? "");
    setCity(s.city || state.group.city);
    setOccasions(["avslappnat"]);
    setNotes("");
    setPhoto(emojiForCategory(s.category));
    setTab("manuell");
  };''' + text[end:]

          old_submit = '''      const p = await addPlace({
        name: name.trim(),
        category,
        cuisines: cuisines
          .split(",")
          .map((c) => c.trim())
          .filter(Boolean),
        occasions,
        address: address.trim(),
        area: manualArea.trim() || undefined,
        city: city.trim() || state.group.city,
        addedBy: state.currentUserId,
        notes: notes.trim() || undefined,
        photo,
      });'''
          new_submit = '''      const base = {
        name: name.trim(),
        category,
        cuisines: cuisines
          .split(",")
          .map((c) => c.trim())
          .filter(Boolean),
        occasions,
        address: address.trim(),
        area: manualArea.trim() || undefined,
        city: city.trim() || state.group.city,
        lat: pendingSuggestion?.lat,
        lng: pendingSuggestion?.lng,
        addedBy: state.currentUserId,
        notes: notes.trim() || undefined,
        photo,
      };
      const p = pendingSuggestion && isLive && pendingSuggestion.provider
        ? await addProviderPlace({
            provider: pendingSuggestion.provider,
            providerPlaceId: pendingSuggestion.externalId,
            place: base,
            raw: pendingSuggestion.raw ? safeParse(pendingSuggestion.raw) : {},
          })
        : await addPlace(base);'''
          replace(old_submit, new_submit)
          replace(
            '      toast.success(`${p.name} tillagd`);\n      onOpenChange(false);',
            '      toast.success(`${p.name} tillagd`);\n      setPendingSuggestion(null);\n      onOpenChange(false);',
          )
          replace(
            '    radiusKm >= 9999 ? "hela landet" : `inom ${radiusKm} km`',
            '    radiusKm >= 9999 ? "inom 50 km" : `inom ${radiusKm} km`',
          )
          replace(
            '`${radiusKm >= 9999 ? "hela landet" : radiusKm + " km"}`',
            '`${radiusKm >= 9999 ? "50 km" : radiusKm + " km"}`',
          )
          replace(
            '{results.length > 0 && hasCoords ? (',
            '{!isLive && results.length > 0 && hasCoords ? (',
          )
          replace(
            '''            <p className="text-[11px] text-muted-foreground">
              Demo-provider aktiv. Riktig kartdata och platssök aktiveras när
              backend kopplas på.
            </p>''',
            '''            <p className="text-[11px] text-muted-foreground">
              {isLive
                ? "Platsdata från Geoapify och © OpenStreetMap-bidragsgivare."
                : "Demodata – inga externa platsanrop görs."}
            </p>''',
          )
          replace(
            '''          <div className="space-y-3">
            <div className="flex items-end gap-3">''',
            '''          <div className="space-y-3">
            {pendingSuggestion ? (
              <div className="rounded-xl border border-border/70 bg-secondary/50 p-3 text-sm">
                <div className="font-medium">Bekräfta {pendingSuggestion.name}</div>
                <div className="mt-1 text-xs text-muted-foreground">
                  Välj vad stället passar för och lägg till en valfri anteckning innan det sparas.
                </div>
              </div>
            ) : null}
            <div className="flex items-end gap-3">''',
          )
          path.write_text(text)

          provider = Path('src/lib/matrundan/places-provider.ts')
          ptext = provider.read_text()
          old = '''  distanceKm?: number;
  /** Provider-id ("demo" | "geoapify"). Sätts på live-förslag. */
  provider?: string;
  /** Rå leverantörsdata (JSON-serialiserad) för `place_sources.raw`. */
  raw?: string;'''
          new = '''  distanceKm?: number;
  website?: string;
  phone?: string;
  externalUrl?: string;
  attribution?: string;
  /** Provider-id ("demo" | "geoapify"). Sätts på live-förslag. */
  provider?: string;
  /** Begränsad leverantörsmetadata (JSON-serialiserad) för `place_sources.raw`. */
  raw?: string;'''
          if old not in ptext:
              raise SystemExit('PlaceSuggestion block not found')
          provider.write_text(ptext.replace(old, new, 1))
          PY
      - name: Verify
        run: |
          bun install --frozen-lockfile
          bunx tsgo --noEmit
          bun run build
      - name: Commit generated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/matrundan/AddPlaceDialog.tsx src/lib/matrundan/places-provider.ts
          git diff --cached --quiet && exit 0
          git commit -m "Complete Geoapify confirmation UX"
          git push
