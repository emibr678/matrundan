name: Issue 260 prod preflight dispatch

on:
  push:
    branches:
      - ops/issue-260-prod-preflight-dispatch

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel stuck dispatcher and dispatch exact main preflight
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: f9c8898d430530402fa779ed5b8bbab04122c323
          STUCK_RUN_ID: '33939493642'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            'content-type': 'application/json',
            'x-github-api-version': '2022-11-28',
          };
          const api = `https://api.github.com/repos/${owner}/${repo}`;

          const mainResponse = await fetch(`${api}/git/ref/heads/main`, { headers });
          const main = await mainResponse.json();
          if (!mainResponse.ok || main?.object?.sha !== process.env.EXPECTED_SHA) {
            throw new Error(`Current main is not expected SHA ${process.env.EXPECTED_SHA}.`);
          }

          const stuckResponse = await fetch(`${api}/actions/runs/${process.env.STUCK_RUN_ID}`, { headers });
          const stuck = await stuckResponse.json().catch(() => null);
          if (stuckResponse.ok && ['queued', 'in_progress', 'waiting', 'pending'].includes(stuck?.status)) {
            const cancel = await fetch(`${api}/actions/runs/${process.env.STUCK_RUN_ID}/cancel`, {
              method: 'POST',
              headers,
            });
            if (![202, 409].includes(cancel.status)) {
              throw new Error(`Could not cancel stuck dispatcher run (HTTP ${cancel.status}).`);
            }
            console.log(`Cancelled stuck dispatcher run ${process.env.STUCK_RUN_ID}.`);
          }

          const dispatch = await fetch(`${api}/actions/workflows/cloudflare-prod-preflight.yml/dispatches`, {
            method: 'POST',
            headers,
            body: JSON.stringify({
              ref: 'main',
              inputs: {
                expected_sha: process.env.EXPECTED_SHA,
                upload_version: true,
              },
            }),
          });
          if (![200, 204].includes(dispatch.status)) {
            throw new Error(`Prod preflight dispatch failed (HTTP ${dispatch.status}).`);
          }
          console.log(`Dispatched prod preflight for ${process.env.EXPECTED_SHA}.`);
          NODE
