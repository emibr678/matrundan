name: Visual export PR190

on:
  push:
    branches:
      - agent/visual-export-pr190

permissions:
  contents: write

jobs:
  shrink:
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Check out exported visual assets
        uses: actions/checkout@v4
        with:
          ref: agent/visual-assets-pr190
          fetch-depth: 0
          show-progress: false

      - name: Create small contact sheet
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = Join-Path $PWD 'visual-review/contact-sheet.jpg'
          $target = Join-Path $PWD 'visual-review/contact-sheet-small.jpg'
          $image = [System.Drawing.Image]::FromFile($source)
          $width = 500
          $height = [int][Math]::Round($image.Height * $width / $image.Width)
          $bitmap = New-Object System.Drawing.Bitmap($width, $height)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $graphics.DrawImage($image, 0, 0, $width, $height)
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $qualityEncoder = [System.Drawing.Imaging.Encoder]::Quality
          $parameters = New-Object System.Drawing.Imaging.EncoderParameters(1)
          $parameters.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter($qualityEncoder, [long]12)
          $bitmap.Save($target, $codec, $parameters)
          $graphics.Dispose()
          $bitmap.Dispose()
          $image.Dispose()

      - name: Split small contact sheet
        shell: bash
        run: |
          rm -rf visual-review/contact-sheet-small-b64
          mkdir -p visual-review/contact-sheet-small-b64
          base64 -w 0 visual-review/contact-sheet-small.jpg > visual-review/contact-sheet-small-b64/all.txt
          length=$(wc -c < visual-review/contact-sheet-small-b64/all.txt | tr -d ' ')
          split -b 3000 -d -a 3 visual-review/contact-sheet-small-b64/all.txt visual-review/contact-sheet-small-b64/part-
          rm visual-review/contact-sheet-small-b64/all.txt
          for file in visual-review/contact-sheet-small-b64/part-*; do mv "$file" "$file.txt"; done
          parts=$(find visual-review/contact-sheet-small-b64 -name 'part-*.txt' | wc -l | tr -d ' ')
          printf 'length=%s\nparts=%s\n' "$length" "$parts" > visual-review/contact-sheet-small-b64/manifest.txt

      - name: Push small visual assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-review/contact-sheet-small.jpg visual-review/contact-sheet-small-b64
          git commit -m "Add temporary small visual contact sheet" || exit 0
          git push origin HEAD:refs/heads/agent/visual-assets-pr190
