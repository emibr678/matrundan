name: Debug staging Supabase management API

on:
  push:
    branches:
      - debug/staging-management-api

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    name: Probe staging Management API read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    env:
      STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      STAGING_SUPABASE_PROJECT_ID: wpihfmwbubvdiaavtpia

    steps:
      - name: Query staging migration history read-only
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "diagnostic: STAGING_SUPABASE_ACCESS_TOKEN is missing" >&2
            exit 3
          fi

          node --input-type=module <<'NODE'
          const token = process.env.STAGING_SUPABASE_ACCESS_TOKEN;
          const projectRef = process.env.STAGING_SUPABASE_PROJECT_ID;
          const response = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/database/query`,
            {
              method: 'POST',
              headers: {
                accept: 'application/json',
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                query: 'select name from supabase_migrations.schema_migrations order by version',
                read_only: true,
              }),
              signal: AbortSignal.timeout(15_000),
            },
          );
          const text = await response.text();
          console.log(`diagnostic: management_api_status=${response.status}`);
          if (!response.ok) {
            console.error(`diagnostic: management_api_error=${text.slice(0, 500)}`);
            process.exit(4);
          }

          let payload;
          try {
            payload = JSON.parse(text);
          } catch {
            console.error('diagnostic: management_api_response_not_json');
            process.exit(5);
          }
          const rows = Array.isArray(payload) ? payload : Array.isArray(payload?.result) ? payload.result : null;
          if (!rows) {
            console.error(`diagnostic: unexpected_payload_shape=${text.slice(0, 500)}`);
            process.exit(6);
          }
          const names = rows.map((row) => row?.name).filter((value) => typeof value === 'string');
          console.log(`diagnostic: migration_rows=${names.length}`);
          console.log(`diagnostic: has_visit_context=${names.includes('visit_context_v1')}`);
          console.log(`diagnostic: has_derived_review_model=${names.includes('derived_review_model_v1')}`);
          console.log(`diagnostic: has_derived_review_completion=${names.includes('derived_review_model_archived_completion')}`);
          console.log('diagnostic: management_api_read_only=success');
          NODE
