name: Debug staging Supabase management API

on:
  push:
    branches:
      - debug/staging-management-api

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    name: Probe staging Management API read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    env:
      STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_SUPABASE_PAT: ${{ secrets.STAGING_SUPABASE_PAT }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
      STAGING_SUPABASE_PROJECT_ID: wpihfmwbubvdiaavtpia

    steps:
      - name: Detect configured management token and query migration history
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const candidates = [
            ['STAGING_SUPABASE_ACCESS_TOKEN', process.env.STAGING_SUPABASE_ACCESS_TOKEN],
            ['SUPABASE_ACCESS_TOKEN', process.env.SUPABASE_ACCESS_TOKEN],
            ['STAGING_SUPABASE_PAT', process.env.STAGING_SUPABASE_PAT],
            ['SUPABASE_PAT', process.env.SUPABASE_PAT],
          ];
          const configured = candidates.filter(([, value]) => typeof value === 'string' && value.length > 0);
          console.log(`diagnostic: configured_token_names=${configured.map(([name]) => name).join(',') || 'none'}`);
          if (configured.length === 0) {
            console.error('diagnostic: no Supabase Management API token configured in staging environment');
            process.exit(3);
          }

          const [tokenName, token] = configured[0];
          const projectRef = process.env.STAGING_SUPABASE_PROJECT_ID;
          const response = await fetch(
            `https://api.supabase.com/v1/projects/${projectRef}/database/query/read-only`,
            {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                query: 'select name from supabase_migrations.schema_migrations order by version',
              }),
              signal: AbortSignal.timeout(15_000),
            },
          );
          const text = await response.text();
          console.log(`diagnostic: token_name=${tokenName}`);
          console.log(`diagnostic: management_api_status=${response.status}`);
          if (!response.ok) {
            console.error(`diagnostic: management_api_error=${text.slice(0, 500)}`);
            process.exit(4);
          }

          let payload;
          try {
            payload = JSON.parse(text);
          } catch {
            console.error('diagnostic: management_api_response_not_json');
            process.exit(5);
          }
          const rows = Array.isArray(payload) ? payload : Array.isArray(payload?.result) ? payload.result : null;
          if (!rows) {
            console.error(`diagnostic: unexpected_payload_shape=${text.slice(0, 500)}`);
            process.exit(6);
          }
          console.log(`diagnostic: migration_rows=${rows.length}`);
          console.log('diagnostic: management_api_read_only=success');
          NODE
