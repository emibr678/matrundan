name: Fix map resource union

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/package-4a5a-resource-verification
      - uses: oven-sh/setup-bun@v2
      - name: Patch, verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/matrundan/PlaceMap.tsx')
          t=p.read_text()
          old='type MapFailureCode = "webgl" | "style-auth" | "style-network" | "worker" | "timeout" | "runtime";'
          new='type MapFailureCode =\n  | "webgl"\n  | "style-auth"\n  | "style-network"\n  | "resources"\n  | "worker"\n  | "timeout"\n  | "runtime";'
          if old not in t: raise SystemExit('union pattern missing')
          p.write_text(t.replace(old,new))
          PY
          bun install --frozen-lockfile
          bunx prettier --write src/components/matrundan/PlaceMap.tsx
          bunx tsc --noEmit
          bunx eslint src/components/matrundan/PlaceMap.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/matrundan/PlaceMap.tsx
          git commit -m "Lägg till resursfel i kartans feltyper"
          git rm .github/workflows/fix-map-resource-union.yml .github/workflows/capture-map-tsc-error.yml
          git commit -m "Remove temporary map diagnostic workflows"
          git push origin HEAD:fix/package-4a5a-resource-verification
