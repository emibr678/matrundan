name: Apply PlaceMap diagnostic formatting

on:
  push:
    branches: [diagnostic/placemap-isolation]
    paths:
      - src/routes/placemapdiagnostik.tsx
      - .github/workflows/apply-placemap-diagnostic-format.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/placemap-isolation
      - uses: oven-sh/setup-bun@v2
      - name: Format, verify and commit
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/routes/placemapdiagnostik.tsx
          bun run build
          bunx tsc --noEmit
          bunx eslint src/routes/placemapdiagnostik.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/placemapdiagnostik.tsx src/routeTree.gen.ts
          git rm .github/workflows/apply-placemap-diagnostic-format.yml
          git commit -m "Formatera och registrera PlaceMap-diagnostiken"
          git push
