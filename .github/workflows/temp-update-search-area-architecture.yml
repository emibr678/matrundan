name: Temp update search area architecture

on:
  push:
    branches:
      - agent/search-area-settings-consistency

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/search-area-settings-consistency
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Update architecture source of truth
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/architecture.md")
          text = path.read_text()
          old = """- Overifierad fritext får inte användas som koordinatkälla.
          - En tillfällig annan plats i sökdialogen sparas inte automatiskt i gruppen.
          - Sökområden är endast förvalda sökcentrum och aldrig geografiska begränsningar
            för vad gruppen får lägga till eller besöka.
          """
          new = """- Overifierad fritext får inte användas som koordinatkälla.
          - Kommuner, län, regioner och länder får inte sparas som nya punktcentrum.
            Valideringen använder både Geoapifys typ och platsens etikett eftersom svenska
            kommuner ibland klassificeras som `city`.
          - Befintliga breda områden raderas inte automatiskt. De visas med vägledning i
            gruppinställningarna tills en behörig användare byter dem mot en ort, stadsdel
            eller adress.
          - En tillfällig annan plats i sökdialogen sparas inte automatiskt i gruppen.
          - Sökområden är endast förvalda sökcentrum och aldrig geografiska begränsningar
            för vad gruppen får lägga till eller besöka.
          """
          if old not in text:
              raise SystemExit("Arkitekturstycket kunde inte hittas")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: bunx prettier --write docs/architecture.md
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Dokumentera gränser för sökområden"
          git push
