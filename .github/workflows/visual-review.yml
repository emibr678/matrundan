name: Visual review artifacts

on:
  workflow_dispatch:
    inputs:
      paths:
        description: Komma- eller radseparerade demosökvägar att fånga
        required: false
        default: /?demo=1,/matstallen?demo=1,/matstallen/p7?demo=1,/platsunderhall?demo=1
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  screenshots:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.body || '', '- [x] Skapa visuella granskningsbilder') &&
        (
          github.event.action != 'edited' ||
          (
            github.event.changes.body.from != null &&
            !contains(github.event.changes.body.from || '', '- [x] Skapa visuella granskningsbilder')
          )
        )
      )
    concurrency:
      group: visual-review-screenshots-v2-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          show-progress: false

      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          while IFS= read -r -d '' file; do
            sed -i 's/\r$//' "$file"
          done < <(git ls-files -z -- '*.ts' '*.tsx' '*.sql')

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun downloads
        if: runner.environment != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright Chromium
        if: runner.environment != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: visual-review-playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium on GitHub-hosted runner
        if: runner.environment != 'self-hosted'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium on self-hosted runner
        if: runner.environment == 'self-hosted'
        run: bunx playwright install chromium

      - name: Capture review screenshots
        env:
          VISUAL_REVIEW_PATHS: ${{ github.event.inputs.paths || '' }}
        run: bun run test:visual-review

      - name: Upload visual review artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-review-${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.run_id) || format('manual-{0}', github.run_id) }}
          path: visual-review
          if-no-files-found: error
          retention-days: 5

  artifact_cleanup:
    needs: screenshots
    if: >-
      always() &&
      needs.screenshots.result != 'skipped' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          show-progress: false

      - name: Remove superseded visual review artifacts
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const cleanup = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/artifact-lifecycle.cjs`);
            await cleanup({
              github,
              context,
              core,
              prNumber: context.payload.pull_request.number,
              currentRunId: process.env.GITHUB_RUN_ID,
              scope: 'visual',
              keepCurrent: true,
              requireCurrentArtifact: true,
            });
