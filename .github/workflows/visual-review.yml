name: Visual review artifacts

on:
  workflow_dispatch:
    inputs:
      paths:
        description: Komma- eller radseparerade demosökvägar att fånga
        required: false
        default: /?demo=1,/matstallen?demo=1,/matstallen/p7?demo=1
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: visual-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.body || '', '- [x] Skapa visuella granskningsbilder')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: visual-review-playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Capture review screenshots
        env:
          VISUAL_REVIEW_PATHS: ${{ github.event.inputs.paths || '' }}
        run: bun run test:visual-review

      - name: Upload visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.run_id }}
          path: visual-review
          if-no-files-found: error
          retention-days: 14
