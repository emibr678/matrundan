name: Visual review artifacts

on:
  workflow_dispatch:
    inputs:
      paths:
        description: Komma- eller radseparerade demosökvägar att fånga
        required: false
        default: /?demo=1,/matstallen?demo=1,/matstallen/p7?demo=1,/platsunderhall?demo=1
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: visual-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.body || '', '- [x] Skapa visuella granskningsbilder')
      )
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          while IFS= read -r -d '' file; do
            sed -i 's/\r$//' "$file"
          done < <(git ls-files -z -- '*.ts' '*.tsx' '*.sql')

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun downloads
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright Chromium
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: visual-review-playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium on GitHub-hosted runner
        if: runner.environment != 'self-hosted'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium on self-hosted runner
        if: runner.environment == 'self-hosted'
        run: bunx playwright install chromium

      - name: Capture review screenshots
        env:
          VISUAL_REVIEW_PATHS: ${{ github.event.inputs.paths || '' }}
        run: bun run test:visual-review

      - name: Upload visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.run_id }}
          path: visual-review
          if-no-files-found: error
          retention-days: 14
