name: Package 4A.5 cluster bounds

on:
  push:
    branches:
      - feature/package-4a5-maplibre-vector

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/package-4a5-maplibre-vector
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fit cluster contents
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/matrundan/PlaceMap.tsx")
          text = path.read_text()
          old = '''          void source.getClusterExpansionZoom(clusterId).then((zoom) => {
            map.easeTo({
              center: coordinates,
              zoom: Math.min(zoom, MAX_ZOOM),
              duration: 250,
            });
          });'''
          new = '''          void source
            .getClusterLeaves(clusterId, Math.max(Math.ceil(count), 1), 0)
            .then((leaves) => {
              const points = leaves.flatMap((leaf) =>
                leaf.geometry.type === "Point"
                  ? [leaf.geometry.coordinates as [number, number]]
                  : [],
              );
              if (points.length === 0) {
                map.easeTo({
                  center: coordinates,
                  zoom: Math.min(map.getZoom() + 2, MAX_ZOOM),
                  duration: 250,
                });
                return;
              }

              const bounds = points.reduce(
                (current, point) => current.extend(point),
                new mapLibre.LngLatBounds(points[0], points[0]),
              );
              const camera = map.cameraForBounds(bounds, {
                padding: 56,
                maxZoom: MAX_ZOOM,
              });
              map.easeTo({
                center: camera?.center ?? coordinates,
                zoom: Math.min(
                  Math.max(camera?.zoom ?? map.getZoom() + 2, map.getZoom() + 1),
                  MAX_ZOOM,
                ),
                duration: 250,
              });
            })
            .catch((error) => {
              console.error("[Matrundan] Klustret kunde inte öppnas:", error);
              map.easeTo({
                center: coordinates,
                zoom: Math.min(map.getZoom() + 2, MAX_ZOOM),
                duration: 250,
              });
            });'''
          if old not in text:
              raise SystemExit("Expected cluster navigation block not found")
          path.write_text(text.replace(old, new))
          PY
          bunx prettier --write src/components/matrundan/PlaceMap.tsx
      - name: Commit cluster fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/package-4a5-cluster-bounds.yml
          git add src/components/matrundan/PlaceMap.tsx
          git commit -m "Fit map to cluster contents"
          git push origin HEAD:feature/package-4a5-maplibre-vector
