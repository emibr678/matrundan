name: Temporary #214 formatting

on:
  push:
    branches:
      - feat/214-confirm-cross-group-participation
    paths:
      - '.github/workflows/tmp-format-214.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/214-confirm-cross-group-participation
          show-progress: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - name: Apply formatter
        run: |
          bunx prettier --write src/components/matrundan/GuestMemberLinkDialog.tsx src/components/matrundan/SharedVisitMemberProposalDialog.tsx src/lib/matrundan/rpc-client.ts
          rm .github/workflows/tmp-format-214.yml
          git diff --check
      - name: Commit formatter output
        run: |
          git config user.name "Matrundan Agent"
          git config user.email "55993222+emibr678@users.noreply.github.com"
          git add -A
          git commit -m "Applicera formattering efter copygranskning #214"
          git push origin HEAD:feat/214-confirm-cross-group-participation
