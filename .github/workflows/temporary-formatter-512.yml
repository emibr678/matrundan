# Temporary, read-only formatting diagnostic. Must be removed before PR completion.
name: Temporary formatter diagnostics 512
on:
  push:
    branches: [feature/osm-search-in-place-discovery-512]
    paths: [.github/workflows/temporary-formatter-512.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Emit read-only Prettier output for exact source (no writes)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            printf '__FORMAT_BEGIN__%s\n' "$file"
            bunx prettier --log-level silent "$file" | base64 -w 120 | sed 's/^/__FORMAT_DATA__/'
            printf '__FORMAT_END__%s\n' "$file"
          done <<'FILES'
          src/components/matrundan/OsmStagingSearchResults.tsx
          src/components/matrundan/PlaceDiscovery.tsx
          src/components/matrundan/SearchResultSections.tsx
          src/lib/matrundan/osm-staging-preview.test.ts
          src/lib/matrundan/osm-staging-preview.ts
          FILES
