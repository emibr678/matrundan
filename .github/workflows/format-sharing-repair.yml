name: Format sharing repair

on:
  push:
    branches:
      - fix/v1.5-sharing-repair

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: fix/v1.5-sharing-repair

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format dialog files
        run: bunx prettier --write src/components/matrundan/AddPlaceDialogImpl.tsx src/components/matrundan/VisitDialog.tsx

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Dialogfilerna är redan formatterade."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/matrundan/AddPlaceDialogImpl.tsx src/components/matrundan/VisitDialog.tsx
          git commit -m "Format sharing dialog changes"
          git push origin HEAD:fix/v1.5-sharing-repair
