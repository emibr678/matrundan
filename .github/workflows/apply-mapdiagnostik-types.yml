name: Apply map diagnostics type fixes

on:
  pull_request:
    branches: [main]
    paths:
      - src/routes/mapdiagnostik.tsx
      - .github/workflows/apply-mapdiagnostik-types.yml
      - .github/workflows/capture-mapdiagnostik-tsc.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
      - name: Patch, verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/mapdiagnostik.tsx')
          text = path.read_text()
          text = text.replace('          preserveDrawingBuffer: true,\n', '', 1)
          anchor = '  React.useEffect(() => {\n    if (!key) return;\n    let cancelled = false;'
          replacement = '  React.useEffect(() => {\n    if (!key) return;\n    const activeKey = key;\n    let cancelled = false;'
          if anchor not in text:
              raise SystemExit('resource effect anchor missing')
          text = text.replace(anchor, replacement, 1)
          text = text.replace('encodeURIComponent(key)}`;\n      const raster =', 'encodeURIComponent(activeKey)}`;\n      const raster =', 1)
          path.write_text(text)
          PY
          bun install --frozen-lockfile
          bunx prettier --write src/routes/mapdiagnostik.tsx
          bunx tsc --noEmit
          bun run build
          bunx eslint src/routes/mapdiagnostik.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/mapdiagnostik.tsx src/routeTree.gen.ts
          git rm -f .github/workflows/apply-mapdiagnostik-types.yml .github/workflows/capture-mapdiagnostik-tsc.yml
          git commit -m "Rätta typer i kartdiagnostiken"
          git push
