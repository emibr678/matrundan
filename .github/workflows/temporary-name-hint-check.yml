name: Temporary name hint comparison
on:
  push:
    branches:
      - feature/465-robust-place-search
    paths:
      - scripts/temporary-name-hint-check.ts
      - .github/workflows/temporary-name-hint-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    env:
      STAGING_GEOAPIFY_API_KEY: ${{ secrets.STAGING_GEOAPIFY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-bun
      - run: bun scripts/temporary-name-hint-check.ts
