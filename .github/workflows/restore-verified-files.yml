name: Restore verified files

on:
  push:
    branches:
      - agent/issue-163-platsunderhall

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore unrelated files from verified head
        run: |
          git checkout fe84082e3a8c0e5b592099bcc5da7798a629d6da -- \
            CHANGELOG.md \
            package.json \
            bun.lock \
            src/integrations/supabase/types.ts \
            src/routeTree.gen.ts

      - name: Commit exact restore if needed
        run: |
          if git diff --quiet --cached && git diff --quiet; then
            echo "Nothing to restore"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json bun.lock src/integrations/supabase/types.ts src/routeTree.gen.ts
          git commit -m "chore: restore verified generated files"
          git push origin HEAD:agent/issue-163-platsunderhall
