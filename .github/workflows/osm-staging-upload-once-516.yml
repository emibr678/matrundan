name: One-time approved OSM staging snapshot import (Issue 516)

# First commit triggers the single approved staging write; ordinary pushes do not.
on:
  push:
    branches:
      - feature/osm-staging-comparison-516
    paths:
      - .github/workflows/osm-staging-upload-once-516.yml

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: one-time-osm-staging-db-import-516
  cancel-in-progress: false

jobs:
  approved-snapshot:
    name: Import public Sweden OSM data into staging index only
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    environment: staging
    env:
      OSM_WORK: /tmp/osm-staging-upload-516
      STAGING_SUPABASE_PROJECT_ID: wpihfmwbubvdiaavtpia
      STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      OSM_IMPORT_CONFIRMATION: IMPORT_OSM_STAGING_ONLY_516
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout exact approved PR branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify branch and current GitHub PR identity
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "emibr678/matrundan"
          test "$GITHUB_REF" = "refs/heads/feature/osm-staging-comparison-516"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$STAGING_SUPABASE_ACCESS_TOKEN"
          node --input-type=module <<'NODE'
          const expected = process.env.GITHUB_SHA;
          const response = await fetch(
            'https://api.github.com/repos/emibr678/matrundan/pulls/517',
            {
              headers: {
                'accept':'application/vnd.github+json',
                'authorization':'Bearer ' + process.env.GH_READ_TOKEN,
                'x-github-api-version':'2022-11-28',
              },
              signal: AbortSignal.timeout(15000),
            }
          );
          if (!response.ok) throw new Error('Cannot verify approved PR head');
          const pr = await response.json();
          if (pr.state !== 'open' || pr.base?.ref !== 'main'
            || pr.head?.ref !== 'feature/osm-staging-comparison-516'
            || pr.head?.repo?.full_name !== 'emibr678/matrundan'
            || pr.head?.sha !== expected) {
            throw new Error('PR #517 branch or head changed: refuse DB import');
          }
          console.log('Verified Issue #516 PR #517 exact head:', expected);
          NODE
          python3 scripts/diagnostics/osm-staging-upload-516.py --self-test

      - name: Download public Sweden OSM PBF
        run: |
          set -euo pipefail
          mkdir -p "$OSM_WORK"
          curl --fail --location --silent --show-error --retry 0 \
            --connect-timeout 30 --max-time 900 --max-filesize 1300000000 \
            "https://download.geofabrik.de/europe/sweden-latest.osm.pbf" \
            --output "$OSM_WORK/sweden.osm.pbf"
          test -s "$OSM_WORK/sweden.osm.pbf"
          echo "OSM_SHA256=$(sha256sum "$OSM_WORK/sweden.osm.pbf" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Install Osmium and prepare OSM-only source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y osmium-tool
          timestamp="$(osmium fileinfo -g header.option.osmosis_replication_timestamp "$OSM_WORK/sweden.osm.pbf")"
          test -n "$timestamp"
          echo "OSM_TIMESTAMP=$timestamp" >> "$GITHUB_ENV"
          osmium tags-filter --remove-tags \
            "$OSM_WORK/sweden.osm.pbf" \
            "amenity=restaurant,fast_food,cafe,pub,bar,food_court,biergarten,ice_cream" \
            "shop=bakery" \
            -o "$OSM_WORK/food.osm.pbf"
          osmium export "$OSM_WORK/food.osm.pbf" \
            --attributes=type,id \
            --geometry-types=point,linestring,polygon \
            --output-format=geojsonseq \
            -o "$OSM_WORK/food.geojsonseq"
          python3 scripts/diagnostics/osm-staging-prepare-516.py \
            --input "$OSM_WORK/food.geojsonseq" \
            --out "$OSM_WORK/places.csv" \
            --report "$OSM_WORK/quality.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/osm-staging-upload-516/quality.json").read_text())
          assert 18000 <= data["unique_osm_features"] <= 40000
          print('Prepared public OSM objects:',data["unique_osm_features"])
          PY

      - name: Bounded idempotent batches then atomic activation
        run: |
          set -euo pipefail
          python3 scripts/diagnostics/osm-staging-upload-516.py \
            --csv "$OSM_WORK/places.csv" \
            --pbf "$OSM_WORK/sweden.osm.pbf" \
            --report "$OSM_WORK/import-result.json"

      - name: Print public-data-only import receipt
        if: success()
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/osm-staging-upload-516/import-result.json').read_text())
          print('### Issue #516 — Supabase Staging OSM import')
          print('| Verified fact | Result |')
          print('|---|---|')
          for key in ('project','source_timestamp','source_sha256','generation',
            'actual_imported','known_reference_count','places_total_bytes',
            'database_bytes','sql_requests'):
            print(f'| {key} | {r[key]} |')
          print('\nOnly public OSM-derived attributes imported. No group writes.')
          PY

      - name: Upload audit reports only, not PBF CSV or credentials
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osm-staging-import-audit-516
          path: |
            /tmp/osm-staging-upload-516/quality.json
            /tmp/osm-staging-upload-516/import-result.json
          if-no-files-found: warn
          retention-days: 5
