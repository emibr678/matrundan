name: Cloudflare prod publish

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_PROD after authenticated smoke to publish the verified candidate
        required: true
        type: string

permissions:
  actions: read
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: cloudflare-prod-release
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.125.0
  FORCE_COLOR: '0'
  PROD_PUBLIC_URL: https://app.matrundan.workers.dev
  PROD_CANDIDATE_PREVIEW_URL: https://prod-candidate-app.matrundan.workers.dev

jobs:
  publish:
    name: Publish verified prod candidate
    if: github.ref == 'refs/heads/main'
    # Production publication must not depend on an optional local CI runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_API_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Guard explicit publication approval and current main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow may only run from main." >&2
            exit 1
          fi
          if [[ "${{ inputs.confirmation }}" != "PUBLISH_PROD" ]]; then
            echo "confirmation must be exactly PUBLISH_PROD." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Cloudflare production credentials are missing." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$current_main" ]]; then
            echo "Refusing stale prod publish: dispatched SHA is no longer current main." >&2
            echo "dispatched=$GITHUB_SHA" >&2
            echo "current=$current_main" >&2
            exit 1
          fi

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0

      - name: Resolve successful preflight for exact main SHA
        id: preflight
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const url = new URL(
            `https://api.github.com/repos/${owner}/${repo}/actions/workflows/cloudflare-prod-preflight.yml/runs`,
          );
          url.searchParams.set('branch', 'main');
          url.searchParams.set('event', 'workflow_dispatch');
          url.searchParams.set('per_page', '100');

          const response = await fetch(url, {
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GITHUB_API_TOKEN}`,
              'x-github-api-version': '2022-11-28',
            },
            signal: AbortSignal.timeout(10_000),
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok || !Array.isArray(payload?.workflow_runs)) {
            console.error(`Could not list successful prod preflights (HTTP ${response.status}).`);
            process.exit(1);
          }

          const matching = payload.workflow_runs
            .filter((run) => run?.head_sha === process.env.GITHUB_SHA)
            .sort(
              (left, right) =>
                Date.parse(right?.created_at ?? '') - Date.parse(left?.created_at ?? ''),
            );
          const run = matching[0];
          if (!run || !Number.isInteger(run.id)) {
            console.error(
              'No Cloudflare prod preflight exists for exact current main SHA. Run preflight and authenticated smoke first.',
            );
            process.exit(1);
          }
          if (run.status !== 'completed' || run.conclusion !== 'success') {
            console.error(
              `Latest prod preflight for exact current main SHA is not successful (run ${run.id}, status=${run.status}, conclusion=${run.conclusion}). Run a fresh preflight before publication.`,
            );
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run_id=${run.id}\n`);
          console.log(
            `Resolved latest successful prod preflight run ${run.id} for exact main SHA ${process.env.GITHUB_SHA}.`,
          );
          NODE

      - name: Verify Cloudflare production and preview routing contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const apiRoot = `https://api.cloudflare.com/client/v4/accounts/${accountId}`;

          async function cloudflare(path) {
            const response = await fetch(`${apiRoot}${path}`, {
              headers: {
                accept: 'application/json',
                authorization: `Bearer ${token}`,
              },
              signal: AbortSignal.timeout(10_000),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              console.error(`Cloudflare API GET ${path} failed (HTTP ${response.status}).`);
              process.exit(1);
            }
            return payload.result;
          }

          const accountSubdomain = await cloudflare('/workers/subdomain');
          if (typeof accountSubdomain?.subdomain !== 'string' || !accountSubdomain.subdomain) {
            console.error('Cloudflare account does not expose a workers.dev subdomain.');
            process.exit(1);
          }

          const expectedPublicUrl = `https://app.${accountSubdomain.subdomain}.workers.dev`;
          const expectedPreviewUrl = `https://prod-candidate-app.${accountSubdomain.subdomain}.workers.dev`;
          if (expectedPublicUrl !== process.env.PROD_PUBLIC_URL) {
            console.error('Configured production URL does not match the Cloudflare account subdomain.');
            process.exit(1);
          }
          if (expectedPreviewUrl !== process.env.PROD_CANDIDATE_PREVIEW_URL) {
            console.error('Configured production candidate preview URL does not match the Cloudflare account subdomain.');
            process.exit(1);
          }

          const workerSubdomain = await cloudflare('/workers/scripts/app/subdomain');
          if (
            typeof workerSubdomain?.enabled !== 'boolean' ||
            typeof workerSubdomain?.previews_enabled !== 'boolean'
          ) {
            console.error('Cloudflare Worker app subdomain state is incomplete.');
            process.exit(1);
          }

          console.log(
            `Verified Cloudflare workers.dev hostnames (production=${workerSubdomain.enabled}, previews=${workerSubdomain.previews_enabled}).`,
          );
          NODE

      - name: Resolve and verify exact preflight candidate
        id: candidate
        env:
          PREFLIGHT_RUN_ID: ${{ steps.preflight.outputs.run_id }}
        run: |
          set -euo pipefail
          WRANGLER=(npx --yes "wrangler@$WRANGLER_VERSION")
          json_extractor="$RUNNER_TEMP/extract-wrangler-json.cjs"
          cat > "$json_extractor" <<'NODE'
          const fs = require('node:fs');

          const inputPath = process.argv[2];
          const outputPath = process.argv[3];
          const raw = fs.readFileSync(inputPath, 'utf8');

          function extractCandidate(start) {
            const stack = [];
            let inString = false;
            let escaped = false;
            for (let index = start; index < raw.length; index += 1) {
              const char = raw[index];
              if (inString) {
                if (escaped) escaped = false;
                else if (char === '\\') escaped = true;
                else if (char === '"') inString = false;
                continue;
              }
              if (char === '"') {
                inString = true;
                continue;
              }
              if (char === '{' || char === '[') {
                stack.push(char);
                continue;
              }
              if (char === '}' || char === ']') {
                const expectedOpen = char === '}' ? '{' : '[';
                if (stack.at(-1) !== expectedOpen) return null;
                stack.pop();
                if (stack.length === 0) return raw.slice(start, index + 1);
              }
            }
            return null;
          }

          for (let start = 0; start < raw.length; start += 1) {
            if (raw[start] !== '{' && raw[start] !== '[') continue;
            const candidate = extractCandidate(start);
            if (!candidate) continue;
            try {
              const parsed = JSON.parse(candidate);
              fs.writeFileSync(outputPath, `${JSON.stringify(parsed, null, 2)}\n`);
              process.exit(0);
            } catch {
              // Decorative Wrangler output may itself contain brackets. Keep scanning.
            }
          }
          console.error('Wrangler output did not contain a valid JSON object or array.');
          process.exit(1);
          NODE

          run_wrangler_json() {
            local output="$1"
            shift
            local raw="${output}.raw"
            "${WRANGLER[@]}" "$@" > "$raw"
            node "$json_extractor" "$raw" "$output"
            rm -f "$raw"
          }

          run_wrangler_json "$RUNNER_TEMP/prod-versions.json" versions list --env prod --json

          candidate_version_id="$(node - "$RUNNER_TEMP/prod-versions.json" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = Array.isArray(payload) ? payload : (payload?.versions ?? []);
          const tag = `preflight-${process.env.PREFLIGHT_RUN_ID}`;
          const message =
            `Matrundan prod candidate ${process.env.GITHUB_SHA} preflight=${process.env.PREFLIGHT_RUN_ID}`;
          const matches = rows.filter((row) => {
            const text = JSON.stringify(row);
            return text.includes(tag) && text.includes(message);
          });
          if (matches.length !== 1) {
            console.error(
              `Expected exactly one Worker candidate for successful preflight ${process.env.PREFLIGHT_RUN_ID}, found ${matches.length}.`,
            );
            process.exit(1);
          }
          const row = matches[0];
          const id = row?.id ?? row?.version_id ?? row?.versionId;
          if (typeof id !== 'string' || !/^[0-9a-f-]{36}$/i.test(id)) {
            console.error('Could not resolve Worker version ID from the successful preflight candidate.');
            process.exit(1);
          }
          process.stdout.write(id);
          NODE
          )"

          echo "CANDIDATE_VERSION_ID=$candidate_version_id" >> "$GITHUB_ENV"
          echo "version_id=$candidate_version_id" >> "$GITHUB_OUTPUT"

          run_wrangler_json "$RUNNER_TEMP/prod-version-detail.json" versions view "$candidate_version_id" --env prod --json
          run_wrangler_json "$RUNNER_TEMP/prod-deployment-before.json" deployments status --env prod --json

          node - \
            "$RUNNER_TEMP/prod-version-detail.json" \
            "$RUNNER_TEMP/prod-deployment-before.json" \
            "$candidate_version_id" <<'NODE'
          const fs = require('node:fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const versionDetail = read(process.argv[2]);
          const deployment = read(process.argv[3]);
          const versionId = process.argv[4];

          const bindingNames = new Set();
          let environmentBinding = null;
          const visit = (value) => {
            if (!value || typeof value !== 'object') return;
            if (typeof value.name === 'string') {
              bindingNames.add(value.name);
              if (value.name === 'MATRUNDAN_ENVIRONMENT') environmentBinding = value;
            }
            if (Array.isArray(value)) value.forEach(visit);
            else Object.values(value).forEach(visit);
          };
          visit(versionDetail);
          const requiredBindings = [
            'MATRUNDAN_ENVIRONMENT',
            'SUPABASE_PROJECT_ID',
            'SUPABASE_URL',
            'SUPABASE_PUBLISHABLE_KEY',
            'GEOAPIFY_API_KEY',
            'SUPABASE_SERVICE_ROLE_KEY',
            'VAPID_SUBJECT',
            'VAPID_PUBLIC_KEY',
            'VAPID_PRIVATE_KEY',
          ];
          const missingBindings = requiredBindings.filter((name) => !bindingNames.has(name));
          if (missingBindings.length > 0) {
            console.error(
              `Refusing publication; candidate is missing runtime binding(s): ${missingBindings.join(', ')}`,
            );
            process.exit(1);
          }
          if (!JSON.stringify(environmentBinding).includes('prod')) {
            console.error('Refusing publication; candidate does not declare MATRUNDAN_ENVIRONMENT=prod.');
            process.exit(1);
          }

          let candidateAlreadyActive = false;
          const walk = (value) => {
            if (!value || typeof value !== 'object') return;
            if (value.version_id === versionId && Number(value.percentage) === 100) {
              candidateAlreadyActive = true;
            }
            if (Array.isArray(value)) value.forEach(walk);
            else Object.values(value).forEach(walk);
          };
          walk(deployment);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `already_active=${candidateAlreadyActive ? 'true' : 'false'}\n`,
          );
          console.log(
            `Verified exact publish candidate ${versionId} for preflight ${process.env.PREFLIGHT_RUN_ID} and SHA ${process.env.GITHUB_SHA}.`,
          );
          NODE

      - name: Re-check smoke-tested candidate preview
        if: steps.candidate.outputs.already_active != 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const response = await fetch(`${process.env.PROD_CANDIDATE_PREVIEW_URL}/api/health`, {
            headers: { accept: 'application/json', 'cache-control': 'no-cache' },
            signal: AbortSignal.timeout(10_000),
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok || payload?.status !== 'ok' || payload?.release !== process.env.GITHUB_SHA) {
            console.error(`Candidate preview is no longer healthy for the approved SHA (HTTP ${response.status}).`);
            process.exit(1);
          }
          console.log('Candidate preview is still healthy for the exact approved release SHA.');
          NODE

      - name: Promote exact candidate to 100 percent production traffic
        if: steps.candidate.outputs.already_active != 'true'
        run: |
          set -euo pipefail
          WRANGLER=(npx --yes "wrangler@$WRANGLER_VERSION")
          "${WRANGLER[@]}" versions deploy \
            "$CANDIDATE_VERSION_ID@100%" \
            --env prod \
            --yes \
            --message "Matrundan prod publish $GITHUB_SHA"

          raw="$RUNNER_TEMP/prod-deployment-after.json.raw"
          "${WRANGLER[@]}" deployments status --env prod --json > "$raw"
          node "$RUNNER_TEMP/extract-wrangler-json.cjs" "$raw" "$RUNNER_TEMP/prod-deployment-after.json"
          rm -f "$raw"

          node - "$RUNNER_TEMP/prod-deployment-after.json" <<'NODE'
          const fs = require('node:fs');
          const deployment = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const versionId = process.env.CANDIDATE_VERSION_ID;
          let activeAt100 = false;
          const walk = (value) => {
            if (!value || typeof value !== 'object') return;
            if (value.version_id === versionId && Number(value.percentage) === 100) activeAt100 = true;
            if (Array.isArray(value)) value.forEach(walk);
            else Object.values(value).forEach(walk);
          };
          walk(deployment);
          if (!activeAt100) {
            console.error('Cloudflare did not report the approved candidate at 100% production traffic.');
            process.exit(1);
          }
          console.log(`Verified production deployment at 100% candidate ${versionId}.`);
          NODE

      - name: Enable stable production workers.dev route
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const url = `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/app/subdomain`;

          async function request(init = {}) {
            const response = await fetch(url, {
              ...init,
              headers: {
                accept: 'application/json',
                authorization: `Bearer ${token}`,
                ...(init.body ? { 'content-type': 'application/json' } : {}),
              },
              signal: AbortSignal.timeout(10_000),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              console.error(`Cloudflare Worker subdomain update failed (HTTP ${response.status}).`);
              process.exit(1);
            }
            return payload.result;
          }

          const before = await request();
          if (
            typeof before?.enabled !== 'boolean' ||
            typeof before?.previews_enabled !== 'boolean'
          ) {
            console.error('Cloudflare Worker app subdomain state is incomplete.');
            process.exit(1);
          }
          if (before.enabled !== true) {
            await request({
              method: 'POST',
              body: JSON.stringify({
                enabled: true,
                previews_enabled: before.previews_enabled,
              }),
            });
          }
          const after = await request();
          if (
            after?.enabled !== true ||
            after?.previews_enabled !== before.previews_enabled
          ) {
            console.error(
              'Cloudflare did not enable the stable production route while preserving preview routing state.',
            );
            process.exit(1);
          }
          console.log(
            'Enabled stable production workers.dev route while preserving candidate preview routing state.',
          );
          NODE

      - name: Verify public production health and release SHA
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = `${process.env.PROD_PUBLIC_URL}/api/health`;
          let lastFailure = 'production did not respond';
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(url, {
                headers: { accept: 'application/json', 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(10_000),
              });
              const payload = await response.json().catch(() => null);
              if (response.ok && payload?.status === 'ok' && payload?.release === process.env.GITHUB_SHA) {
                console.log(`Verified public production health and release SHA on attempt ${attempt}.`);
                process.exit(0);
              }
              lastFailure = `HTTP ${response.status}, payload=${JSON.stringify(payload)}`;
            } catch (error) {
              lastFailure = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }
          console.error(`Public production health verification failed after promotion: ${lastFailure}`);
          process.exit(1);
          NODE

      - name: Create immutable release tag and GitHub Release metadata
        id: release
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const versionSource = fs.readFileSync('src/lib/matrundan/version.ts', 'utf8');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const versionMatch = versionSource.match(/version:\s*"([0-9]+\.[0-9]+\.[0-9]+)"/);
          const topReleaseMatch = changelog.match(
            /^## \[([0-9]+\.[0-9]+\.[0-9]+)\] – (\d{4}-\d{2}-\d{2})$/m,
          );
          if (!versionMatch || !topReleaseMatch || versionMatch[1] !== topReleaseMatch[1]) {
            console.error('Current app version and top CHANGELOG release are inconsistent.');
            process.exit(1);
          }

          const version = versionMatch[1];
          const date = topReleaseMatch[2];
          const tagName = `v${version}`;
          const escapedVersion = version.replaceAll('.', '\\.');
          const summaryMatch = versionSource.match(
            new RegExp(
              `version:\\s*"${escapedVersion}",\\s*date:\\s*"[^"]+",\\s*summary:\\s*"([^"]+)"`,
            ),
          );
          const releaseSummary = summaryMatch?.[1]?.trim().replace(/\.$/u, '').trim();
          if (!releaseSummary) {
            console.error(`Version ${version} is missing a usable release summary.`);
            process.exit(1);
          }
          const releaseTitle = `Matrundan v${version} — ${releaseSummary}`;
          const bodyStart = topReleaseMatch.index + topReleaseMatch[0].length;
          const tail = changelog.slice(bodyStart);
          const nextReleaseOffset = tail.search(/^## \[/m);
          const notes = (nextReleaseOffset >= 0 ? tail.slice(0, nextReleaseOffset) : tail).trim();
          if (!notes) {
            console.error(`CHANGELOG release ${version} has no release notes.`);
            process.exit(1);
          }

          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const apiRoot = `https://api.github.com/repos/${owner}/${repo}`;
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GITHUB_API_TOKEN}`,
            'content-type': 'application/json',
            'x-github-api-version': '2022-11-28',
          };

          async function request(path, init = {}) {
            const response = await fetch(`${apiRoot}${path}`, {
              ...init,
              headers: { ...headers, ...(init.headers ?? {}) },
              signal: AbortSignal.timeout(10_000),
            });
            const payload = await response.json().catch(() => null);
            return { response, payload };
          }

          async function resolveTagCommit(object) {
            let current = object;
            for (let depth = 0; depth < 5; depth += 1) {
              if (current?.type === 'commit' && typeof current.sha === 'string') return current.sha;
              if (current?.type !== 'tag' || typeof current.sha !== 'string') break;
              const { response, payload } = await request(`/git/tags/${current.sha}`);
              if (!response.ok) {
                console.error(`Could not resolve annotated tag ${tagName} (HTTP ${response.status}).`);
                process.exit(1);
              }
              current = payload?.object;
            }
            console.error(`Could not resolve ${tagName} to a commit.`);
            process.exit(1);
          }

          const tagPath = `/git/ref/tags/${encodeURIComponent(tagName)}`;
          let tagResult = await request(tagPath);
          if (tagResult.response.status === 404) {
            tagResult = await request('/git/refs', {
              method: 'POST',
              body: JSON.stringify({
                ref: `refs/tags/${tagName}`,
                sha: process.env.GITHUB_SHA,
              }),
            });
            if (!tagResult.response.ok) {
              console.error(`Could not create release tag ${tagName} (HTTP ${tagResult.response.status}).`);
              process.exit(1);
            }
            console.log(`Created release tag ${tagName} at ${process.env.GITHUB_SHA}.`);
          } else if (!tagResult.response.ok) {
            console.error(`Could not read release tag ${tagName} (HTTP ${tagResult.response.status}).`);
            process.exit(1);
          }

          const tagCommit = await resolveTagCommit(tagResult.payload?.object);
          if (tagCommit !== process.env.GITHUB_SHA) {
            console.error(
              `Refusing to move immutable release tag ${tagName}: it points to ${tagCommit}, not ${process.env.GITHUB_SHA}.`,
            );
            process.exit(1);
          }

          const releasePath = `/releases/tags/${encodeURIComponent(tagName)}`;
          const releaseResult = await request(releasePath);
          if (releaseResult.response.status === 404) {
            const created = await request('/releases', {
              method: 'POST',
              body: JSON.stringify({
                tag_name: tagName,
                target_commitish: process.env.GITHUB_SHA,
                name: releaseTitle,
                body: `Publicerad ${date}.\n\n${notes}\n`,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              }),
            });
            if (!created.response.ok) {
              console.error(
                `Could not create GitHub Release ${tagName} (HTTP ${created.response.status}).`,
              );
              process.exit(1);
            }
            console.log(`Created GitHub Release ${tagName}: ${releaseTitle}.`);
          } else if (!releaseResult.response.ok) {
            console.error(
              `Could not read GitHub Release ${tagName} (HTTP ${releaseResult.response.status}).`,
            );
            process.exit(1);
          } else if (releaseResult.payload?.draft || releaseResult.payload?.prerelease) {
            console.error(`Existing GitHub Release ${tagName} is not a normal published release.`);
            process.exit(1);
          } else {
            console.log(`GitHub Release ${tagName} already exists on the immutable tag.`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tagName}\n`);
          NODE

      - name: Disable production candidate Preview URLs after successful publication
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const url = `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/app/subdomain`;

          async function request(init = {}) {
            const response = await fetch(url, {
              ...init,
              headers: {
                accept: 'application/json',
                authorization: `Bearer ${token}`,
                ...(init.body ? { 'content-type': 'application/json' } : {}),
              },
              signal: AbortSignal.timeout(10_000),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              console.error(`Cloudflare Worker subdomain update failed (HTTP ${response.status}).`);
              process.exit(1);
            }
            return payload.result;
          }

          await request({
            method: 'POST',
            body: JSON.stringify({ enabled: true, previews_enabled: false }),
          });
          const after = await request();
          if (after?.enabled !== true || after?.previews_enabled !== false) {
            console.error('Cloudflare did not preserve production routing while disabling Preview URLs.');
            process.exit(1);
          }
          console.log('Disabled production candidate Preview URLs while preserving stable production routing.');
          NODE

      - name: Summarize publication
        if: success()
        run: |
          {
            echo '## Cloudflare prod publication'
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo "- Preflight run: \`${{ steps.preflight.outputs.run_id }}\`"
            echo "- Worker version: \`$CANDIDATE_VERSION_ID\`"
            echo "- GitHub Release: \`${{ steps.release.outputs.tag }}\`"
            echo '- Candidate identity/bindings: re-verified before promotion'
            echo '- Candidate preview health: re-verified before promotion'
            echo '- Production traffic: 100% on the exact approved candidate'
            echo "- Stable workers.dev route + public health/release SHA: verified at $PROD_PUBLIC_URL/api/health"
            echo '- Production candidate Preview URLs: disabled after successful public health verification'
            echo '- Database deployment: not performed by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral production files
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/extract-wrangler-json.cjs" \
            "$RUNNER_TEMP/prod-versions.json"* \
            "$RUNNER_TEMP/prod-version-detail.json"* \
            "$RUNNER_TEMP/prod-deployment-before.json"* \
            "$RUNNER_TEMP/prod-deployment-after.json"*