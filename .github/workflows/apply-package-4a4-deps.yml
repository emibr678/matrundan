name: Apply Package 4A.4 dependencies

on:
  push:
    branches:
      - feature/package-4a4-marker-clustering

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/package-4a4-marker-clustering
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Add marker clustering dependencies
        run: |
          bun add leaflet.markercluster@1.5.3
          bun add --dev @types/leaflet.markercluster@1.5.6
          rm .github/workflows/apply-package-4a4-deps.yml

      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock .github/workflows/apply-package-4a4-deps.yml
          git commit -m "Add local Leaflet marker clustering"
          git push origin HEAD:feature/package-4a4-marker-clustering
