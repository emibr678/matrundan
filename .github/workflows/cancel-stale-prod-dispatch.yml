name: Cancel stale prod dispatch

on:
  push:
    branches:
      - ops/issue-260-prod-candidate-oauth-smoke

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete self-hosted dispatch run
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
          STALE_RUN_ID: '33951181980'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const runId = process.env.STALE_RUN_ID;
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GITHUB_API_TOKEN}`,
            'x-github-api-version': '2022-11-28',
          };
          const root = `https://api.github.com/repos/${owner}/${repo}/actions/runs/${runId}`;
          const before = await fetch(root, { headers });
          const beforePayload = await before.json();
          if (!before.ok) throw new Error(`Could not read stale run (${before.status}).`);
          if (beforePayload.status === 'completed') {
            console.log(`Stale run already completed as ${beforePayload.conclusion}.`);
            process.exit(0);
          }
          if (beforePayload.head_sha !== 'f91bd6cd5a323b0859054a27ee43c2711353927e') {
            throw new Error(`Refusing to cancel unexpected run head ${beforePayload.head_sha}.`);
          }
          const cancel = await fetch(`${root}/cancel`, { method: 'POST', headers });
          if (cancel.status !== 202) {
            throw new Error(`Cancel request failed (${cancel.status}).`);
          }
          console.log(`Requested cancellation of obsolete queued run ${runId}.`);
          NODE
