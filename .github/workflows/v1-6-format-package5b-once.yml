name: Format package 5B test once

on:
  push:
    branches:
      - agent/v1-6-multiple-search-areas
    paths:
      - .github/workflows/v1-6-format-package5b-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-6-multiple-search-areas
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Format test
        run: bunx prettier --write tests/e2e/package-5b.spec.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/package-5b.spec.ts
          git commit -m "Formatera flerträffstestet"
          git push origin HEAD:agent/v1-6-multiple-search-areas
