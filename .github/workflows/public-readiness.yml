name: Public readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-secret-scan:
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Repository public-readiness guard
        run: bun run check:public-readiness

      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
