name: Public readiness

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact current main SHA for agent-triggered verification
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  history-secret-scan:
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0

      - name: Validate exact main SHA when requested
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const expectedSha = process.env.EXPECTED_SHA ?? '';
          if (!/^[0-9a-f]{40}$/.test(expectedSha)) {
            console.error('expected_sha must be a full 40-character Git SHA.');
            process.exit(1);
          }

          const checkedOutSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (checkedOutSha !== expectedSha) {
            console.error(`Checked out ${checkedOutSha}, expected ${expectedSha}.`);
            process.exit(1);
          }

          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/branches/main`, {
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GITHUB_API_TOKEN}`,
              'x-github-api-version': '2022-11-28',
            },
            signal: AbortSignal.timeout(10_000),
          });
          const payload = await response.json().catch(() => null);
          const mainSha = payload?.commit?.sha;
          if (!response.ok || typeof mainSha !== 'string') {
            console.error(`Could not resolve current main SHA (HTTP ${response.status}).`);
            process.exit(1);
          }
          if (mainSha !== expectedSha) {
            console.error(`Current main is ${mainSha}; refusing stale public-readiness run for ${expectedSha}.`);
            process.exit(1);
          }
          NODE

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Repository public-readiness guard
        run: bun run check:public-readiness

      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
