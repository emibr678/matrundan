name: Temporary artifact cleanup

on:
  push:
    branches:
      - agent/actions-artifact-cleanup-once

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.repository == 'emibr678/matrundan' && github.ref == 'refs/heads/agent/actions-artifact-cleanup-once'
    runs-on: matrundan-self-hosted
    timeout-minutes: 10

    steps:
      - name: Delete legacy-retention artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const DAY = 24 * 60 * 60 * 1000;
            const now = Date.now();
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );

            const candidates = artifacts.filter((artifact) => {
              if (artifact.expired || !artifact.created_at || !artifact.expires_at) return false;
              const createdAt = new Date(artifact.created_at).getTime();
              const expiresAt = new Date(artifact.expires_at).getTime();
              return expiresAt - createdAt > 7 * DAY && now - createdAt > DAY;
            });

            let deleted = 0;
            let deletedBytes = 0;
            const failures = [];

            for (const artifact of candidates) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                deletedBytes += artifact.size_in_bytes || 0;
              } catch (error) {
                failures.push(`${artifact.id}: ${error.message}`);
              }
            }

            const mib = (deletedBytes / 1024 / 1024).toFixed(1);
            core.info(`Found ${artifacts.length} artifacts; deleted ${deleted} legacy-retention artifacts (${mib} MiB).`);

            await core.summary
              .addHeading('Artifact cleanup')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Artifacts found', String(artifacts.length)],
                ['Cleanup candidates', String(candidates.length)],
                ['Deleted', String(deleted)],
                ['Deleted size', `${mib} MiB`],
                ['Failures', String(failures.length)],
              ])
              .write();

            if (failures.length > 0) {
              core.setFailed(`Failed to delete ${failures.length} artifact(s).`);
            }
