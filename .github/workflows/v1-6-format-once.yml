name: Format v1.6 once

on:
  push:
    branches:
      - agent/v1-6-multiple-search-areas
    paths:
      - .github/workflows/v1-6-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1-6-multiple-search-areas
          fetch-depth: 0

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed files
        env:
          MATRUNDAN_BASE_SHA: ${{ github.event.repository.default_branch }}
        run: bun run format:changed

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Inga formateringsändringar behövdes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Formatera v1.6-källor"
          git push origin HEAD:agent/v1-6-multiple-search-areas
