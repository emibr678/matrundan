name: Patch Paket 5B release

on:
  push:
    branches:
      - agent/paket-5b-flera-stallen
    paths:
      - .github/workflows/patch-5b-release.yml
      - scripts/patch-5b-release.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/paket-5b-flera-stallen
          fetch-depth: 0

      - name: Apply release patch
        run: python3 scripts/patch-5b-release.py

      - name: Commit release files
        run: |
          git config user.name "Matrundan automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/matrundan/version.ts README.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Paket 5B: synka releaseinformation för 0.13.0"
          git push origin HEAD:agent/paket-5b-flera-stallen
