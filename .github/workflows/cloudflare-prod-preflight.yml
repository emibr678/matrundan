name: Cloudflare prod preflight

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA that should be inspected/uploaded
        required: true
        type: string
      upload_version:
        description: Upload an inert Worker app candidate after preflight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: cloudflare-prod-release
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.125.0
  FORCE_COLOR: '0'
  PROD_PUBLIC_URL: https://app.matrundan.workers.dev
  PROD_CANDIDATE_PREVIEW_URL: https://prod-candidate-app.matrundan.workers.dev

jobs:
  preflight:
    name: Cloudflare prod preflight
    if: github.ref == 'refs/heads/main'
    # This job may read production credentials and upload an inert Worker version,
    # but it never restores data or promotes production traffic.
    # Production preflight must not depend on an optional local CI runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      CI: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_SUPABASE_PROJECT_ID: ${{ vars.PROD_SUPABASE_PROJECT_ID }}
      PROD_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
      PROD_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY }}
      PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      PROD_GEOAPIFY_MAPS_KEY: ${{ vars.PROD_GEOAPIFY_MAPS_KEY }}
      PROD_GEOAPIFY_API_KEY: ${{ secrets.PROD_GEOAPIFY_API_KEY }}
      PROD_VAPID_SUBJECT: ${{ vars.PROD_VAPID_SUBJECT }}
      PROD_VAPID_PUBLIC_KEY: ${{ vars.PROD_VAPID_PUBLIC_KEY }}

    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Guard trusted ref and exact SHA
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow may only run from main." >&2
            exit 1
          fi
          if [[ ! "${{ inputs.expected_sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character Git SHA." >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "${{ inputs.expected_sha }}" ]]; then
            echo "Expected SHA does not match the checked-out main SHA." >&2
            echo "expected=${{ inputs.expected_sha }}" >&2
            echo "actual=$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Validate complete GitHub production environment
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            PROD_SUPABASE_PROJECT_ID
            PROD_SUPABASE_URL
            PROD_SUPABASE_PUBLISHABLE_KEY
            PROD_SUPABASE_SERVICE_ROLE_KEY
            PROD_GEOAPIFY_MAPS_KEY
            PROD_GEOAPIFY_API_KEY
            PROD_VAPID_SUBJECT
            PROD_VAPID_PUBLIC_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          expected_supabase_url="https://${PROD_SUPABASE_PROJECT_ID}.supabase.co"
          if [[ "$PROD_SUPABASE_URL" != "$expected_supabase_url" ]]; then
            echo "PROD_SUPABASE_URL does not match PROD_SUPABASE_PROJECT_ID." >&2
            exit 1
          fi
          if [[ "$PROD_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "PROD_SUPABASE_PUBLISHABLE_KEY must use the modern sb_publishable_ format." >&2
            exit 1
          fi
          if [[ "$PROD_VAPID_SUBJECT" != "$PROD_PUBLIC_URL" ]]; then
            echo "PROD_VAPID_SUBJECT must match the locked production URL." >&2
            exit 1
          fi

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Validate VAPID public key format
        run: |
          set -euo pipefail
          node <<'NODE'
          const { ECDH } = require('node:crypto');

          const key = process.env.PROD_VAPID_PUBLIC_KEY ?? '';
          const decoded = Buffer.from(key, 'base64url');
          if (
            decoded.length !== 65 ||
            decoded[0] !== 0x04 ||
            decoded.toString('base64url') !== key
          ) {
            console.error('PROD_VAPID_PUBLIC_KEY must be a canonical 65-byte uncompressed P-256 public key in base64url format.');
            process.exit(1);
          }

          try {
            const normalized = ECDH.convertKey(
              decoded,
              'prime256v1',
              undefined,
              undefined,
              'uncompressed',
            );
            if (!normalized.equals(decoded)) {
              throw new Error('Unexpected P-256 point normalization.');
            }
          } catch {
            console.error('PROD_VAPID_PUBLIC_KEY is not a valid P-256 public point.');
            process.exit(1);
          }

          console.log('Verified PROD_VAPID_PUBLIC_KEY as a valid uncompressed P-256 point.');
          NODE

      - name: Ensure production candidate preview routing without production traffic
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const apiRoot = `https://api.cloudflare.com/client/v4/accounts/${accountId}`;

          async function cloudflare(path, init = {}) {
            const response = await fetch(`${apiRoot}${path}`, {
              ...init,
              headers: {
                accept: 'application/json',
                authorization: `Bearer ${token}`,
                ...(init.body ? { 'content-type': 'application/json' } : {}),
                ...(init.headers ?? {}),
              },
              signal: AbortSignal.timeout(10_000),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok || payload?.success !== true) {
              const codes = Array.isArray(payload?.errors)
                ? payload.errors.map((error) => error?.code).filter(Boolean).join(',')
                : '';
              console.error(
                `Cloudflare API ${init.method ?? 'GET'} ${path} failed (HTTP ${response.status}${codes ? `, codes=${codes}` : ''}).`,
              );
              process.exit(1);
            }
            return payload.result;
          }

          const accountSubdomain = await cloudflare('/workers/subdomain');
          if (typeof accountSubdomain?.subdomain !== 'string' || !accountSubdomain.subdomain) {
            console.error('Cloudflare account does not expose a workers.dev subdomain.');
            process.exit(1);
          }

          const expectedPreviewUrl = `https://prod-candidate-app.${accountSubdomain.subdomain}.workers.dev`;
          if (expectedPreviewUrl !== process.env.PROD_CANDIDATE_PREVIEW_URL) {
            console.error('Configured production candidate preview URL does not match the Cloudflare account subdomain.');
            process.exit(1);
          }

          const path = '/workers/scripts/app/subdomain';
          const before = await cloudflare(path);
          if (typeof before?.enabled !== 'boolean' || typeof before?.previews_enabled !== 'boolean') {
            console.error('Cloudflare Worker app subdomain state is incomplete.');
            process.exit(1);
          }

          if (!before.previews_enabled) {
            await cloudflare(path, {
              method: 'POST',
              body: JSON.stringify({
                enabled: before.enabled,
                previews_enabled: true,
              }),
            });
          }

          const after = await cloudflare(path);
          if (after?.enabled !== before.enabled) {
            console.error('Refusing preflight because enabling Preview URLs changed production workers.dev availability.');
            process.exit(1);
          }
          if (after?.previews_enabled !== true) {
            console.error('Cloudflare Preview URLs are still disabled for Worker app.');
            process.exit(1);
          }

          console.log(`Verified Preview URLs at ${expectedPreviewUrl} without changing production workers.dev availability.`);
          NODE

      - name: Validate production provider credentials and browser origins
        run: |
          set -euo pipefail
          node <<'NODE'
          async function fetchWithTimeout(url, init = {}) {
            return fetch(url, {
              ...init,
              signal: AbortSignal.timeout(10_000),
            });
          }

          const supabaseRoot = new URL('/rest/v1/', process.env.PROD_SUPABASE_URL);
          const supabaseResponse = await fetchWithTimeout(supabaseRoot, {
            headers: {
              accept: 'application/json',
              apikey: process.env.PROD_SUPABASE_SERVICE_ROLE_KEY,
            },
          });
          await supabaseResponse.body?.cancel();
          if (supabaseResponse.status !== 200) {
            console.error(`PROD_SUPABASE_SERVICE_ROLE_KEY failed the admin-level PostgREST root probe (${supabaseResponse.status}).`);
            process.exit(1);
          }

          const geoapifyServerUrl = new URL('https://api.geoapify.com/v1/geocode/search');
          geoapifyServerUrl.searchParams.set('text', 'Stockholm');
          geoapifyServerUrl.searchParams.set('limit', '1');
          geoapifyServerUrl.searchParams.set('format', 'json');
          geoapifyServerUrl.searchParams.set('apiKey', process.env.PROD_GEOAPIFY_API_KEY);
          const geoapifyServerResponse = await fetchWithTimeout(geoapifyServerUrl, {
            headers: { accept: 'application/json' },
          });
          await geoapifyServerResponse.body?.cancel();
          if (!geoapifyServerResponse.ok) {
            console.error(`PROD_GEOAPIFY_API_KEY failed the server probe (${geoapifyServerResponse.status}).`);
            process.exit(1);
          }

          for (const origin of [process.env.PROD_PUBLIC_URL, process.env.PROD_CANDIDATE_PREVIEW_URL]) {
            const styleUrl = new URL('https://maps.geoapify.com/v1/styles/osm-bright-grey/style.json');
            styleUrl.searchParams.set('apiKey', process.env.PROD_GEOAPIFY_MAPS_KEY);
            const styleResponse = await fetchWithTimeout(styleUrl, {
              headers: {
                accept: 'application/json',
                origin,
                referer: `${origin}/`,
              },
            });
            await styleResponse.body?.cancel();
            if (!styleResponse.ok) {
              console.error(`PROD_GEOAPIFY_MAPS_KEY rejected browser origin ${origin} (${styleResponse.status}).`);
              process.exit(1);
            }
          }

          console.log('Verified production Supabase server credential and Geoapify server/browser credentials.');
          NODE

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Cloudflare access and existing VAPID private key
        run: |
          set -euo pipefail
          WRANGLER=(npx --yes "wrangler@$WRANGLER_VERSION")
          json_extractor="$RUNNER_TEMP/extract-wrangler-json.cjs"
          cat > "$json_extractor" <<'NODE'
          const fs = require('node:fs');

          const inputPath = process.argv[2];
          const outputPath = process.argv[3];
          const raw = fs.readFileSync(inputPath, 'utf8');

          function extractCandidate(start) {
            const stack = [];
            let inString = false;
            let escaped = false;

            for (let index = start; index < raw.length; index += 1) {
              const char = raw[index];
              if (inString) {
                if (escaped) escaped = false;
                else if (char === '\\') escaped = true;
                else if (char === '"') inString = false;
                continue;
              }

              if (char === '"') {
                inString = true;
                continue;
              }
              if (char === '{' || char === '[') {
                stack.push(char);
                continue;
              }
              if (char === '}' || char === ']') {
                const expectedOpen = char === '}' ? '{' : '[';
                if (stack.at(-1) !== expectedOpen) return null;
                stack.pop();
                if (stack.length === 0) return raw.slice(start, index + 1);
              }
            }
            return null;
          }

          for (let start = 0; start < raw.length; start += 1) {
            if (raw[start] !== '{' && raw[start] !== '[') continue;
            const candidate = extractCandidate(start);
            if (!candidate) continue;
            try {
              const parsed = JSON.parse(candidate);
              fs.writeFileSync(outputPath, `${JSON.stringify(parsed, null, 2)}\n`);
              process.exit(0);
            } catch {
              // Decorative Wrangler output may itself contain brackets. Keep scanning.
            }
          }

          console.error('Wrangler output did not contain a valid JSON object or array.');
          process.exit(1);
          NODE

          run_wrangler_json() {
            local output="$1"
            shift
            local raw="${output}.raw"
            "${WRANGLER[@]}" "$@" > "$raw"
            node "$json_extractor" "$raw" "$output"
            rm -f "$raw"
          }

          run_wrangler_json "$RUNNER_TEMP/prod-secrets-before.json" secret list --env prod --format json
          node - "$RUNNER_TEMP/prod-secrets-before.json" <<'NODE'
          const fs = require('node:fs');
          const configured = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const names = new Set(configured.map((entry) => entry.name));
          if (!names.has('VAPID_PRIVATE_KEY')) {
            console.error('Missing Worker app secret: VAPID_PRIVATE_KEY. Run the one-time VAPID bootstrap first.');
            process.exit(1);
          }
          console.log('Verified existing VAPID_PRIVATE_KEY binding on Worker app.');
          NODE
          run_wrangler_json "$RUNNER_TEMP/prod-deployment-before.json" deployments status --env prod --json
          run_wrangler_json "$RUNNER_TEMP/prod-versions-before.json" versions list --env prod --json

      - name: Generate deterministic prod candidate config
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.json', 'utf8'));
          const prod = config.env?.prod;
          if (!prod || prod.name !== 'app') {
            throw new Error('wrangler.json must define env.prod as Worker app.');
          }

          config.keep_vars = false;
          prod.preview_urls = true;
          delete prod.keep_vars;
          prod.vars = {
            ...(prod.vars ?? {}),
            MATRUNDAN_ENVIRONMENT: 'prod',
            SUPABASE_PROJECT_ID: process.env.PROD_SUPABASE_PROJECT_ID,
            SUPABASE_URL: process.env.PROD_SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY: process.env.PROD_SUPABASE_PUBLISHABLE_KEY,
            VAPID_SUBJECT: process.env.PROD_VAPID_SUBJECT,
            VAPID_PUBLIC_KEY: process.env.PROD_VAPID_PUBLIC_KEY,
          };
          fs.writeFileSync('wrangler.prod.ci.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Build exact production candidate
        env:
          SUPABASE_PROJECT_ID: ${{ vars.PROD_SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.PROD_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ vars.PROD_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PROD_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GEOAPIFY_MAPS_KEY: ${{ vars.PROD_GEOAPIFY_MAPS_KEY }}
          VAPID_SUBJECT: ${{ vars.PROD_VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ vars.PROD_VAPID_PUBLIC_KEY }}
          MATRUNDAN_ENVIRONMENT: prod
          MATRUNDAN_RELEASE_SHA: ${{ github.sha }}
        run: bun run cloudflare:build

      - name: Upload and verify inert Worker app candidate
        id: upload
        if: inputs.upload_version == true
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/prod-candidate-secrets.json"
          wrangler_output="$RUNNER_TEMP/prod-upload-output.jsonl"
          upload_log="$RUNNER_TEMP/prod-upload.log"
          json_extractor="$RUNNER_TEMP/extract-wrangler-json.cjs"
          cleanup_secret_file() {
            rm -f "$secrets_file"
          }
          trap cleanup_secret_file EXIT
          umask 077

          node - "$secrets_file" <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(
            process.argv[2],
            `${JSON.stringify({
              GEOAPIFY_API_KEY: process.env.PROD_GEOAPIFY_API_KEY,
              SUPABASE_SERVICE_ROLE_KEY: process.env.PROD_SUPABASE_SERVICE_ROLE_KEY,
            })}\n`,
            { mode: 0o600 },
          );
          NODE

          WRANGLER=(npx --yes "wrangler@$WRANGLER_VERSION")
          normalize_wrangler_json() {
            local output="$1"
            shift
            local raw="${output}.raw"
            "${WRANGLER[@]}" "$@" > "$raw"
            node "$json_extractor" "$raw" "$output"
            rm -f "$raw"
          }

          short_sha="${GITHUB_SHA:0:12}"
          rm -f "$wrangler_output" "$upload_log"
          WRANGLER_OUTPUT_FILE_PATH="$wrangler_output" \
            "${WRANGLER[@]}" versions upload \
              --config wrangler.prod.ci.json \
              --env prod \
              --secrets-file "$secrets_file" \
              --keep-vars=false \
              --strict \
              --preview-alias prod-candidate \
              --tag "sha-$short_sha" \
              --message "Matrundan prod candidate $GITHUB_SHA" \
              2>&1 | tee "$upload_log"

          version_id="$(node - "$wrangler_output" <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync(process.argv[2], 'utf8').split(/\r?\n/).filter(Boolean);
          const entries = lines.map((line) => JSON.parse(line));
          const upload = entries.filter((entry) => entry.type === 'version-upload').at(-1);
          const id = upload?.version_id ?? upload?.versionId ?? upload?.id;
          if (typeof id !== 'string' || !/^[0-9a-f-]{36}$/i.test(id)) {
            console.error('Could not determine the uploaded Worker version ID from Wrangler output.');
            process.exit(1);
          }
          process.stdout.write(id);
          NODE
          )"

          normalize_wrangler_json "$RUNNER_TEMP/prod-version-detail.json" versions view "$version_id" --env prod --json
          normalize_wrangler_json "$RUNNER_TEMP/prod-versions-after.json" versions list --env prod --json
          normalize_wrangler_json "$RUNNER_TEMP/prod-deployment-after.json" deployments status --env prod --json

          node - \
            "$RUNNER_TEMP/prod-deployment-before.json" \
            "$RUNNER_TEMP/prod-deployment-after.json" \
            "$RUNNER_TEMP/prod-versions-before.json" \
            "$RUNNER_TEMP/prod-versions-after.json" \
            "$RUNNER_TEMP/prod-version-detail.json" \
            "$version_id" <<'NODE'
          const fs = require('node:fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const beforeDeployment = read(process.argv[2]);
          const afterDeployment = read(process.argv[3]);
          const beforeVersions = read(process.argv[4]);
          const afterVersions = read(process.argv[5]);
          const versionDetail = read(process.argv[6]);
          const versionId = process.argv[7];
          const tag = `sha-${process.env.GITHUB_SHA.slice(0, 12)}`;
          const message = `Matrundan prod candidate ${process.env.GITHUB_SHA}`;

          if (JSON.stringify(beforeDeployment) !== JSON.stringify(afterDeployment)) {
            console.error('Active Cloudflare deployment changed during prod preflight.');
            process.exit(1);
          }
          if (JSON.stringify(beforeVersions).includes(versionId)) {
            console.error('Uploaded version ID already existed before the prod preflight.');
            process.exit(1);
          }
          const afterText = JSON.stringify(afterVersions);
          if (!afterText.includes(versionId) || !afterText.includes(tag) || !afterText.includes(message)) {
            console.error('Uploaded Worker version could not be matched to the expected SHA/tag/message.');
            process.exit(1);
          }

          const bindingNames = new Set();
          const visit = (value) => {
            if (!value || typeof value !== 'object') return;
            if (typeof value.name === 'string') bindingNames.add(value.name);
            if (Array.isArray(value)) value.forEach(visit);
            else Object.values(value).forEach(visit);
          };
          visit(versionDetail);
          const requiredBindings = [
            'MATRUNDAN_ENVIRONMENT',
            'SUPABASE_PROJECT_ID',
            'SUPABASE_URL',
            'SUPABASE_PUBLISHABLE_KEY',
            'GEOAPIFY_API_KEY',
            'SUPABASE_SERVICE_ROLE_KEY',
            'VAPID_SUBJECT',
            'VAPID_PUBLIC_KEY',
            'VAPID_PRIVATE_KEY',
          ];
          const missingBindings = requiredBindings.filter((name) => !bindingNames.has(name));
          if (missingBindings.length > 0) {
            console.error(`Candidate version is missing runtime binding(s): ${missingBindings.join(', ')}`);
            process.exit(1);
          }
          console.log(`Verified exact inert candidate version ${versionId} with complete runtime bindings and unchanged production deployment.`);
          NODE

          node <<'NODE'
          const expectedRelease = process.env.GITHUB_SHA;
          const url = `${process.env.PROD_CANDIDATE_PREVIEW_URL}/api/health`;
          let lastFailure = 'preview did not respond';

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(url, {
                headers: { accept: 'application/json', 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(10_000),
              });
              const payload = await response.json().catch(() => null);
              if (response.ok && payload?.status === 'ok' && payload?.release === expectedRelease) {
                console.log(`Verified candidate health and release SHA on attempt ${attempt}.`);
                process.exit(0);
              }
              lastFailure = `HTTP ${response.status}, payload=${JSON.stringify(payload)}`;
            } catch (error) {
              lastFailure = error instanceof Error ? error.message : String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }

          console.error(`Candidate preview health verification failed: ${lastFailure}`);
          process.exit(1);
          NODE

          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PROD_CANDIDATE_PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Summarize preflight
        if: success()
        run: |
          {
            echo '## Cloudflare prod preflight'
            echo
            echo "- SHA: \`$GITHUB_SHA\`"
            echo '- Worker: `app` (`--env prod`)'
            echo '- GitHub production configuration: complete'
            echo '- Preview URLs: enabled without changing production workers.dev availability'
            echo '- Supabase privileged credential: verified against production project'
            echo '- Geoapify server key + production/preview browser origins: verified'
            echo '- Existing VAPID private key: verified'
            echo '- Production build: verified'
            if [[ "${{ inputs.upload_version }}" == "true" ]]; then
              echo "- Candidate version: \`${{ steps.upload.outputs.version_id }}\`"
              echo "- Candidate preview: ${{ steps.upload.outputs.preview_url }}"
              echo '- Candidate runtime bindings + health/release SHA: verified'
              echo '- Active production deployment: unchanged'
              echo '- Next manual gate: authenticated smoke on the candidate preview; add this exact preview URL to the Supabase Auth redirect allowlist if needed'
            else
              echo '- Inert candidate upload: skipped (read-only preflight)'
            fi
            echo '- Public production deployment: not performed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral production files
        if: always()
        run: |
          rm -f \
            wrangler.prod.ci.json \
            "$RUNNER_TEMP/extract-wrangler-json.cjs" \
            "$RUNNER_TEMP/prod-secrets-before.json"* \
            "$RUNNER_TEMP/prod-deployment-before.json"* \
            "$RUNNER_TEMP/prod-deployment-after.json"* \
            "$RUNNER_TEMP/prod-versions-before.json"* \
            "$RUNNER_TEMP/prod-versions-after.json"* \
            "$RUNNER_TEMP/prod-version-detail.json"* \
            "$RUNNER_TEMP/prod-candidate-secrets.json" \
            "$RUNNER_TEMP/prod-upload-output.jsonl" \
            "$RUNNER_TEMP/prod-upload.log"