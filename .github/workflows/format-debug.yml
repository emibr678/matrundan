name: Format debug

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  debug:
    if: github.head_ref == 'agent/issue-104-group-settings-ia'
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          bunx prettier tests/e2e/v1-20-1-pilot-ux.spec.ts --write
          git diff -- tests/e2e/v1-20-1-pilot-ux.spec.ts
          test -z "$(git status --short -- tests/e2e/v1-20-1-pilot-ux.spec.ts)"
