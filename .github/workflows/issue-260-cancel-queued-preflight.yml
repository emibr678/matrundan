name: Issue 260 cancel queued preflight

on:
  push:
    branches:
      - ops/issue-260-prod-preflight-dispatch

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel blocked self-hosted preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '33939824585'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            'x-github-api-version': '2022-11-28',
          };
          const api = `https://api.github.com/repos/${owner}/${repo}`;
          const response = await fetch(`${api}/actions/runs/${process.env.RUN_ID}`, { headers });
          const run = await response.json().catch(() => null);
          if (!response.ok) throw new Error(`Could not read queued run (HTTP ${response.status}).`);
          if (['queued', 'in_progress', 'waiting', 'pending'].includes(run?.status)) {
            const cancel = await fetch(`${api}/actions/runs/${process.env.RUN_ID}/cancel`, {
              method: 'POST',
              headers,
            });
            if (![202, 409].includes(cancel.status)) {
              throw new Error(`Could not cancel run (HTTP ${cancel.status}).`);
            }
            console.log(`Cancelled blocked preflight run ${process.env.RUN_ID}.`);
          } else {
            console.log(`Run ${process.env.RUN_ID} already has status ${String(run?.status)}; no cancellation needed.`);
          }
          NODE
