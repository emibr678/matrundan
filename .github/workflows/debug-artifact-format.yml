name: Temporary artifact formatter diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  formatting_diff:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          sed -i 's/\r$//' .github/scripts/artifact-lifecycle.cjs

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          bunx prettier .github/scripts/artifact-lifecycle.cjs --write
          git diff -- .github/scripts/artifact-lifecycle.cjs
