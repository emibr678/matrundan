name: Temp finish search area settings

on:
  push:
    branches:
      - agent/search-area-settings-consistency

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/search-area-settings-consistency
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Update changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          old = """- Sökområden väljs nu i ett enda återanvändbart platsfält. Varje vald träff
            läggs direkt till som en valbricka och fältet kan användas igen utan en
            separat panel eller extra bekräftelseknappar.
          - Breda administrativa Geoapify-resultat som kommuner, län och länder visas som
            vägledning men kan inte användas som punktcentrum. Användaren hänvisas i
            stället till en ort, stadsdel eller adress i området.
          """
          new = """- Sökområden väljs nu i ett enda återanvändbart platsfält. Varje vald träff
            läggs direkt till som en valbricka och fältet kan användas igen utan en
            separat panel eller extra bekräftelseknappar.
          - Gruppinställningarnas vanliga sökområden använder samma autocomplete-till-
            valbricka-flöde som sökdialogen och sparas tillsammans med gruppens övriga
            ändringar.
          - Breda administrativa Geoapify-resultat som kommuner, län, regioner och länder
            visas som vägledning men kan inte användas som punktcentrum. Kontrollen använder
            både Geoapifys typ och platsens etikett, och nya breda val avvisas även av
            databasens rollskyddade skrivfunktion.
          """
          if old not in text:
              raise SystemExit("Changelog-stycket kunde inte hittas")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed files
        run: |
          bunx prettier --write \
            CHANGELOG.md \
            src/components/matrundan/GeoapifyLocationInput.tsx \
            src/components/matrundan/GroupSettingsSectionV16.tsx \
            src/components/matrundan/SearchAreaControlsV16.tsx \
            src/components/matrundan/SearchAreaPill.tsx \
            src/components/matrundan/search-area-settings-ui-contract.test.ts \
            src/lib/matrundan/search-area-database-contract.test.ts \
            src/lib/matrundan/search-areas.test.ts \
            src/lib/matrundan/search-areas.ts
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md src/components/matrundan src/lib/matrundan
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Formatera och dokumentera sökområdespaket"
          git push
