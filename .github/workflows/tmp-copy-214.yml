name: Temporary #214 copy tidy

on:
  push:
    branches:
      - feat/214-confirm-cross-group-participation
    paths:
      - '.github/workflows/tmp-copy-214.yml'

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/214-confirm-cross-group-participation
          show-progress: false
      - name: Apply final copy review
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected copy not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'src/components/matrundan/VisitDetailSheet.tsx',
              'Gäster hör bara till detta besök och får ingen medlemsprogression.',
              'Gäster hör bara till besöket och räknas inte som gruppmedlemmar.',
          )
          replace(
              'src/components/matrundan/GuestMemberLinkDialog.tsx',
              '3. Vem var med?',
              '3. Vem är gästen?',
          )
          replace(
              'src/components/matrundan/VisitDialog.tsx',
              '''description:\n        sharedCount > 0\n          ? continueToGuestLink\n            ? `${currentPlace.name} · välj nu om någon gäst är medlem i en delad grupp`\n            : `${currentPlace.name} · tillagt i ${sharedCount} ${sharedCount === 1 ? "grupp" : "grupper"} till`\n          : currentPlace.name,''',
              '''description:\n        sharedCount > 0\n          ? `${currentPlace.name} · tillagt i ${sharedCount} ${sharedCount === 1 ? "grupp" : "grupper"} till`\n          : currentPlace.name,''',
          )
          replace(
              'src/components/matrundan/VisitDialog.tsx',
              '''Efter att besöket sparats kan du direkt koppla en gäst till en medlem i en\n                      vald grupp. Personen bekräftar själv att hen var med.''',
              '''Efter sparandet kan du koppla en gäst till en medlem i en vald grupp. Personen\n                      bekräftar själv.''',
          )
          replace(
              'src/lib/matrundan/version.ts',
              'Bekräftat deltagande återanvänder samma kanoniska besök, påverkar deltagarstatistik och progression och undviker att samma person samtidigt räknas som medlem och anonym extern deltagare i en grupp där identiteten får visas.',
              'Bekräftat deltagande kopplas till samma delade besök och räknas i deltagarstatistik och progression, utan att samma person samtidigt visas som medlem och anonym deltagare i gruppen.',
          )
          replace(
              'CHANGELOG.md',
              '''- Bekräftat deltagande återanvänder samma kanoniska besök, påverkar\n  deltagarstatistik och progression och undviker att samma person samtidigt\n  räknas som medlem och anonym extern deltagare i en grupp där identiteten får\n  visas.''',
              '''- Bekräftat deltagande kopplas till samma delade besök och räknas i\n  deltagarstatistik och progression, utan att samma person samtidigt visas som\n  medlem och anonym deltagare i gruppen.''',
          )

          for p in Path('tests').rglob('*.ts'):
              text = p.read_text(encoding='utf-8')
              text = text.replace(
                  'Då registreras du som deltagare på besöket.',
                  'så registreras du som deltagare.',
              )
              p.write_text(text, encoding='utf-8')

          Path('.github/workflows/tmp-copy-214.yml').unlink()
      - name: Commit final copy
        run: |
          git config user.name "Matrundan Agent"
          git config user.email "55993222+emibr678@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Slutför copygranskning för #214"
          git push origin HEAD:feat/214-confirm-cross-group-participation
