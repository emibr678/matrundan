name: Debug staging DB secret auth

on:
  push:
    branches:
      - debug/staging-db-secret-auth

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnose:
    name: Diagnose staging DB auth read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    env:
      STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
      POSTGRES_CLIENT_IMAGE: postgres:17-bookworm

    steps:
      - name: Validate secret is present
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_SUPABASE_DB_URL:-}" ]]; then
            echo "STAGING_SUPABASE_DB_URL is missing." >&2
            exit 1
          fi

      - name: Inspect safe URI metadata and compare auth paths
        run: |
          set -euo pipefail
          docker pull "$POSTGRES_CLIENT_IMAGE" >/dev/null

          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';

          const raw = process.env.STAGING_SUPABASE_DB_URL ?? '';
          const image = process.env.POSTGRES_CLIENT_IMAGE ?? 'postgres:17-bookworm';

          let url;
          try {
            url = new URL(raw);
          } catch {
            console.error('diagnostic: uri_parse=failed');
            process.exit(2);
          }

          const username = decodeURIComponent(url.username);
          const password = decodeURIComponent(url.password);
          const database = url.pathname.replace(/^\//, '') || 'postgres';
          const port = url.port || '5432';

          const authorityStart = raw.indexOf('//') + 2;
          const authorityEndCandidates = [raw.indexOf('/', authorityStart), raw.indexOf('?', authorityStart), raw.indexOf('#', authorityStart)]
            .filter((value) => value >= 0);
          const authorityEnd = authorityEndCandidates.length > 0 ? Math.min(...authorityEndCandidates) : raw.length;
          const authority = raw.slice(authorityStart, authorityEnd);
          const at = authority.lastIndexOf('@');
          const userInfo = at >= 0 ? authority.slice(0, at) : '';
          const colon = userInfo.indexOf(':');
          const rawPassword = colon >= 0 ? userInfo.slice(colon + 1) : '';

          const canonicalized = raw !== url.href;
          const hasPercentEscapes = /%[0-9A-Fa-f]{2}/.test(rawPassword);
          const hasRawUriDelimiters = /[@/?#]/.test(rawPassword);

          console.log(`diagnostic: protocol=${url.protocol}`);
          console.log(`diagnostic: username=${username}`);
          console.log(`diagnostic: host=${url.hostname}`);
          console.log(`diagnostic: port=${port}`);
          console.log(`diagnostic: database=${database}`);
          console.log(`diagnostic: password_length=${password.length}`);
          console.log(`diagnostic: password_has_percent_escapes=${hasPercentEscapes}`);
          console.log(`diagnostic: password_has_unescaped_uri_delimiter=${hasRawUriDelimiters}`);
          console.log(`diagnostic: uri_was_canonicalized_by_url_parser=${canonicalized}`);

          const classify = (result) => {
            if (result.status === 0) return 'success';
            const detail = `${result.stderr ?? ''}`.toLowerCase();
            if (detail.includes('password authentication failed') || detail.includes('sasl authentication failed')) return 'authentication_failed';
            if (detail.includes('tenant or user not found')) return 'pooler_tenant_or_user_failed';
            if (detail.includes('could not translate host name')) return 'dns_failed';
            if (detail.includes('connection refused')) return 'connection_refused';
            if (detail.includes('timeout')) return 'connection_timeout';
            if (detail.includes('invalid')) return 'invalid_connection_uri';
            return `failed_exit_${result.status ?? 'unknown'}`;
          };

          const uriResult = spawnSync(
            'docker',
            ['run', '--rm', '--env', 'STAGING_SUPABASE_DB_URL', image,
             'psql', process.env.STAGING_SUPABASE_DB_URL,
             '-X', '--no-psqlrc', '--tuples-only', '--no-align', '--set', 'ON_ERROR_STOP=1',
             '--command', 'select 1'],
            { env: process.env, encoding: 'utf8', timeout: 30_000 },
          );

          const parameterEnv = {
            ...process.env,
            PGHOST: url.hostname,
            PGPORT: port,
            PGUSER: username,
            PGPASSWORD: password,
            PGDATABASE: database,
          };
          const parameterResult = spawnSync(
            'docker',
            ['run', '--rm', '--env', 'PGHOST', '--env', 'PGPORT', '--env', 'PGUSER', '--env', 'PGPASSWORD', '--env', 'PGDATABASE', image,
             'psql', '-X', '--no-psqlrc', '--tuples-only', '--no-align', '--set', 'ON_ERROR_STOP=1',
             '--command', 'select 1'],
            { env: parameterEnv, encoding: 'utf8', timeout: 30_000 },
          );

          const uriClass = classify(uriResult);
          const parameterClass = classify(parameterResult);
          console.log(`diagnostic: uri_auth=${uriClass}`);
          console.log(`diagnostic: separate_parameter_auth=${parameterClass}`);

          if (uriClass === 'success' && parameterClass === 'success') process.exit(0);
          if (uriClass !== 'success' && parameterClass === 'success') process.exit(10);
          if (uriClass === 'authentication_failed' && parameterClass === 'authentication_failed') process.exit(11);
          process.exit(12);
          NODE
