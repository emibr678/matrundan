name: Cleanup visual review artifacts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run listar kandidater; delete raderar dem
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - delete
      keep_latest:
        description: Antal senaste visual-review-artifacts att behålla
        required: true
        default: "1"
        type: string
      confirm_delete:
        description: Skriv DELETE VISUAL REVIEW för att tillåta delete-läge
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-visual-review-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15

    steps:
      - name: Inspect or delete visual review artifacts
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          KEEP_LATEST: ${{ inputs.keep_latest }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const mode = process.env.MODE;
            const keepLatest = Number.parseInt(process.env.KEEP_LATEST || '1', 10);
            const confirmation = process.env.CONFIRM_DELETE || '';

            if (!['dry-run', 'delete'].includes(mode)) {
              core.setFailed(`Ogiltigt mode: ${mode}`);
              return;
            }

            if (!Number.isInteger(keepLatest) || keepLatest < 0 || keepLatest > 20) {
              core.setFailed('keep_latest måste vara ett heltal mellan 0 och 20.');
              return;
            }

            if (mode === 'delete' && confirmation !== 'DELETE VISUAL REVIEW') {
              core.setFailed('Delete-läge kräver exakt bekräftelse: DELETE VISUAL REVIEW');
              return;
            }

            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            );

            const visualArtifacts = artifacts
              .filter((artifact) => !artifact.expired && artifact.name.startsWith('visual-review-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const kept = visualArtifacts.slice(0, keepLatest);
            const targets = visualArtifacts.slice(keepLatest);
            const targetBytes = targets.reduce((sum, artifact) => sum + artifact.size_in_bytes, 0);
            const targetMiB = (targetBytes / 1024 / 1024).toFixed(1);

            core.info(`Aktiva visual-review-artifacts: ${visualArtifacts.length}`);
            core.info(`Behåller senaste: ${kept.length}`);
            core.info(`${mode === 'delete' ? 'Raderar' : 'Skulle radera'}: ${targets.length} artifacts (${targetMiB} MiB)`);

            if (kept.length > 0) {
              core.info('Behållna artifacts:');
              for (const artifact of kept) {
                core.info(`- ${artifact.name} | ${artifact.created_at} | ${artifact.workflow_run?.head_sha || 'okänd SHA'}`);
              }
            }

            let deleted = 0;
            let deletedBytes = 0;

            for (const artifact of targets) {
              const sizeMiB = (artifact.size_in_bytes / 1024 / 1024).toFixed(2);
              const description = `${artifact.name} | ${sizeMiB} MiB | ${artifact.created_at} | ${artifact.workflow_run?.head_branch || 'okänd branch'} | ${artifact.workflow_run?.head_sha || 'okänd SHA'}`;

              if (mode === 'dry-run') {
                core.info(`WOULD DELETE ${description}`);
                continue;
              }

              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                deletedBytes += artifact.size_in_bytes;
                core.info(`DELETED ${description}`);
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`Artifact ${artifact.id} fanns inte längre och hoppades över.`);
                  continue;
                }
                throw error;
              }
            }

            const deletedMiB = (deletedBytes / 1024 / 1024).toFixed(1);

            await core.summary
              .addHeading('Visual review artifact cleanup')
              .addTable([
                [
                  { data: 'Läge', header: true },
                  { data: 'Aktiva visual-review', header: true },
                  { data: 'Behålls', header: true },
                  { data: mode === 'delete' ? 'Raderade' : 'Skulle raderas', header: true },
                  { data: mode === 'delete' ? 'Frigjort' : 'Möjligt att frigöra', header: true },
                ],
                [
                  mode,
                  String(visualArtifacts.length),
                  String(kept.length),
                  String(mode === 'delete' ? deleted : targets.length),
                  `${mode === 'delete' ? deletedMiB : targetMiB} MiB`,
                ],
              ])
              .addRaw('\nWorkflowen matchar endast artifacts vars namn börjar med `visual-review-`.\n')
              .write();
