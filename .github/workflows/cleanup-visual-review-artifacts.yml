name: Cleanup Actions artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_family:
        description: Vilken artifact-typ ska granskas eller rensas?
        required: true
        default: playwright-report
        type: choice
        options:
          - playwright-report
          - visual-review
      mode:
        description: Dry-run listar kandidater; delete raderar dem
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - delete
      keep_latest:
        description: Antal senaste matchande artifacts att behålla
        required: true
        default: "1"
        type: string
      confirm_delete:
        description: Skriv exakt bekräftelsetext för vald artifact-typ i delete-läge
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-actions-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15

    steps:
      - name: Inspect or delete selected artifacts
        uses: actions/github-script@v7
        env:
          ARTIFACT_FAMILY: ${{ inputs.artifact_family }}
          MODE: ${{ inputs.mode }}
          KEEP_LATEST: ${{ inputs.keep_latest }}
          CONFIRM_DELETE: ${{ inputs.confirm_delete }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const artifactFamily = process.env.ARTIFACT_FAMILY;
            const mode = process.env.MODE;
            const keepLatest = Number.parseInt(process.env.KEEP_LATEST || '1', 10);
            const confirmation = process.env.CONFIRM_DELETE || '';

            const families = {
              'playwright-report': {
                label: 'playwright-report',
                confirmation: 'DELETE PLAYWRIGHT REPORTS',
                matches: (artifact) => artifact.name === 'playwright-report',
              },
              'visual-review': {
                label: 'visual-review-*',
                confirmation: 'DELETE VISUAL REVIEW',
                matches: (artifact) => artifact.name.startsWith('visual-review-'),
              },
            };

            const family = families[artifactFamily];
            if (!family) {
              core.setFailed(`Ogiltig artifact_family: ${artifactFamily}`);
              return;
            }

            if (!['dry-run', 'delete'].includes(mode)) {
              core.setFailed(`Ogiltigt mode: ${mode}`);
              return;
            }

            if (!Number.isInteger(keepLatest) || keepLatest < 0 || keepLatest > 20) {
              core.setFailed('keep_latest måste vara ett heltal mellan 0 och 20.');
              return;
            }

            if (mode === 'delete' && confirmation !== family.confirmation) {
              core.setFailed(`Delete-läge för ${family.label} kräver exakt bekräftelse: ${family.confirmation}`);
              return;
            }

            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            );

            const matchingArtifacts = artifacts
              .filter((artifact) => !artifact.expired && family.matches(artifact))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const kept = matchingArtifacts.slice(0, keepLatest);
            const targets = matchingArtifacts.slice(keepLatest);
            const targetBytes = targets.reduce((sum, artifact) => sum + artifact.size_in_bytes, 0);
            const targetMiB = (targetBytes / 1024 / 1024).toFixed(1);

            core.info(`Artifact-typ: ${family.label}`);
            core.info(`Aktiva matchande artifacts: ${matchingArtifacts.length}`);
            core.info(`Behåller senaste: ${kept.length}`);
            core.info(`${mode === 'delete' ? 'Raderar' : 'Skulle radera'}: ${targets.length} artifacts (${targetMiB} MiB)`);

            if (kept.length > 0) {
              core.info('Behållna artifacts:');
              for (const artifact of kept) {
                core.info(`- ${artifact.name} | ${artifact.created_at} | ${artifact.workflow_run?.head_sha || 'okänd SHA'}`);
              }
            }

            let deleted = 0;
            let deletedBytes = 0;

            for (const artifact of targets) {
              const sizeMiB = (artifact.size_in_bytes / 1024 / 1024).toFixed(2);
              const description = `${artifact.name} | ${sizeMiB} MiB | ${artifact.created_at} | ${artifact.workflow_run?.head_branch || 'okänd branch'} | ${artifact.workflow_run?.head_sha || 'okänd SHA'}`;

              if (mode === 'dry-run') {
                core.info(`WOULD DELETE ${description}`);
                continue;
              }

              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                deleted += 1;
                deletedBytes += artifact.size_in_bytes;
                core.info(`DELETED ${description}`);
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`Artifact ${artifact.id} fanns inte längre och hoppades över.`);
                  continue;
                }
                throw error;
              }
            }

            const deletedMiB = (deletedBytes / 1024 / 1024).toFixed(1);

            await core.summary
              .addHeading('Actions artifact cleanup')
              .addTable([
                [
                  { data: 'Artifact-typ', header: true },
                  { data: 'Läge', header: true },
                  { data: 'Aktiva', header: true },
                  { data: 'Behålls', header: true },
                  { data: mode === 'delete' ? 'Raderade' : 'Skulle raderas', header: true },
                  { data: mode === 'delete' ? 'Frigjort' : 'Möjligt att frigöra', header: true },
                ],
                [
                  family.label,
                  mode,
                  String(matchingArtifacts.length),
                  String(kept.length),
                  String(mode === 'delete' ? deleted : targets.length),
                  `${mode === 'delete' ? deletedMiB : targetMiB} MiB`,
                ],
              ])
              .addRaw(`\nWorkflowen matchar endast vald artifact-typ: \`${family.label}\`.\n`)
              .write();
