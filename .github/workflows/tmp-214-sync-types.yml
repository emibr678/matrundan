name: "Temporary 214 type sync"

on:
  push:
    branches:
      - feat/214-confirm-cross-group-participation

permissions:
  contents: write

env:
  SUPABASE_CLI_VERSION: '2.115.0'
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  sync:
    if: github.event.head_commit.message == 'Förbered exakt typsynk för #214'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Generate exact migration-built types
        shell: bash
        run: |
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db start
          bash scripts/supabase-types.sh generate src/integrations/supabase/types.ts
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup
          rm .github/workflows/tmp-214-sync-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts .github/workflows/tmp-214-sync-types.yml
          git commit -m "Synka Supabase-typer för slutlig #214-modell"
          git push origin HEAD:feat/214-confirm-cross-group-participation
