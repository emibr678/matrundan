name: PR 284 lockfile and Lovable build probe

on:
  push:
    branches:
      - fix/issue-207-lovable-preview-direct-supabase-oauth
    paths:
      - package.json
      - vite.config.ts
      - .github/workflows/pr284-lovable-build-probe.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Refresh lockfile
        run: bun install --lockfile-only

      - name: Verify frozen install
        run: bun install --frozen-lockfile

      - name: Verify portable build path
        run: bun run build

      - name: Verify Lovable wrapper build path
        env:
          MATRUNDAN_LOVABLE_BUILD: "1"
        run: bun run build

      - name: Verify Cloudflare build path
        run: bun run cloudflare:build

      - name: Store regenerated lockfile as unattached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -Rs '{content: ., encoding: "utf-8"}' bun.lock > "$RUNNER_TEMP/bun-lock-blob.json"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary @"$RUNNER_TEMP/bun-lock-blob.json")"
          sha="$(jq -r '.sha' <<<"$response")"
          expected="$(git hash-object bun.lock)"
          test -n "$sha" && test "$sha" != "null"
          echo "Regenerated bun.lock blob: $sha"
          echo "Expected local hash: $expected"
          test "$sha" = "$expected"

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pr284-regenerated-bun-lock
          path: bun.lock
          if-no-files-found: error
          retention-days: 1
