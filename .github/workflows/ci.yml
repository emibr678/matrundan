name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set verification level
        id: verification
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || "${{ github.event.pull_request.draft }}" != "true" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Full verification: browser checks run when relevant." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "Fast verification for draft PR: browser checks are deferred until ready for review." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find changed files
        id: changes
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.css' \
            > changed-format-files.txt
          git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' \
            > changed-code-files.txt
          [[ -s changed-format-files.txt ]] && echo "has_format=true" >> "$GITHUB_OUTPUT" || echo "has_format=false" >> "$GITHUB_OUTPUT"
          [[ -s changed-code-files.txt ]] && echo "has_code=true" >> "$GITHUB_OUTPUT" || echo "has_code=false" >> "$GITHUB_OUTPUT"

      - name: Prettier changed code and configuration
        if: steps.changes.outputs.has_format == 'true'
        shell: bash
        run: |
          mapfile -t files < changed-format-files.txt
          bunx prettier --check "${files[@]}"

      - name: Export ESLint report
        if: steps.changes.outputs.has_code == 'true'
        shell: bash
        run: |
          mapfile -t files < changed-code-files.txt
          bunx eslint --format json --output-file eslint-report.json "${files[@]}" || true

      - name: Upload ESLint report
        if: steps.changes.outputs.has_code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: error
          retention-days: 1

      - name: TypeScript
        run: bun run typecheck

      - name: Production build
        run: bun run build
