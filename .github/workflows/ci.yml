name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find changed files
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.css' \
            > changed-format-files.txt
          git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' \
            > changed-code-files.txt

      - name: Apply Paket 4B source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          store = Path("src/lib/matrundan/store.tsx")
          text = store.read_text()
          old = '''        assertDemoWritable(state);
                  let found = false;
                  setState((current) => ({
                    ...current,
                    visits: current.visits.map((visit) => {
                      const reviews = (visit.visibleReviews ?? []).map((review) => {
                        if (review.id !== reviewId || review.userId !== current.currentUserId) {
                          return review;
                        }
                        found = true;
                        return {
                          ...review,
                          overall: input.overall,
                          taste: input.taste ?? null,
                          value: input.value ?? null,
                          service: input.service ?? null,
                          comment: input.comment ?? null,
                        };
                      });
                      return aggregateVisit({ ...visit, visibleReviews: reviews });
                    }),
                  }));
                  if (!found) throw new Error("Ditt omdöme hittades inte.");
          '''
          new = '''        assertDemoWritable(state);
                  const exists = state.visits.some((visit) =>
                    visit.visibleReviews?.some(
                      (review) => review.id === reviewId && review.userId === state.currentUserId,
                    ),
                  );
                  if (!exists) throw new Error("Ditt omdöme hittades inte.");
                  setState((current) => ({
                    ...current,
                    visits: current.visits.map((visit) => {
                      const reviews = (visit.visibleReviews ?? []).map((review) => {
                        if (review.id !== reviewId || review.userId !== current.currentUserId) {
                          return review;
                        }
                        return {
                          ...review,
                          overall: input.overall,
                          taste: input.taste ?? null,
                          value: input.value ?? null,
                          service: input.service ?? null,
                          comment: input.comment ?? null,
                        };
                      });
                      return aggregateVisit({ ...visit, visibleReviews: reviews });
                    }),
                  }));
          '''
          if old in text:
              store.write_text(text.replace(old, new))

          session = Path("src/lib/matrundan/session.tsx")
          text = session.read_text()
          old = '      activeGroupRole: isLive ? (activeGroup?.role ?? null) : null,\n'
          new = '      activeGroupRole:\n        isLive && activeGroup?.lifecycleStatus === "active" ? activeGroup.role : null,\n'
          if old in text:
              session.write_text(text.replace(old, new))

          visit = Path("src/components/matrundan/VisitDialog.tsx")
          text = visit.read_text()
          old = '''  const canShare =
              mode === "live" && !!activeGroupId && userGroups.length >= 2;
          '''
          new = '''  const activeGroupCount = userGroups.filter(
              (group) => group.lifecycleStatus === "active",
            ).length;
            const canShare =
              mode === "live" &&
              state.group.lifecycleStatus !== "archived" &&
              !!activeGroupId &&
              activeGroupCount >= 2;
          '''
          if old in text:
              visit.write_text(text.replace(old, new))
          PY

          for file in src/components/matrundan/VisitDialog.tsx; do
            grep -qxF "$file" changed-format-files.txt || echo "$file" >> changed-format-files.txt
            grep -qxF "$file" changed-code-files.txt || echo "$file" >> changed-code-files.txt
          done

      - name: Format and fix lint
        shell: bash
        run: |
          mapfile -t format_files < changed-format-files.txt
          mapfile -t code_files < changed-code-files.txt
          bunx prettier --write "${format_files[@]}"
          bunx eslint --fix "${code_files[@]}" || true

      - name: Commit source and tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "Inga källkodsändringar att committa."
            exit 0
          fi
          git commit -m "Formatera och rätta Paket 4B"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
