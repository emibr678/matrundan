name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      base_sha: ${{ steps.changes.outputs.base_sha }}
      has_ui: ${{ steps.changes.outputs.has_ui }}
      has_map: ${{ steps.changes.outputs.has_map }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          while IFS= read -r -d '' file; do
            sed -i 's/\r$//' "$file"
          done < <(git ls-files -z -- '*.ts' '*.tsx' '*.sql')

      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0

      - name: Report verification mode
        shell: bash
        run: |
          echo "Full verification: browser checks run when relevant." >> "$GITHUB_STEP_SUMMARY"
          echo "Configured target: ubuntu-24.04 (GitHub-hosted)" >> "$GITHUB_STEP_SUMMARY"
          echo "Actual runner: ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }}, ${{ runner.environment }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pinned Bun
        id: bun
        uses: ./.github/actions/setup-bun

      - name: Report runtime
        run: echo "Bun ${{ steps.bun.outputs.bun-version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Bun downloads
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find changed files
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi

          bun scripts/repo-tools.mjs ci-flags "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Doctor
        run: bun run doctor

      - name: Guard tooling and lockfiles
        env:
          MATRUNDAN_BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: bun scripts/repo-tools.mjs guard-tooling

      - name: Shell scripts
        run: bun run check:shell

      - name: Release and changelog contract
        env:
          MATRUNDAN_CI_EVENT_NAME: "${{ github.event_name }}"
          MATRUNDAN_VERSION_EXEMPT: "${{ contains(github.event.pull_request.body || '', '- [x] Version: inte relevant') && '1' || '0' }}"
        run: bun scripts/release-check.mjs "${{ steps.changes.outputs.base_sha }}"

      - name: Database and RPC contract
        run: bun scripts/database-contract-check.mjs "${{ steps.changes.outputs.base_sha }}"

      - name: Dead code guard
        run: bun run check:dead-code

      - name: Prettier changed code and configuration
        if: steps.changes.outputs.has_format == 'true'
        env:
          MATRUNDAN_BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: bun run format:check:changed

      - name: Create formatting patch on failure
        if: failure() && steps.changes.outputs.has_format == 'true'
        env:
          MATRUNDAN_BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: |
          bun run format:changed
          git diff --binary > formatting.patch

      - name: Upload formatting patch
        if: failure() && steps.changes.outputs.has_format == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: formatting-patch-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
          path: formatting.patch
          if-no-files-found: error
          retention-days: 5

      - name: ESLint full repository
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: TypeScript
        run: bun run typecheck

      - name: Unit test TypeScript
        run: bun run typecheck:unit

      - name: Playwright TypeScript
        run: bun run typecheck:e2e

      - name: Production build and Cloudflare staging artifact
        run: bun run cloudflare:build

  browser:
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.has_ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          while IFS= read -r -d '' file; do
            sed -i 's/\r$//' "$file"
          done < <(git ls-files -z -- '*.ts' '*.tsx' '*.sql')

      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Bun downloads
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}-map-${{ needs.verify.outputs.has_map }}

      - name: Install Chromium on GitHub-hosted runner
        if: runner.environment != 'self-hosted' && needs.verify.outputs.has_map != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium and WebKit on GitHub-hosted runner
        if: runner.environment != 'self-hosted' && needs.verify.outputs.has_map == 'true'
        run: bunx playwright install --with-deps chromium webkit

      - name: Install Chromium on self-hosted runner
        if: runner.environment == 'self-hosted' && needs.verify.outputs.has_map != 'true'
        run: bunx playwright install chromium

      - name: Install Chromium and WebKit on self-hosted runner
        if: runner.environment == 'self-hosted' && needs.verify.outputs.has_map == 'true'
        run: bunx playwright install chromium webkit

      - name: Browser diagnostics before smoke
        run: |
          echo "Started: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Runner: ${{ runner.name }} (${{ runner.os }}/${{ runner.arch }}, ${{ runner.environment }})"
          bunx playwright --version
          echo "Disk before smoke:"
          df -h . || true
          echo "Mobile Chromium tests discovered:"
          bunx playwright test --project=mobile-chromium --list

      - name: Full mobile Chromium smoke test
        run: |
          started="$(date +%s)"
          echo "Smoke started: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          set +e
          bun run test:mobile -- --max-failures=1 --retries=0
          status=$?
          set -e
          finished="$(date +%s)"
          echo "Smoke finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Smoke duration: $((finished - started))s"
          echo "Smoke exit code: $status"
          exit "$status"

      - name: Browser diagnostics after smoke
        if: always()
        run: |
          echo "Finished: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Disk after smoke:"
          df -h . || true
          echo "Playwright result files:"
          find test-results -maxdepth 3 -type f -print 2>/dev/null || true
          echo "Playwright report files:"
          find playwright-report -maxdepth 2 -type f -print 2>/dev/null || true

      - name: iPhone and desktop map compatibility
        if: needs.verify.outputs.has_map == 'true'
        run: bun run test:map:cross-browser

      - name: Upload browser report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 5

  artifact_cleanup:
    needs:
      - verify
      - browser
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Remove superseded and legacy artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cleanup = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/artifact-lifecycle.cjs`);
            await cleanup({
              github,
              context,
              core,
              prNumber: context.payload.pull_request.number,
              currentRunId: process.env.GITHUB_RUN_ID,
              scope: 'ci',
              keepCurrent: true,
              cleanupLegacy: true,
            });
