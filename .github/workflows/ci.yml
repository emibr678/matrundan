name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-placemap-files:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Format and commit map files
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/styles.css tests/e2e/mobile-matstallen.spec.ts
          if git diff --quiet -- src/styles.css tests/e2e/mobile-matstallen.spec.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/styles.css tests/e2e/mobile-matstallen.spec.ts
          git commit -m "Formatera PlaceMap-fixen och regressionstestet"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find changed files
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi

          mapfile -t format_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' \
              '*.json' '*.css' '*.md' '*.yml' '*.yaml'
          )
          mapfile -t code_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs'
          )

          printf '%s\n' "${format_files[@]}" > changed-format-files.txt
          printf '%s\n' "${code_files[@]}" > changed-code-files.txt

          [[ ${#format_files[@]} -gt 0 ]] && echo "has_format=true" >> "$GITHUB_OUTPUT" || echo "has_format=false" >> "$GITHUB_OUTPUT"
          [[ ${#code_files[@]} -gt 0 ]] && echo "has_code=true" >> "$GITHUB_OUTPUT" || echo "has_code=false" >> "$GITHUB_OUTPUT"

          if printf '%s\n' "${format_files[@]}" | grep -Eq '^(src/components/|src/routes/|src/.*\.(css|tsx)$|playwright\.config\.ts$|tests/e2e/)'; then
            echo "has_ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ui=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "${format_files[@]}" | grep -Eq '^(src/components/matrundan/PlaceMap\.tsx|src/lib/matrundan/maplibre-client\.ts|playwright\.config\.ts|tests/e2e/mobile-matstallen\.spec\.ts)$'; then
            echo "has_map=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_map=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prettier changed files
        if: steps.changes.outputs.has_format == 'true'
        shell: bash
        run: |
          mapfile -t files < changed-format-files.txt
          bunx prettier --check "${files[@]}"

      - name: ESLint changed code
        if: steps.changes.outputs.has_code == 'true'
        shell: bash
        run: |
          mapfile -t files < changed-code-files.txt
          bunx eslint "${files[@]}"

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Install Chromium
        if: steps.changes.outputs.has_ui == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Mobile Chromium smoke test
        if: steps.changes.outputs.has_ui == 'true'
        run: bunx playwright test --project=mobile-chromium

      - name: Install WebKit for map compatibility
        if: steps.changes.outputs.has_map == 'true'
        run: bunx playwright install --with-deps webkit

      - name: iPhone and desktop map compatibility
        if: steps.changes.outputs.has_map == 'true'
        run: >-
          bunx playwright test tests/e2e/mobile-matstallen.spec.ts
          --project=mobile-webkit
          --project=desktop-chromium

      - name: Upload browser report on failure
        if: failure() && steps.changes.outputs.has_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
