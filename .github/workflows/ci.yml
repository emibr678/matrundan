name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: write

concurrency:
  group: ci-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-verified-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-163-platsunderhall
          fetch-depth: 0
          show-progress: false

      - name: Restore unrelated files exactly from verified head
        shell: bash
        run: |
          set -euo pipefail
          git checkout fe84082e3a8c0e5b592099bcc5da7798a629d6da -- \
            CHANGELOG.md \
            package.json \
            bun.lock \
            src/integrations/supabase/types.ts \
            src/routeTree.gen.ts \
            .github/workflows/ci.yml
          git rm -f .github/workflows/restore-verified-files.yml || true

      - name: Commit exact cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to restore"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json bun.lock src/integrations/supabase/types.ts src/routeTree.gen.ts .github/workflows/ci.yml
          git add -u .github/workflows/restore-verified-files.yml || true
          git commit -m "chore: restore verified generated files"
          git push origin HEAD:agent/issue-163-platsunderhall
