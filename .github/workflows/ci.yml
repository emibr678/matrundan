name: Apply Package 5A fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/paket-5a-landing-demo-stockholm
          fetch-depth: 0

      - name: Apply exact fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new))

          replace_exact(
              "src/lib/matrundan/store.tsx",
              '''        assertDemoWritable(state, demoReadOnly);
          setState((current) => ({
            ...current,
            group: {
              ...current.group,
              lifecycleStatus: "active",''',
              '''        if (demoReadOnly) throw new Error(READ_ONLY_DEMO_MESSAGE);
          setState((current) => ({
            ...current,
            group: {
              ...current.group,
              lifecycleStatus: "active",''',
          )

          replace_exact(
              "tests/e2e/mobile-matstallen.spec.ts",
              '  await page.goto("/placemapdiagnostik");',
              '  await page.goto("/placemapdiagnostik?demo=1");',
          )

          replace_exact(
              "tests/e2e/package-5a.spec.ts",
              '''  await expect(page.getByText("Pelikan", { exact: true })).toBeVisible();
          await expect(page.getByText("Café Pascal", { exact: true })).toBeVisible();''',
              '''  await expect(page.getByRole("heading", { name: "Pelikan", exact: true })).toBeVisible();
          await expect(page.getByText("Café Pascal", { exact: true })).toBeVisible();
          await expect(page.getByRole("button", { name: "Lägg till", exact: true })).toHaveCount(0);
          await expect(page.getByRole("button", { name: /favorit/i })).toHaveCount(0);''',
          )

          replace_exact(
              "src/components/matrundan/PlaceCard.tsx",
              'export function PlaceCard({ place }: { place: Place }) {',
              'export function PlaceCard({ place, readOnly = false }: { place: Place; readOnly?: boolean }) {',
          )
          replace_exact(
              "src/components/matrundan/PlaceCard.tsx",
              '''            <Button
              size="icon"
              variant="ghost"
              onClick={(e) => {
                e.preventDefault();
                toggleFavorite(place.id);
              }}
              className="h-11 w-11 shrink-0 rounded-full"
              aria-pressed={fav}
              aria-label={fav ? "Ta bort favorit" : "Spara som favorit"}
            >
              <Heart
                className={
                  fav
                    ? "h-4 w-4 fill-primary stroke-primary"
                    : "h-4 w-4 stroke-muted-foreground"
                }
              />
            </Button>''',
              '''            {!readOnly ? (
              <Button
                size="icon"
                variant="ghost"
                onClick={(e) => {
                  e.preventDefault();
                  void toggleFavorite(place.id);
                }}
                className="h-11 w-11 shrink-0 rounded-full"
                aria-pressed={fav}
                aria-label={fav ? "Ta bort favorit" : "Spara som favorit"}
              >
                <Heart
                  className={
                    fav
                      ? "h-4 w-4 fill-primary stroke-primary"
                      : "h-4 w-4 stroke-muted-foreground"
                  }
                />
              </Button>
            ) : null}''',
          )

          replace_exact(
              "src/routes/matstallen.tsx",
              '  const { state, avgRating, isFavorite, statusOf } = useStore();',
              '  const { state, demoReadOnly, avgRating, isFavorite, statusOf } = useStore();',
          )
          replace_exact(
              "src/routes/matstallen.tsx",
              '''  const groupArchived = state.group.lifecycleStatus === "archived";
          const activePlaces = React.useMemo(''',
              '''  const groupArchived = state.group.lifecycleStatus === "archived";
          const canWrite = !groupArchived && !demoReadOnly;
          const activePlaces = React.useMemo(''',
          )
          replace_exact(
              "src/routes/matstallen.tsx",
              '''        {!groupArchived ? (
            <Button onClick={() => setAddOpen(true)} size="sm" className="shrink-0 rounded-full">''',
              '''        {canWrite ? (
            <Button onClick={() => setAddOpen(true)} size="sm" className="shrink-0 rounded-full">''',
          )
          replace_exact(
              "src/routes/matstallen.tsx",
              '''            Inga aktiva ställen matchar. Testa att rensa filtren
            {!groupArchived ? " eller lägg till ett nytt" : ""}.''',
              '''            Inga aktiva ställen matchar. Testa att rensa filtren
            {canWrite ? " eller lägg till ett nytt" : ""}.''',
          )
          replace_exact(
              "src/routes/matstallen.tsx",
              '''          {!groupArchived ? (
            <Button className="mt-4" onClick={() => setAddOpen(true)}>''',
              '''          {canWrite ? (
            <Button className="mt-4" onClick={() => setAddOpen(true)}>''',
          )
          replace_exact(
              "src/routes/matstallen.tsx",
              '<PlaceCard key={place.id} place={place} />',
              '<PlaceCard key={place.id} place={place} readOnly={demoReadOnly} />',
          )
          replace_exact(
              "src/routes/matstallen.tsx",
              '      {!groupArchived ? <AddPlaceDialog open={addOpen} onOpenChange={setAddOpen} /> : null}',
              '      {canWrite ? <AddPlaceDialog open={addOpen} onOpenChange={setAddOpen} /> : null}',
          )

          replace_exact(
              "src/routes/matstallen.$placeId.tsx",
              '''  const { getPlace, visitsFor, avgRating, isFavorite, toggleFavorite, setNext, state, memberById } =
    useStore();''',
              '''  const {
    getPlace,
    visitsFor,
    avgRating,
    isFavorite,
    toggleFavorite,
    setNext,
    state,
    demoReadOnly,
    memberById,
  } = useStore();''',
          )
          replace_exact(
              "src/routes/matstallen.$placeId.tsx",
              '  const writable = !groupArchived && !placeRemoved;',
              '  const writable = !groupArchived && !placeRemoved && !demoReadOnly;',
          )
          replace_exact(
              "src/routes/matstallen.$placeId.tsx",
              '''              <div className="font-medium">
                {placeRemoved ? "Inte längre i gruppens lista" : "Gruppen är arkiverad"}
              </div>
              <p className="mt-1 text-xs leading-relaxed text-muted-foreground">
                Tidigare besök, betyg, kommentarer och favoriter finns kvar.
                {placeRemoved && !groupArchived
                  ? " En ägare eller admin kan lägga tillbaka stället för nya besök och planering."
                  : " Återaktivera gruppen för att göra ändringar."}
              </p>''',
              '''              <div className="font-medium">
                {demoReadOnly
                  ? "Skrivskyddad exempelgrupp"
                  : placeRemoved
                    ? "Inte längre i gruppens lista"
                    : "Gruppen är arkiverad"}
              </div>
              <p className="mt-1 text-xs leading-relaxed text-muted-foreground">
                {demoReadOnly
                  ? "Du kan utforska stället och gruppens fiktiva besök, men inte ändra exempeldata."
                  : `Tidigare besök, betyg, kommentarer och favoriter finns kvar.${
                      placeRemoved && !groupArchived
                        ? " En ägare eller admin kan lägga tillbaka stället för nya besök och planering."
                        : " Återaktivera gruppen för att göra ändringar."
                    }`}
              </p>''',
          )
          replace_exact(
              "src/routes/matstallen.$placeId.tsx",
              '            <PlaceAdminDialog place={place} />',
              '            {!demoReadOnly ? <PlaceAdminDialog place={place} /> : null}',
          )

          replace_exact(
              "src/components/matrundan/VisitDetailSheet.tsx",
              '  const { state, getPlace, memberById } = useStore();',
              '  const { state, demoReadOnly, getPlace, memberById } = useStore();',
          )
          replace_exact(
              "src/components/matrundan/VisitDetailSheet.tsx",
              '''                      {isParticipant ? (
                        <EditReviewDialog review={myReview} placeName={place.name} />
                      ) : null}''',
              '''                      {isParticipant && !demoReadOnly ? (
                        <EditReviewDialog review={myReview} placeName={place.name} />
                      ) : null}''',
          )
          PY

          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Rätta Paket 5A:s skrivskydd och mobilregressioner"
          git push origin HEAD:agent/paket-5a-landing-demo-stockholm
