name: Sync v0.10.0 release candidate

on:
  push:
    branches:
      - feature/package-4a-map-demo

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update release metadata and documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing marker for {label}")
              return text.replace(old, new, 1)

          version_path = Path("src/lib/matrundan/version.ts")
          version = version_path.read_text()
          version = replace_once(
              version,
              'export const APP_VERSION = "0.9.0";',
              'export const APP_VERSION = "0.10.0";',
              "app version",
          )
          version = replace_once(
              version,
              'export const APP_VERSION_DATE = "2026-07-25";',
              'export const APP_VERSION_DATE = "2026-07-26";',
              "app version date",
          )
          old_head = '''export const CHANGELOG: ChangelogEntry[] = [
            {
              version: APP_VERSION,
              date: APP_VERSION_DATE,
              summary:
                "Gruppcentrerad gamification – diskreta nivåer, utmärkelser och topplistor som räknas ur besöken.",'''
          new_head = '''export const CHANGELOG: ChangelogEntry[] = [
            {
              version: APP_VERSION,
              date: APP_VERSION_DATE,
              summary:
                "Kartor för gruppens matställen och sökresultat – tillsammans med en helt fiktiv, kartredo demo.",
              sections: [
                {
                  kind: "Nytt",
                  items: [
                    "Matställen kan växlas mellan lista och karta; samma sökning och filter används i båda vyerna.",
                    "Lägg till matställe visar Lista/Karta på mobil och båda samtidigt på större skärmar, med synkroniserat val och möjlighet att lägga till direkt från kartan.",
                  ],
                },
                {
                  kind: "Förbättrat",
                  items: [
                    "Demot använder nu enbart fiktiva matställen med realistiska koordinater, återbesök, hela-gänget-besök och ett manuellt ställe utan kartposition.",
                    "Kartbilder använder en separat domänbegränsad webbläsarnyckel; utan nyckel visas ett lokalt reservläge med markörerna kvar.",
                  ],
                },
                {
                  kind: "Rättat",
                  items: [
                    "Lägg till-dialogen monteras bara när den är öppen, vilket förhindrar en återställningsloop i tillståndet.",
                    "Lista, karta och den öppna sökdialogen är verifierade utan horisontell overflow vid 360 px.",
                  ],
                },
              ],
            },
            {
              version: "0.9.0",
              date: "2026-07-25",
              summary:
                "Gruppcentrerad gamification – diskreta nivåer, utmärkelser och topplistor som räknas ur besöken.",'''
          version = replace_once(version, old_head, new_head, "in-app changelog")
          version_path.write_text(version)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              "- Sökning, filtrering och topplista i matställeslistan.\n",
              "- Sökning, filtrering och topplista i matställeslistan.\n- Kartvy för gruppens matställen och för sökresultat när ett nytt ställe läggs till.\n",
              "README feature list",
          )
          status_start = readme.index("## Status – v0.9.0")
          status_end = readme.index("> Milstolpen", status_start)
          new_status = '''## Status – v0.10.0

Paket 4A lägger till kartor utan att ändra den kanoniska plats- eller
besöksmodellen. Matställen kan visas i lista eller på karta med samma sökning och
filter. I Lägg till matställe växlar mobil mellan Lista/Karta medan större skärmar
visar båda samtidigt; val av resultat synkroniseras mellan vyerna. Kartor använder
en separat domänbegränsad `VITE_GEOAPIFY_MAPS_KEY`, medan platssökning fortsatt
använder den serverhemliga `GEOAPIFY_API_KEY`.

Demoläget innehåller nu enbart fiktiva matställen och täcker koordinater,
återbesök, besök med hela gruppen och ett manuellt reservfall utan kartposition.
Gamification, delade besök, gruppisolering och övriga säkerhetsregler från v0.9.0
är oförändrade.

'''
          readme = readme[:status_start] + new_status + readme[status_end:]
          readme = replace_once(
              readme,
              "- **Geoapify-platssökning:** autocomplete för ort/område, matställessökning\n  med radier 1/3/5/10/25/50 km, listresultat, tydlig attribution och\n  server-skyddad API-nyckel.\n",
              "- **Geoapify-platssökning och kartor:** autocomplete för ort/område och\n  matställessökning med radier 1/3/5/10/25/50 km använder en server-skyddad\n  API-nyckel. Kartplattor använder en separat publik, domänbegränsad nyckel.\n",
              "README Geoapify",
          )
          readme = replace_once(
              readme,
              '''### Vad som inte är med ännu

En riktig kartvy. Se [CHANGELOG.md](./CHANGELOG.md) och "Om Matrundan" i
appen för fullständig versionshistorik.
''',
              '''### Vad som inte är med ännu

Arkivering av grupper och borttagning/arkivering av matställen ingår i nästa
paket. Se [CHANGELOG.md](./CHANGELOG.md) och "Om Matrundan" i appen för
fullständig versionshistorik.
''',
              "README remaining work",
          )
          readme = readme.replace(
              "TanStack Start](https://tanstack.com/start) v1 (React 19 + Vite 7)",
              "TanStack Start](https://tanstack.com/start) v1 (React 19 + Vite 8)",
          )
          readme = replace_once(
              readme,
              "bun run lint         # ESLint\nbunx tsgo --noEmit   # typkontroll\n",
              "bun run lint         # ESLint\nbunx tsc --noEmit    # typkontroll\nbun run test:e2e     # 360 px-smoketest i Chromium\n",
              "README commands",
          )
          readme = replace_once(
              readme,
              "    GeoapifyLocationInput.tsx Återanvändbart Plats-fält med verifierat val\n",
              "    GeoapifyLocationInput.tsx Återanvändbart Plats-fält med verifierat val\n    PlaceMap.tsx              Återanvändbar responsiv karta med markörer\n",
              "README architecture",
          )
          readme_path.write_text(readme)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          entry = '''## [0.10.0] – 2026-07-26

### Nytt
- **Kartvy på Matställen.** Växla mellan lista och karta; sökning, snabbfilter,
  kategori, tillfälle och sortering påverkar båda vyerna.
- **Karta i Lägg till matställe.** Mobil växlar mellan Lista/Karta och desktop
  visar listan bredvid kartan. Vald träff synkroniseras och kan läggas till från
  kartkortet.

### Förbättrat
- Demot innehåller enbart fiktiva verksamheter och täcker kartpositioner,
  återbesök, besök med hela gruppen, favoriter, nästa stopp och ett ställe utan
  koordinater.
- Kartplattor använder `VITE_GEOAPIFY_MAPS_KEY`, en separat publik nyckel som
  ska begränsas till Matrundans domäner. `GEOAPIFY_API_KEY` för sökning förblir
  serverhemlig och återanvänds inte i klienten.
- Utan kartnyckel används ett lokalt neutralt reservläge; appen belastar inte
  OpenStreetMaps allmänna standardserver som produktionsfallback.

### Rättat
- Lägg till-dialogen monteras bara när den är öppen och kan inte längre fastna i
  en återställningsloop.
- Matställen, kartvyn och den öppna sökdialogen är browsertestade vid 360 px utan
  horisontell overflow.

### Verifiering och utvecklarflöde
- Permanent PR-CI kör Prettier och ESLint på ändrade filer samt full TypeScript-
  kontroll och produktionsbuild.
- UI-ändringar kör dessutom en Playwright-smoketest i Chromium vid 360 px.

'''
          changelog = replace_once(
              changelog,
              "## [0.9.0] – 2026-07-25\n",
              entry + "## [0.9.0] – 2026-07-25\n",
              "external changelog",
          )
          changelog_path.write_text(changelog)

          architecture_path = Path("docs/architecture.md")
          architecture = architecture_path.read_text()
          architecture = replace_once(
              architecture,
              "as of\nv0.9.0.",
              "as of\nv0.10.0.",
              "architecture version",
          )
          architecture = replace_once(
              architecture,
              "Server-only code handles secrets and third-party calls. Geoapify requests are\nmade server-side, and only a normalised response is returned to the browser.\n",
              "Server-only code handles secrets and third-party search calls. Geoapify search\nrequests are made server-side, and only a normalised response is returned to the\nbrowser. Map tiles are loaded browser-side with a separate restricted public key.\n",
              "architecture integrations",
          )
          old_geo = '''Geoapify supports two live operations:

- location autocomplete;
- food-place search around a selected coordinate.

The API key is stored in Lovable Cloud Secrets as `GEOAPIFY_API_KEY` and read
only by server code. It must never appear in:

- client bundles;
- `VITE_` variables;
- GitHub;
- browser responses;
- application logs.

The browser receives a provider-neutral, normalised suggestion model. Search
uses bounded radii and requires an actual selected location when coordinates are
needed.

Current supported radii are 1, 3, 5, 10, 25 and 50 km, with 1 km as the default.
The UI must show Geoapify/OpenStreetMap attribution in live search results.

A selected provider place is inserted or linked atomically. Concurrent requests
for the same provider ID must not create duplicate canonical places.
'''
          new_geo = '''Geoapify supports three user-facing capabilities:

- location autocomplete;
- food-place search around a selected coordinate;
- map tiles for places and search results.

Search and autocomplete use `GEOAPIFY_API_KEY`, stored in Lovable Cloud Secrets
and read only by server code. That key must never appear in client bundles,
`VITE_` variables, GitHub, browser responses or application logs.

Map tiles use a separate `VITE_GEOAPIFY_MAPS_KEY`. This is public build-time
configuration, not a secret: it is visible in the browser and must therefore be
restricted in Geoapify to Matrundan's approved preview and production origins.
It must not be the same key as the server search key and must not grant broader
access than map tiles require.

If the map key is missing, the UI keeps markers and selection available on a
neutral local background. It must not fall back to OpenStreetMap's public default
tile server for production traffic.

The browser receives a provider-neutral, normalised suggestion model. Search
uses bounded radii and requires an actual selected location when coordinates are
needed. Current supported radii are 1, 3, 5, 10, 25 and 50 km, with 1 km as the
default. Search results and map tiles must show the required Geoapify/OpenStreetMap
attribution.

A selected provider place is inserted or linked atomically. Concurrent requests
for the same provider ID must not create duplicate canonical places. Map display
never creates or duplicates canonical place data.
'''
          architecture = replace_once(
              architecture,
              old_geo,
              new_geo,
              "architecture Geoapify",
          )
          architecture = architecture.replace(
              "stored activity kinds in v0.9.0",
              "stored activity kinds in v0.10.0",
          )
          architecture = replace_once(
              architecture,
              '''A normal release candidate should run:

```bash
bunx tsgo --noEmit
bunx eslint <all changed source files>
bun run build
```
''',
              '''Pull requests use `.github/workflows/ci.yml`. The pipeline runs Prettier
and ESLint on changed files, full TypeScript checking and a production build.
UI-affecting changes additionally run the Playwright mobile smoke test at 360 px.

A normal local release candidate should run:

```bash
bunx tsc --noEmit
bunx eslint <all changed source files>
bun run build
bun run test:e2e
```
''',
              "architecture verification",
          )
          architecture_path.write_text(architecture)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["scripts"]["test:e2e"] = "playwright test --project=mobile-chromium"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Format updated files
        run: bunx prettier --write src/lib/matrundan/version.ts README.md CHANGELOG.md docs/architecture.md package.json

      - name: Commit release candidate metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/matrundan/version.ts README.md CHANGELOG.md docs/architecture.md package.json
          git commit -m "Prepare v0.10.0 release candidate"
          git push
