name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr18-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-verified-formatting:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/map-search-clustering-category-icons'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact MapLibre type correction
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("src/components/matrundan/PlaceMap.tsx")
          text = path.read_text()
          updated, count = re.subn(r"(?m)^\s*retainPadding: false,\n", "", text)
          if count != 3:
              raise SystemExit(f"Expected exactly 3 retainPadding lines, found {count}")
          path.write_text(updated)
          PY

      - name: Format exact PR files
        run: >-
          bunx prettier --write
          src/components/matrundan/PlaceMap.tsx
          src/lib/matrundan/geoapify.functions.ts
          tests/e2e/mobile-matstallen.spec.ts

      - name: Verify exact PR files
        shell: bash
        run: |
          git diff --check
          bunx eslint \
            src/components/matrundan/PlaceMap.tsx \
            src/lib/matrundan/geoapify.functions.ts \
            tests/e2e/mobile-matstallen.spec.ts
          bun run typecheck
          bun run build

          mapfile -t changed < <(git diff --name-only)
          expected=(
            "src/components/matrundan/PlaceMap.tsx"
            "tests/e2e/mobile-matstallen.spec.ts"
          )
          if [[ ${#changed[@]} -ne ${#expected[@]} ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
          for index in "${!expected[@]}"; do
            [[ "${changed[$index]}" == "${expected[$index]}" ]] || {
              printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
              exit 1
            }
          done

      - name: Commit verified formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/matrundan/PlaceMap.tsx \
            src/lib/matrundan/geoapify.functions.ts \
            tests/e2e/mobile-matstallen.spec.ts
          git commit -m "Formatera kartfix och rätta MapLibre-typer"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
