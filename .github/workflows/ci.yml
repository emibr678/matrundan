name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-visible-place-markers:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply marker and label fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          place_map = Path("src/components/matrundan/PlaceMap.tsx")
          text = place_map.read_text()

          replacements = [
              (
                  'const POINT_LAYER_ID = "matrundan-points";\n',
                  'const POINT_LAYER_ID = "matrundan-points";\nconst LABEL_LAYER_ID = "matrundan-place-labels";\n',
              ),
              (
                  '    const card = readThemeColor("--card", "#fffdf8");\n',
                  '    const ink = readThemeColor("--foreground", "#3d2d27");\n',
              ),
              (
                  '''      map.addLayer({
        id: POINT_LAYER_ID,
        type: "circle",
        source: PLACE_SOURCE_ID,
        filter: ["!", ["has", "point_count"]],
        paint: {
          "circle-radius": 7,
          "circle-color": card,
          "circle-stroke-color": background,
          "circle-stroke-width": 3,
        },
      });
''',
                  '''      map.addLayer({
        id: POINT_LAYER_ID,
        type: "circle",
        source: PLACE_SOURCE_ID,
        filter: ["!", ["has", "point_count"]],
        paint: {
          "circle-radius": 8,
          "circle-color": primary,
          "circle-opacity": 1,
          "circle-stroke-color": background,
          "circle-stroke-width": 3,
        },
      });
      map.addLayer({
        id: LABEL_LAYER_ID,
        type: "symbol",
        source: PLACE_SOURCE_ID,
        filter: ["!", ["has", "point_count"]],
        minzoom: 15,
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Noto Sans Regular"],
          "text-size": 12,
          "text-variable-anchor": ["left", "right", "top", "bottom"],
          "text-radial-offset": 1.1,
          "text-justify": "auto",
          "text-allow-overlap": false,
          "text-ignore-placement": false,
        },
        paint: {
          "text-color": ink,
          "text-halo-color": background,
          "text-halo-width": 2,
          "text-halo-blur": 0.5,
        },
      });
''',
              ),
              (
                  '''        paint: {
          "circle-radius": 9,
          "circle-color": primary,
          "circle-stroke-color": background,
          "circle-stroke-width": 3,
        },
''',
                  '''        paint: {
          "circle-radius": 11,
          "circle-color": primary,
          "circle-opacity": 1,
          "circle-stroke-color": background,
          "circle-stroke-width": 5,
        },
''',
              ),
              (
                  '''    const syncClusters = () => {
''',
                  '''    mapElementRef.current.parentElement?.setAttribute(
      "data-map-point-visual",
      "primary-pin",
    );
    mapElementRef.current.parentElement?.setAttribute(
      "data-map-label-layer",
      map.getLayer(LABEL_LAYER_ID) ? "ready" : "missing",
    );

    const syncClusters = () => {
''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"PlaceMap replacement not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          place_map.write_text(text)

          test_file = Path("tests/e2e/mobile-matstallen.spec.ts")
          test = test_file.read_text()
          old = '''  await expect(canvas).toBeVisible();
'''
          new = '''  await expect(canvas).toBeVisible();
  await expect(mapRegion).toHaveAttribute("data-map-point-visual", "primary-pin");
  await expect(mapRegion).toHaveAttribute("data-map-label-layer", "ready");
'''
          if old not in test:
              raise SystemExit("Test insertion point not found")
          test = test.replace(old, new, 1)
          test_file.write_text(test)
          PY

          bun install --frozen-lockfile
          bunx prettier --write src/components/matrundan/PlaceMap.tsx tests/e2e/mobile-matstallen.spec.ts
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/matrundan/PlaceMap.tsx tests/e2e/mobile-matstallen.spec.ts .github/workflows/ci.yml
          git commit -m "Visa tydliga individuella kartmarkörer och namn"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find changed files
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi

          mapfile -t format_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' \
              '*.json' '*.css' '*.md' '*.yml' '*.yaml'
          )
          mapfile -t code_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs'
          )

          printf '%s\n' "${format_files[@]}" > changed-format-files.txt
          printf '%s\n' "${code_files[@]}" > changed-code-files.txt

          [[ ${#format_files[@]} -gt 0 ]] && echo "has_format=true" >> "$GITHUB_OUTPUT" || echo "has_format=false" >> "$GITHUB_OUTPUT"
          [[ ${#code_files[@]} -gt 0 ]] && echo "has_code=true" >> "$GITHUB_OUTPUT" || echo "has_code=false" >> "$GITHUB_OUTPUT"

          if printf '%s\n' "${format_files[@]}" | grep -Eq '^(src/components/|src/routes/|src/.*\.(css|tsx)$|playwright\.config\.ts$|tests/e2e/)'; then
            echo "has_ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ui=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "${format_files[@]}" | grep -Eq '^(src/components/matrundan/PlaceMap\.tsx|src/lib/matrundan/maplibre-client\.ts|playwright\.config\.ts|tests/e2e/mobile-matstallen\.spec\.ts)$'; then
            echo "has_map=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_map=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prettier changed files
        if: steps.changes.outputs.has_format == 'true'
        shell: bash
        run: |
          mapfile -t files < changed-format-files.txt
          bunx prettier --check "${files[@]}"

      - name: ESLint changed code
        if: steps.changes.outputs.has_code == 'true'
        shell: bash
        run: |
          mapfile -t files < changed-code-files.txt
          bunx eslint "${files[@]}"

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build

      - name: Install Chromium
        if: steps.changes.outputs.has_ui == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Mobile Chromium smoke test
        if: steps.changes.outputs.has_ui == 'true'
        run: bunx playwright test --project=mobile-chromium

      - name: Install WebKit for map compatibility
        if: steps.changes.outputs.has_map == 'true'
        run: bunx playwright install --with-deps webkit

      - name: iPhone and desktop map compatibility
        if: steps.changes.outputs.has_map == 'true'
        run: >-
          bunx playwright test tests/e2e/mobile-matstallen.spec.ts
          --project=mobile-webkit
          --project=desktop-chromium

      - name: Upload browser report on failure
        if: failure() && steps.changes.outputs.has_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
