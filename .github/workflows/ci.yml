name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr18-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-verified-formatting:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/map-search-clustering-category-icons'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply exact MapLibre type correction
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("src/components/matrundan/PlaceMap.tsx")
          text = path.read_text()
          updated, count = re.subn(r"(?m)^\s*retainPadding: false,\n", "", text)
          if count != 3:
              raise SystemExit(f"Expected exactly 3 retainPadding lines, found {count}")
          path.write_text(updated)
          PY

      - name: Format exact PR files
        run: >-
          bunx prettier --write
          src/components/matrundan/PlaceMap.tsx
          src/lib/matrundan/geoapify.functions.ts
          tests/e2e/mobile-matstallen.spec.ts

      - name: Capture verification result
        id: verification
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo '--- git diff --check ---'
            git diff --check
            echo '--- eslint ---'
            bunx eslint \
              src/components/matrundan/PlaceMap.tsx \
              src/lib/matrundan/geoapify.functions.ts \
              tests/e2e/mobile-matstallen.spec.ts
            echo '--- typecheck ---'
            bun run typecheck
            echo '--- build ---'
            bun run build
            echo '--- changed files ---'
            git diff --name-only

            mapfile -t changed < <(git diff --name-only)
            expected=(
              "src/components/matrundan/PlaceMap.tsx"
              "tests/e2e/mobile-matstallen.spec.ts"
            )
            if [[ ${#changed[@]} -ne ${#expected[@]} ]]; then
              printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
              exit 1
            fi
            for index in "${!expected[@]}"; do
              [[ "${changed[$index]}" == "${expected[$index]}" ]] || {
                printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
                exit 1
              }
            done
          } > verification.log 2>&1
          status=$?
          cat verification.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr18-verification-log
          path: verification.log
          if-no-files-found: error

      - name: Enforce verification result
        if: steps.verification.outputs.status != '0'
        run: exit 1

      - name: Commit verified formatting
        if: steps.verification.outputs.status == '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/matrundan/PlaceMap.tsx \
            src/lib/matrundan/geoapify.functions.ts \
            tests/e2e/mobile-matstallen.spec.ts
          git commit -m "Formatera kartfix och rätta MapLibre-typer"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
