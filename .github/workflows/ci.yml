name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set verification level
        id: verification
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" || "${{ github.event.pull_request.draft }}" != "true" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Full verification: browser checks run when relevant." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "Fast verification for draft PR: browser checks are deferred until ready for review." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up pinned Bun
        id: bun
        uses: oven-sh/setup-bun@v2

      - name: Report runtime
        run: echo "Bun ${{ steps.bun.outputs.bun-version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find changed files
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi

          bun scripts/repo-tools.mjs ci-flags "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Apply group settings integration diagnostic
        run: bun scripts/v16-route-codemod.mjs

      - name: Format v1.6 diagnostic workspace
        env:
          MATRUNDAN_BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: bun run format:changed

      - name: Upload formatted v1.6 sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-v1-6-sources
          path: |
            src/components/matrundan/AddPlaceDialogImplV16.tsx
            src/components/matrundan/AddPlaceResultDialogsV16.tsx
            src/components/matrundan/CreateGroupDialog.tsx
            src/components/matrundan/GroupSettingsSectionV16.tsx
            src/components/matrundan/ManualAddPlaceFormV16.tsx
            src/components/matrundan/MultiAreaPlaceMap.tsx
            src/components/matrundan/PlaceDiscoveryV16.tsx
            src/components/matrundan/SearchAreaControlsV16.tsx
            src/components/matrundan/SearchResultSectionsV16.tsx
            src/lib/matrundan/add-place-v16-utils.ts
            src/lib/matrundan/geoapify.functions.ts
            src/lib/matrundan/live-admin.ts
            src/lib/matrundan/live-repository.ts
            src/lib/matrundan/places-provider.ts
            src/lib/matrundan/search-areas.test.ts
            src/lib/matrundan/search-areas.ts
            src/routes/gruppen.tsx
            tests/e2e/v1-6-search-areas.spec.ts
          if-no-files-found: error

      - name: Doctor
        run: bun run doctor

      - name: Guard tooling and lockfiles
        env:
          MATRUNDAN_BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: bun scripts/repo-tools.mjs guard-tooling

      - name: Shell scripts
        run: bun run check:shell

      - name: Prettier changed code and configuration
        if: steps.changes.outputs.has_format == 'true'
        env:
          MATRUNDAN_BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: bun run format:check:changed

      - name: ESLint changed code
        if: steps.changes.outputs.has_code == 'true'
        env:
          MATRUNDAN_BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: bun run lint:changed

      - name: Unit tests
        run: bun run test:unit

      - name: TypeScript
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Install Chromium
        if: steps.verification.outputs.full == 'true' && steps.changes.outputs.has_ui == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Mobile Chromium smoke test
        if: steps.verification.outputs.full == 'true' && steps.changes.outputs.has_ui == 'true'
        run: bun run test:mobile

      - name: Install WebKit for map compatibility
        if: steps.verification.outputs.full == 'true' && steps.changes.outputs.has_map == 'true'
        run: bunx playwright install --with-deps webkit

      - name: iPhone and desktop map compatibility
        if: steps.verification.outputs.full == 'true' && steps.changes.outputs.has_map == 'true'
        run: bun run test:map:cross-browser

      - name: Upload browser report on failure
        if: failure() && steps.verification.outputs.full == 'true' && steps.changes.outputs.has_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
