name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ci-tree-inspect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-163-platsunderhall
          fetch-depth: 0
          show-progress: false

      - name: Report exact tree SHAs
        shell: bash
        run: |
          set -euo pipefail
          echo "CURRENT_COMMIT=$(git rev-parse HEAD)"
          echo "CURRENT_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "VERIFIED_TREE=$(git rev-parse 'fe84082e3a8c0e5b592099bcc5da7798a629d6da^{tree}')"
