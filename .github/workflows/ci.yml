name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr18-cross-browser-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/map-search-clustering-category-icons'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply diagnosed cross-browser fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          place_map = Path("src/components/matrundan/PlaceMap.tsx")
          text = place_map.read_text()
          replacements = {
              "mapRef.current?.getStyle().layers?.length ?? 0": "mapRef.current?.getStyle()?.layers?.length ?? 0",
              "Object.keys(mapRef.current?.getStyle().sources ?? {}).length": "Object.keys(mapRef.current?.getStyle()?.sources ?? {}).length",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new)
          place_map.write_text(text)

          test_file = Path("tests/e2e/mobile-matstallen.spec.ts")
          test_text = test_file.read_text()
          marker = 'import { expect, test, type Page } from "@playwright/test";\n'
          if test_text.count(marker) != 1:
              raise SystemExit("Could not locate Playwright import exactly once")
          if "test.setTimeout(60_000);" in test_text:
              raise SystemExit("Test timeout is already present")
          test_file.write_text(test_text.replace(marker, marker + "\ntest.setTimeout(60_000);\n", 1))
          PY

      - name: Format and static verification
        shell: bash
        run: |
          bunx prettier --write \
            src/components/matrundan/PlaceMap.tsx \
            tests/e2e/mobile-matstallen.spec.ts
          git diff --check
          bunx eslint \
            src/components/matrundan/PlaceMap.tsx \
            src/lib/matrundan/geoapify.functions.ts \
            tests/e2e/mobile-matstallen.spec.ts
          bun run typecheck
          bun run build

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium webkit

      - name: Verify map in all browser profiles
        run: >-
          bunx playwright test tests/e2e/mobile-matstallen.spec.ts
          --project=mobile-chromium
          --project=mobile-webkit
          --project=desktop-chromium

      - name: Restore permanent CI and verify final diff
        shell: bash
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          mapfile -t changed < <(git diff --name-only)
          expected=(
            ".github/workflows/ci.yml"
            "src/components/matrundan/PlaceMap.tsx"
            "tests/e2e/mobile-matstallen.spec.ts"
          )
          if [[ ${#changed[@]} -ne ${#expected[@]} ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
          for index in "${!expected[@]}"; do
            [[ "${changed[$index]}" == "${expected[$index]}" ]] || {
              printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
              exit 1
            }
          done

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            src/components/matrundan/PlaceMap.tsx \
            tests/e2e/mobile-matstallen.spec.ts
          git commit -m "Rätta säker kartstatus i WebKit och desktop"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser-fix
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
