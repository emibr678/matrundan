name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Correct detail route hook order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/matstallen.$placeId.tsx')
          text = path.read_text()
          old = '''  if (!place) return <NotFound />;

            const rating = avgRating(place.id);
            const visits = visitsFor(place.id);
          '''
          new = '''  const visits = place ? visitsFor(place.id) : [];
          '''
          if old in text:
              text = text.replace(old, new)
              marker = '''  const detail = React.useMemo(() => {'''
              end = '''  }, [visits]);

            const goBack = () => {'''
              replacement = '''  }, [visits]);

            if (!place) return <NotFound />;

            const rating = avgRating(place.id);
            const fav = isFavorite(place.id);
            const isNext = state.nextPlaceId === place.id;
            const groupArchived = state.group.lifecycleStatus === "archived";
            const placeArchived = place.collectionStatus === "archived";
            const writable = !groupArchived && !placeArchived;

            const goBack = () => {'''
              if end not in text:
                  raise SystemExit('could not locate post-memo block')
              text = text.replace(end, replacement)
              duplicate = '''  const fav = isFavorite(place.id);
            const isNext = state.nextPlaceId === place.id;
            const groupArchived = state.group.lifecycleStatus === "archived";
            const placeArchived = place.collectionStatus === "archived";
            const writable = !groupArchived && !placeArchived;

          '''
              text = text.replace(duplicate, '', 1)
              path.write_text(text)
          PY
          bunx prettier --write 'src/routes/matstallen.$placeId.tsx'

      - name: Export lint and type reports
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- \
            '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' > changed-code-files.txt
          mapfile -t files < changed-code-files.txt
          bunx eslint --format json --output-file eslint-report.json "${files[@]}" || true
          bun run typecheck > typecheck-report.txt 2>&1 || true
          bun run build > build-report.txt 2>&1 || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: package-4b-diagnostics
          path: |
            eslint-report.json
            typecheck-report.txt
            build-report.txt
          if-no-files-found: error
          retention-days: 1

      - name: Commit hook correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/matstallen.$placeId.tsx'
          if git diff --cached --quiet; then
            echo "Hookordningen är redan rättad."
            exit 0
          fi
          git commit -m "Rätta hookordning i matställets detaljvy"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
