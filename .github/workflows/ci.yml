name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: '2.115.0'
  SUPABASE_TELEMETRY_DISABLED: '1'
  STAGING_SUPABASE_PROJECT_ID: wpihfmwbubvdiaavtpia

jobs:
  classify:
    name: Classify candidate
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.changes.outputs.base_sha }}
      has_format: ${{ steps.changes.outputs.has_format }}
      has_ui: ${{ steps.changes.outputs.has_ui }}
      has_browser: ${{ steps.changes.outputs.has_browser }}
      has_map: ${{ steps.changes.outputs.has_map }}
      has_db: ${{ steps.changes.outputs.has_db }}
      has_migrations: ${{ steps.changes.outputs.has_migrations }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false
      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun
      - name: Classify changed files
        id: changes
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="${{ github.event.before }}"
          else
            base_sha="$(git rev-parse HEAD^)"
          fi
          bun scripts/repo-tools.mjs ci-flags "$base_sha" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality and contracts
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false
      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci
      - name: Doctor
        run: bun run doctor
      - name: Guard tooling and lockfiles
        env:
          MATRUNDAN_BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: bun scripts/repo-tools.mjs guard-tooling
      - name: Shell scripts
        run: bun run check:shell
      - name: Release and changelog contract
        env:
          MATRUNDAN_CI_EVENT_NAME: "${{ github.event_name }}"
          MATRUNDAN_VERSION_EXEMPT: "${{ contains(github.event.pull_request.body || '', '- [x] Version: inte relevant') && '1' || '0' }}"
        run: bun scripts/release-check.mjs "${{ needs.classify.outputs.base_sha }}"
      - name: Database and RPC contract
        run: bun scripts/database-contract-check.mjs "${{ needs.classify.outputs.base_sha }}"
      - name: Dead code guard
        run: bun run check:dead-code
      - name: Prettier changed code and configuration
        if: needs.classify.outputs.has_format == 'true'
        env:
          MATRUNDAN_BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: bun run format:check:changed
      - name: Create formatting patch on failure
        if: failure() && needs.classify.outputs.has_format == 'true'
        env:
          MATRUNDAN_BASE_SHA: ${{ needs.classify.outputs.base_sha }}
        run: |
          bun run format:changed
          git diff --binary > formatting.patch
      - name: Upload formatting patch
        if: failure() && needs.classify.outputs.has_format == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatting-patch-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
          path: formatting.patch
          if-no-files-found: error
          retention-days: 5
      - name: ESLint full repository
        run: bun run lint

  unit:
    name: Unit tests
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false
      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci
      - name: Unit tests
        run: bun run test:unit

  typecheck:
    name: TypeScript
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false
      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci
      - name: App TypeScript
        run: bun run typecheck
      - name: Unit test TypeScript
        run: bun run typecheck:unit
      - name: Playwright TypeScript
        run: bun run typecheck:e2e

  build:
    name: Build
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false
      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci
      - name: Lovable preview build contract
        run: bun run build
      - name: Production build and Cloudflare staging artifact
        run: bun run cloudflare:build

  supabase_types:
    name: Supabase type drift
    needs: classify
    if: needs.classify.outputs.has_db == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false
      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci
      - name: Start migration-built local Postgres
        run: npx --yes "supabase@${{ env.SUPABASE_CLI_VERSION }}" db start
      - name: Verify generated Supabase types
        run: bash scripts/supabase-types.sh check src/integrations/supabase/types.ts
      - name: Generate expected types on failure
        if: failure()
        run: bash scripts/supabase-types.sh generate supabase-types.generated.ts
      - name: Upload expected types on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supabase-types-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
          path: supabase-types.generated.ts
          if-no-files-found: ignore
          retention-days: 5
      - name: Stop local Supabase database
        if: always()
        run: npx --yes "supabase@${{ env.SUPABASE_CLI_VERSION }}" stop --no-backup

  staging_db_readiness:
    name: Staging DB readiness
    needs: classify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
      pull-requests: read
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          show-progress: false
      - name: Guard exact candidate and append-only migration history
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid PR head or base SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo "Checked out commit does not match the PR head SHA." >&2
            exit 1
          fi
          while IFS=$'\t' read -r status path extra; do
            [[ -z "$status" ]] && continue
            if [[ "$status" != "A" ]]; then
              echo "Existing migrations are append-only; found $status for $path${extra:+ -> $extra}." >&2
              exit 1
            fi
          done < <(
            git diff --name-status --diff-filter=ACDMRTUXB "$BASE_SHA" "$TARGET_SHA" -- supabase/migrations
          )
      - name: Validate read-only staging credential
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "Missing STAGING_SUPABASE_ACCESS_TOKEN in the GitHub staging environment." >&2
            exit 1
          fi
      - name: Verify every repo migration exists in Supabase Staging
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const token = process.env.STAGING_SUPABASE_ACCESS_TOKEN;
          const projectId = process.env.STAGING_SUPABASE_PROJECT_ID;
          const endpoint =
            'https://api.supabase.com/v1/projects/' + projectId + '/database/migrations';
          const response = await fetch(endpoint, {
            method: 'GET',
            headers: {
              accept: 'application/json',
              authorization: 'Bearer ' + token,
            },
            signal: AbortSignal.timeout(15_000),
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok || !Array.isArray(payload)) {
            console.error(
              'Could not read Supabase Staging migration history (HTTP ' +
                response.status +
                ').',
            );
            process.exit(1);
          }
          const remote = new Set(
            payload
              .map((row) => row?.name)
              .filter((value) => typeof value === 'string' && value.length > 0),
          );
          const local = fs
            .readdirSync('supabase/migrations')
            .filter((name) => name.endsWith('.sql'))
            .sort()
            .map((name) => ({ name, stem: path.basename(name, '.sql') }));
          function candidatesFor(stem) {
            const suffix = stem.replace(/^\d+_/, '');
            return new Set([
              stem,
              stem.replaceAll('-', '_'),
              suffix,
              suffix.replaceAll('-', '_'),
            ]);
          }
          const missing = local.filter(
            ({ stem }) =>
              ![...candidatesFor(stem)].some((candidate) => remote.has(candidate)),
          );
          if (missing.length > 0) {
            console.error('Supabase Staging is not merge-ready; missing repo migration(s):');
            for (const migration of missing) console.error('- ' + migration.name);
            console.error(
              'Apply missing migrations only through the separately approved Staging database apply flow, then rerun failed CI jobs.',
            );
            process.exit(1);
          }
          console.log(
            'Supabase Staging is merge-ready for ' +
              process.env.TARGET_SHA +
              ': all ' +
              local.length +
              ' repo migrations are represented.',
          );
          NODE

  browser:
    name: Mobile Chromium shard ${{ matrix.shard }}/2
    needs: classify
    if: needs.classify.outputs.has_browser == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false
      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}-chromium
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Full mobile Chromium shard
        run: |
          started="$(date +%s)"
          bun run test:mobile -- --shard=${{ matrix.shard }}/2 --max-failures=3 --retries=0
          finished="$(date +%s)"
          echo "Shard ${{ matrix.shard }}/2 duration: $((finished - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser report on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 5

  map_browser:
    name: Map cross-browser
    needs: classify
    if: needs.classify.outputs.has_map == 'true' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          show-progress: false
      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}-map
      - name: Install Chromium and WebKit
        run: bunx playwright install --with-deps chromium webkit
      - name: iPhone and desktop map compatibility
        run: bun run test:map:cross-browser

  required:
    name: CI / required
    needs:
      - classify
      - quality
      - unit
      - typecheck
      - build
      - supabase_types
      - staging_db_readiness
      - browser
      - map_browser
    if: always() && needs.classify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      TYPECHECK_RESULT: ${{ needs.typecheck.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      SUPABASE_TYPES_RESULT: ${{ needs.supabase_types.result }}
      STAGING_DB_RESULT: ${{ needs.staging_db_readiness.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      MAP_BROWSER_RESULT: ${{ needs.map_browser.result }}
    steps:
      - name: Summarize merge-critical candidate checks
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "quality:$QUALITY_RESULT" \
            "unit:$UNIT_RESULT" \
            "typecheck:$TYPECHECK_RESULT" \
            "build:$BUILD_RESULT" \
            "supabase-types:$SUPABASE_TYPES_RESULT" \
            "staging-db:$STAGING_DB_RESULT" \
            "browser:$BROWSER_RESULT" \
            "map-browser:$MAP_BROWSER_RESULT"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            printf '%-18s %s\n' "$name" "$result"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failed=1
            fi
          done
          if (( failed != 0 )); then
            echo "One or more merge-critical candidate checks failed or were cancelled." >&2
            exit 1
          fi
          echo "All relevant candidate checks passed or were legitimately skipped." >> "$GITHUB_STEP_SUMMARY"

  artifact_cleanup:
    name: Clean failed-run artifacts
    needs:
      - classify
      - quality
      - unit
      - typecheck
      - build
      - supabase_types
      - staging_db_readiness
      - browser
      - map_browser
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        needs.quality.result == 'failure' ||
        needs.unit.result == 'failure' ||
        needs.typecheck.result == 'failure' ||
        needs.build.result == 'failure' ||
        needs.supabase_types.result == 'failure' ||
        needs.staging_db_readiness.result == 'failure' ||
        needs.browser.result == 'failure' ||
        needs.map_browser.result == 'failure'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          show-progress: false
      - name: Remove superseded and legacy artifacts
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const cleanup = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/artifact-lifecycle.cjs');
            await cleanup({
              github,
              context,
              core,
              prNumber: context.payload.pull_request.number,
              currentRunId: process.env.GITHUB_RUN_ID,
              scope: 'ci',
              keepCurrent: true,
              cleanupLegacy: true,
            });

  handoff:
    name: Mobile handoff
    needs: required
    if: github.event_name == 'pull_request' && needs.required.result == 'success'
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/mobile-pr-handoff.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.pull_request.number }}
      ci_run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  staging:
    name: Staging deploy
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.required.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/cloudflare-staging-deploy.yml
    with:
      expected_sha: ${{ github.sha }}
    secrets: inherit
