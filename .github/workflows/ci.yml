name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply final Paket 4B fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          session = Path("src/lib/matrundan/session.tsx")
          text = session.read_text()
          text = text.replace(
              '    const groups = ((data ?? []) as UserGroupSummary[])\n      .map((group) => ({',
              '    const groups: UserGroupSummary[] = ((data ?? []) as UserGroupSummary[])\n      .map((group): UserGroupSummary => ({',
          )
          session.write_text(text)

          detail = Path('src/routes/matstallen.$placeId.tsx')
          text = detail.read_text()
          text = text.replace(
              '  const visits = place ? visitsFor(place.id) : [];\n',
              '  const visits = React.useMemo(\n    () => (place ? visitsFor(place.id) : []),\n    [place, visitsFor],\n  );\n',
          )
          detail.write_text(text)

          admin = Path("src/components/matrundan/PlaceAdminDialog.tsx")
          text = admin.read_text()
          text = text.replace(
              '  const canAdmin = activeGroupRole === "owner" || activeGroupRole === "admin";\n',
              '  const ownRole = state.members.find((member) => member.id === state.currentUserId)?.role;\n  const canAdmin =\n    activeGroupRole === "owner" ||\n    activeGroupRole === "admin" ||\n    ownRole === "ägare" ||\n    ownRole === "admin";\n',
          )
          admin.write_text(text)

          version = Path("src/lib/matrundan/version.ts")
          text = version.read_text()
          text = text.replace('export const APP_VERSION = "0.9.0";', 'export const APP_VERSION = "0.10.0";')
          text = text.replace('export const APP_VERSION_DATE = "2026-07-25";', 'export const APP_VERSION_DATE = "2026-07-27";')
          marker = 'export const CHANGELOG: ChangelogEntry[] = [\n'
          entry = '''export const CHANGELOG: ChangelogEntry[] = [
  {
    version: APP_VERSION,
    date: APP_VERSION_DATE,
    summary:
      "Arkivera grupper och matställen utan att förlora historik, korrigera gruppens platsuppgifter och redigera ditt eget omdöme.",
    sections: [
      {
        kind: "Nytt",
        items: [
          "Gruppens ägare kan arkivera och återaktivera gruppen. Historik, medlemskap, besök, betyg och kommentarer bevaras i ett skrivskyddat läge.",
          "Ägare och admin kan arkivera eller återställa ett ställe i gruppens samling utan att den kanoniska platsen eller tidigare besök raderas.",
          "Kategori, kökstyper, Passar för och gruppens anteckning kan korrigeras för den egna gruppen utan att påverka andra grupper.",
          "Varje medlem kan redigera sitt eget betyg och sin egen kommentar, men aldrig någon annans omdöme.",
          "Samma arkiv- och omdömesflöden fungerar i både demo- och live-läge.",
        ],
      },
      {
        kind: "Förbättrat",
        items: [
          "Gruppväljaren skiljer tydligt mellan aktiva och arkiverade grupper, och matställeslistan visar arkiverade ställen i en separat administrationssektion.",
          "Arkivering återkallar öppna inbjudningar, rensar nästa stopp och blockerar nya skrivningar medan all historik förblir läsbar.",
          "Planering, karta, topplista och aktiv samlingsstatistik använder endast aktiva matställen.",
        ],
      },
    ],
  },
'''
          if 'summary:\n      "Arkivera grupper och matställen' not in text:
              text = text.replace(marker, entry, 1)
          version.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          entry = '''## [0.10.0] – 2026-07-27

### Nytt
- **Arkivera och återaktivera grupper.** Historik, medlemskap, besök, ställen,
  betyg och kommentarer bevaras i ett skrivskyddat läge. Endast ägaren kan
  ändra gruppens livscykel.
- **Administrera gruppens matställen.** Ägare och admin kan arkivera eller
  återställa gruppens koppling till ett ställe utan att den kanoniska platsen
  eller tidigare besök raderas.
- **Gruppspecifika platskorrigeringar.** Kategori, kökstyper, Passar för och
  gruppens anteckning kan ändras för den egna gruppen utan att påverka andra
  grupper.
- **Redigera eget omdöme.** En medlem kan ändra sitt eget betyg och sin egen
  kommentar, men aldrig någon annans omdöme.
- Demo- och live-läge använder samma produktmodell för arkiv och egna omdömen.

### Förbättrat
- Gruppväljaren skiljer mellan aktiva och arkiverade grupper. Arkiverade grupper
  behåller läsåtkomst men saknar skrivbara huvudflöden.
- Matställeslistan, kartan, topplistan och nästa-stopp-flödet använder endast
  aktiva matställen; arkiverade ställen finns i en separat administrationsdel.
- Grupparkivering återkallar öppna inbjudningar, rensar nästa stopp och blockerar
  gruppspecifika skrivningar på serversidan.
- Kanoniska namn, adresser, koordinater, provideridentiteter, besök och omdömen
  bevaras och dupliceras inte.

'''
          if '## [0.10.0] – 2026-07-27' not in text:
              text = text.replace('## [0.9.0] – 2026-07-25', entry + '## [0.9.0] – 2026-07-25', 1)
          changelog.write_text(text)
          PY

      - name: Format, lint, typecheck and build
        shell: bash
        run: |
          bunx prettier --write \
            src/lib/matrundan/session.tsx \
            'src/routes/matstallen.$placeId.tsx' \
            src/components/matrundan/PlaceAdminDialog.tsx \
            src/lib/matrundan/version.ts \
            CHANGELOG.md
          bunx eslint \
            src/lib/matrundan/session.tsx \
            'src/routes/matstallen.$placeId.tsx' \
            src/components/matrundan/PlaceAdminDialog.tsx \
            src/lib/matrundan/version.ts
          bun run typecheck
          bun run build

      - name: Commit final fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/matrundan/session.tsx \
            'src/routes/matstallen.$placeId.tsx' \
            src/components/matrundan/PlaceAdminDialog.tsx \
            src/lib/matrundan/version.ts \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Slutförandefixarna är redan committade."
            exit 0
          fi
          git commit -m "Slutför Paket 4B och version 0.10.0"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
