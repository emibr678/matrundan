name: Format Package 4A.1 map

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format map component
        run: bunx prettier --write src/components/matrundan/PlaceMap.tsx

      - name: Upload formatted component
        uses: actions/upload-artifact@v4
        with:
          name: formatted-place-map
          path: src/components/matrundan/PlaceMap.tsx
