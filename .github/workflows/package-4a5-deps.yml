name: Package 4A.5 dependencies

on:
  push:
    branches:
      - feature/package-4a5-maplibre-vector

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/package-4a5-maplibre-vector
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Replace Leaflet with MapLibre
        run: |
          bun remove leaflet leaflet.markercluster @types/leaflet @types/leaflet.markercluster
          bun add --exact maplibre-gl@5.24.0
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/package-4a5-deps.yml
          git add package.json bun.lock
          git commit -m "Replace Leaflet with MapLibre"
          git push origin HEAD:feature/package-4a5-maplibre-vector
