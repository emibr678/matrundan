name: Geoapify staging provider diagnostic

on:
  push:
    branches:
      - feature/465-robust-place-search
    paths:
      - scripts/geoapify-provider-diagnostic.ts
      - .github/workflows/geoapify-provider-diagnostic.yml

permissions:
  contents: read

jobs:
  real-provider:
    name: Read-only live Geoapify search comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    env:
      STAGING_GEOAPIFY_API_KEY: ${{ secrets.STAGING_GEOAPIFY_API_KEY }}
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun
      - name: Compare real Geoapify candidate responses (10 calls max)
        run: bun scripts/geoapify-provider-diagnostic.ts
