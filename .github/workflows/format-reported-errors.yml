name: Format reported errors branch

on:
  push:
    branches:
      - feature/rapporterade-fel-ux

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rapporterade-fel-ux
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format changed source files
        run: |
          bunx prettier --write \
            src/lib/matrundan/place-data-report-view.test.ts \
            src/lib/matrundan/place-data-report-view.ts \
            src/lib/matrundan/version.ts \
            src/routes/rapporterade-fel.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/matrundan/place-data-report-view.test.ts src/lib/matrundan/place-data-report-view.ts src/lib/matrundan/version.ts src/routes/rapporterade-fel.tsx
          git commit -m "style: format reported errors UX"
          git push origin HEAD:feature/rapporterade-fel-ux
