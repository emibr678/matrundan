name: Hotfix release notes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.ref == 'hotfix/paket-4b-ci-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Sync version and release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = Path("src/lib/matrundan/version.ts")
          text = version.read_text()
          text = text.replace('export const APP_VERSION = "0.9.0";', 'export const APP_VERSION = "0.10.0";')
          text = text.replace('export const APP_VERSION_DATE = "2026-07-25";', 'export const APP_VERSION_DATE = "2026-07-27";')
          marker = 'export const CHANGELOG: ChangelogEntry[] = [\n'
          entry = '''export const CHANGELOG: ChangelogEntry[] = [
            {
              version: APP_VERSION,
              date: APP_VERSION_DATE,
              summary:
                "Arkivera grupper och matställen utan att förlora historik, korrigera gruppens platsuppgifter och redigera ditt eget omdöme.",
              sections: [
                {
                  kind: "Nytt",
                  items: [
                    "Gruppens ägare kan arkivera och återaktivera gruppen. Historik, medlemskap, besök, betyg och kommentarer bevaras i ett skrivskyddat läge.",
                    "Ägare och admin kan arkivera eller återställa ett ställe i gruppens samling utan att den kanoniska platsen eller tidigare besök raderas.",
                    "Kategori, kökstyper, Passar för och gruppens anteckning kan korrigeras för den egna gruppen utan att påverka andra grupper.",
                    "Varje medlem kan redigera sitt eget betyg och sin egen kommentar, men aldrig någon annans omdöme.",
                    "Samma arkiv- och omdömesflöden fungerar i både demo- och live-läge.",
                  ],
                },
                {
                  kind: "Förbättrat",
                  items: [
                    "Gruppväljaren skiljer tydligt mellan aktiva och arkiverade grupper, och matställeslistan visar arkiverade ställen i en separat administrationssektion.",
                    "Arkivering återkallar öppna inbjudningar, rensar nästa stopp och blockerar nya skrivningar medan all historik förblir läsbar.",
                    "Planering, karta, topplista och aktiv samlingsstatistik använder endast aktiva matställen.",
                  ],
                },
              ],
            },
          '''
          if '"Arkivera grupper och matställen utan att förlora historik' not in text:
              text = text.replace(marker, entry, 1)
          version.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          entry = '''## [0.10.0] – 2026-07-27

          ### Nytt
          - **Arkivera och återaktivera grupper.** Historik, medlemskap, besök,
            ställen, betyg och kommentarer bevaras i ett skrivskyddat läge.
          - **Administrera gruppens matställen.** Ägare och admin kan arkivera,
            återställa och korrigera gruppspecifika platsuppgifter utan att den
            kanoniska platsen eller tidigare besök raderas.
          - **Redigera eget omdöme.** En medlem kan ändra sitt eget betyg och sin
            egen kommentar, men aldrig någon annans omdöme.
          - Demo- och live-läge använder samma produktmodell för arkiv och omdömen.

          ### Förbättrat
          - Aktiva och arkiverade grupper skiljs åt i gruppväljaren.
          - Lista, karta, topplista och nästa stopp använder bara aktiva ställen;
            arkiverade ställen finns kvar med full historik och kan återställas.
          - Grupparkivering återkallar öppna inbjudningar, rensar nästa stopp och
            blockerar skrivningar på serversidan.
          - Ordinarie CI är åter skrivskyddad och verifierar format, lint,
            TypeScript, bygge och relevanta mobilflöden.

          '''
          if '## [0.10.0] – 2026-07-27' not in text:
              text = text.replace('## [0.9.0] – 2026-07-25', entry + '## [0.9.0] – 2026-07-25', 1)
          changelog.write_text(text)

          readme = Path("README.md")
          text = readme.read_text()
          start = text.index('## Status – v0.9.0')
          end = text.index('### Två lägen sida vid sida')
          replacement = '''## Status – v0.10.0

          Paket 4B lägger till säker administration utan att bryta gruppens
          gemensamma mathistorik. Gruppens ägare kan arkivera och återaktivera
          gruppen; historik, medlemskap, besök, betyg och kommentarer bevaras i
          ett skrivskyddat läge. Ägare och admin kan arkivera eller återställa
          gruppens koppling till ett matställe och korrigera kategori, kökstyper,
          Passar för och gruppens anteckning utan att ändra den kanoniska platsen.
          Varje medlem kan redigera sitt eget omdöme, men aldrig någon annans.
          Demo- och live-läge följer samma produktmodell.

          Paket 3D:s privata nivåer, badges, topplistor och milstolpar är kvar och
          räknas fortsatt deterministiskt från faktiska deltagna besök.

          '''
          readme.write_text(text[:start] + replacement + text[end:])
          PY
          bunx prettier --write src/lib/matrundan/version.ts README.md CHANGELOG.md
      - name: Commit release notes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/matrundan/version.ts README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Versionsinformationen är redan synkad."
            exit 0
          fi
          git commit -m "Dokumentera Paket 4B som version 0.10.0"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
