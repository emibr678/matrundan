name: Verify package 4A

on:
  push:
    branches:
      - feature/package-4a-map-demo
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Lint changed source files
        shell: bash
        run: |
          set +e
          bunx eslint \
            src/components/matrundan/AddPlaceDialog.tsx \
            src/components/matrundan/AddPlaceDialogImpl.tsx \
            src/components/matrundan/PlaceMap.tsx \
            src/lib/matrundan/demo-data.ts \
            src/lib/matrundan/places-provider.ts \
            src/routes/matstallen.tsx \
            > lint.log 2>&1
          status=$?
          echo "$status" > lint.status
          cat lint.log
          exit 0

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-4a-lint
          path: lint.log
          if-no-files-found: error

      - name: Production build
        run: bun run build

      - name: Enforce lint result
        shell: bash
        run: test "$(cat lint.status)" = "0"
