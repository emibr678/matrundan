name: Verify package 4A

on:
  push:
    branches:
      - feature/package-4a-map-demo
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies and Playwright
        run: bun add --dev @playwright/test@latest

      - name: Commit Playwright dependency to feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package.json bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "Add Playwright mobile test dependency"
          git push

      - name: Prettier
        run: >-
          bunx prettier --check
          src/components/matrundan/AddPlaceDialog.tsx
          src/components/matrundan/AddPlaceDialogImpl.tsx
          src/components/matrundan/PlaceMap.tsx
          src/lib/matrundan/demo-data.ts
          src/lib/matrundan/places-provider.ts
          src/routes/matstallen.tsx
          playwright.config.ts
          tests/e2e/mobile-matstallen.spec.ts

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: ESLint
        run: >-
          bunx eslint
          src/components/matrundan/AddPlaceDialog.tsx
          src/components/matrundan/AddPlaceDialogImpl.tsx
          src/components/matrundan/PlaceMap.tsx
          src/lib/matrundan/demo-data.ts
          src/lib/matrundan/places-provider.ts
          src/routes/matstallen.tsx
          playwright.config.ts
          tests/e2e/mobile-matstallen.spec.ts

      - name: Production build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Mobile browser smoke test
        run: bunx playwright test --project=mobile-chromium

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-4a-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
