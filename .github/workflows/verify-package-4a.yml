name: Verify package 4A

on:
  push:
    branches:
      - feature/package-4a-map-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint changed source files
        run: >-
          npx eslint
          src/components/matrundan/AddPlaceDialog.tsx
          src/components/matrundan/AddPlaceDialogImpl.tsx
          src/components/matrundan/PlaceMap.tsx
          src/lib/matrundan/demo-data.ts
          src/lib/matrundan/places-provider.ts
          src/routes/matstallen.tsx

      - name: Production build
        run: npm run build
