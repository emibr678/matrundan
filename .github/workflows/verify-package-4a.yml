name: Verify package 4A

on:
  push:
    branches:
      - feature/package-4a-map-demo
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format candidate sources
        run: >-
          bunx prettier --write
          src/components/matrundan/AddPlaceDialog.tsx
          src/components/matrundan/AddPlaceDialogImpl.tsx
          src/components/matrundan/PlaceMap.tsx
          src/lib/matrundan/demo-data.ts
          src/lib/matrundan/places-provider.ts
          src/routes/matstallen.tsx

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: package-4a-formatted
          path: |
            src/components/matrundan/AddPlaceDialog.tsx
            src/components/matrundan/AddPlaceDialogImpl.tsx
            src/components/matrundan/PlaceMap.tsx
            src/lib/matrundan/demo-data.ts
            src/lib/matrundan/places-provider.ts
            src/routes/matstallen.tsx
          if-no-files-found: error

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Lint changed source files
        run: >-
          bunx eslint
          src/components/matrundan/AddPlaceDialog.tsx
          src/components/matrundan/AddPlaceDialogImpl.tsx
          src/components/matrundan/PlaceMap.tsx
          src/lib/matrundan/demo-data.ts
          src/lib/matrundan/places-provider.ts
          src/routes/matstallen.tsx

      - name: Production build
        run: bun run build
