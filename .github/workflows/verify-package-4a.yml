name: Verify package 4A

on:
  push:
    branches:
      - feature/package-4a-map-demo
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format candidate sources
        run: >-
          bunx prettier --write
          src/components/matrundan/AddPlaceDialog.tsx
          src/components/matrundan/AddPlaceDialogImpl.tsx
          src/components/matrundan/PlaceMap.tsx
          src/lib/matrundan/demo-data.ts
          src/lib/matrundan/places-provider.ts
          src/routes/matstallen.tsx

      - name: Commit formatting to feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- \
            src/components/matrundan/AddPlaceDialog.tsx \
            src/components/matrundan/AddPlaceDialogImpl.tsx \
            src/components/matrundan/PlaceMap.tsx \
            src/lib/matrundan/demo-data.ts \
            src/lib/matrundan/places-provider.ts \
            src/routes/matstallen.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/matrundan/AddPlaceDialog.tsx \
            src/components/matrundan/AddPlaceDialogImpl.tsx \
            src/components/matrundan/PlaceMap.tsx \
            src/lib/matrundan/demo-data.ts \
            src/lib/matrundan/places-provider.ts \
            src/routes/matstallen.tsx
          git commit -m "Format package 4A sources"
          git push

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Lint changed source files
        run: >-
          bunx eslint
          src/components/matrundan/AddPlaceDialog.tsx
          src/components/matrundan/AddPlaceDialogImpl.tsx
          src/components/matrundan/PlaceMap.tsx
          src/lib/matrundan/demo-data.ts
          src/lib/matrundan/places-provider.ts
          src/routes/matstallen.tsx

      - name: Production build
        run: bun run build
