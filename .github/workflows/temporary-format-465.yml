name: Temporary formatting diff for Issue 465
on:
  push:
    branches: [feature/465-robust-place-search]
    paths:
      - .github/workflows/temporary-format-465.yml

permissions:
  contents: read

jobs:
  formatting-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
      - uses: ./.github/actions/setup-ci
      - name: Print Prettier corrections without changing the branch
        shell: bash
        run: |
          bunx prettier --write src/lib/matrundan/geoapify-name-search-adapter.test.ts tests/e2e/issue-389-canonical-place-discovery.spec.ts
          git diff -- src/lib/matrundan/geoapify-name-search-adapter.test.ts tests/e2e/issue-389-canonical-place-discovery.spec.ts
