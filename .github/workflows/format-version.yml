name: Format version file

on:
  push:
    branches:
      - fix/v1.5-sharing-repair

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: fix/v1.5-sharing-repair

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and commit
        shell: bash
        run: |
          bunx prettier --write src/lib/matrundan/version.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/matrundan/version.ts
          git commit -m "Format v1.5 release notes"
          git push origin HEAD:fix/v1.5-sharing-repair
