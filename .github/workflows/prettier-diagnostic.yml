name: Prettier diagnostic

on:
  push:
    branches:
      - agent/issue-207-cloudflare-staging-bootstrap

jobs:
  prettier:
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Normalize checkout
        run: |
          git config core.autocrlf false
          sed -i 's/\r$//' src/lib/matrundan/session.tsx

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          bunx prettier src/lib/matrundan/session.tsx --write
          echo '--- PRETTIER DIFF START ---'
          git diff -- src/lib/matrundan/session.tsx
          echo '--- PRETTIER DIFF END ---'
