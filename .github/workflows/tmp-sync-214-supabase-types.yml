name: Temporary sync Supabase types for #214

on:
  push:
    branches:
      - feat/214-confirm-cross-group-participation
    paths:
      - '.github/workflows/tmp-sync-214-supabase-types.yml'

permissions:
  actions: read
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/214-confirm-cross-group-participation
          fetch-depth: 0
          show-progress: false

      - name: Download generated type artifact
        uses: actions/download-artifact@v7
        with:
          name: supabase-types-pr-306
          path: .tmp-supabase-types
          github-token: ${{ github.token }}
          run-id: 34367860115

      - name: Verify and sync generated types
        run: |
          echo 'c3b6c4207bbd24723d357294a6d15d5062451706c91d9734d2268f71695a5abb  .tmp-supabase-types/supabase-types.generated.ts' | sha256sum -c -
          cp .tmp-supabase-types/supabase-types.generated.ts src/integrations/supabase/types.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/integrations/supabase/types.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Sync generated Supabase types for #214'
          git push origin HEAD:feat/214-confirm-cross-group-participation
