name: Temporary #214 precise-model correction

on:
  push:
    branches:
      - feat/214-confirm-cross-group-participation

permissions:
  contents: write

jobs:
  correct:
    if: github.event.head_commit.message == 'Förbered precis gästkoppling för #214'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply precise guest-member model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Restore the precise client surface: specific guest -> specific member only.
          import subprocess
          precise_client = subprocess.check_output([
              'git', 'show',
              '31fbbbafb06f2c1429a6fd2291917f0886e8567e:src/lib/matrundan/live-visit-guest-members.ts'
          ], text=True)
          (root / 'src/lib/matrundan/live-visit-guest-members.ts').write_text(precise_client)

          # Remove recipient-group generic UI while keeping demo of a received precise proposal.
          path = root / 'src/components/matrundan/VisitDetailSheet.tsx'
          text = path.read_text()
          text = text.replace(
              'import { MapPin, Share2, Trash2, UserRoundCheck, UserRoundPlus, Users2 } from "lucide-react";',
              'import { MapPin, Share2, Trash2, UserRoundCheck, Users2 } from "lucide-react";'
          )
          text = text.replace('import { SharedVisitMemberProposalDialog } from "./SharedVisitMemberProposalDialog";\n', '')
          text = text.replace(
              '  const canSuggestSharedParticipantBase =\n'
              '    !groupArchived && !!visit && isShared && hasExternalParticipants && (isLive || isDemo);\n',
              ''
          )
          text = re.sub(
              r'  const demoSharedCandidates = React\.useMemo\(.*?\n  \);\n(?=\n  const \[shareOpen)',
              '', text, flags=re.S
          )
          text = text.replace('  const [sharedProposalOpen, setSharedProposalOpen] = React.useState(false);\n', '')
          text = re.sub(
              r'  const \[ownGuestProposalState, setOwnGuestProposalState\] = React\.useState<.*?\n  >\("loading"\);\n',
              '', text, flags=re.S
          )
          text = re.sub(
              r'\n  React\.useEffect\(\(\) => \{\n    setOwnGuestProposalState\(.*?\n  const canSuggestSharedParticipant =\n    canSuggestSharedParticipantBase && ownGuestProposalState === "none";\n',
              '', text, flags=re.S
          )
          text = re.sub(
              r'\n                  \{canSuggestSharedParticipant \? \(.*?\n                  \) : null\}',
              '', text, flags=re.S
          )
          text = text.replace('                    onProposalStateChange={setOwnGuestProposalState}\n', '')
          text = re.sub(
              r'\n      \{canSuggestSharedParticipant \? \(\n        <SharedVisitMemberProposalDialog.*?\n      \) : null\}\n',
              '\n', text, flags=re.S
          )
          for forbidden in ['SharedVisitMemberProposalDialog', 'canSuggestSharedParticipant', 'sharedProposalOpen', 'UserRoundPlus']:
              assert forbidden not in text, forbidden
          assert 'demoPending={isDemo && isShared && !isParticipant && hasExternalParticipants}' in text
          assert 'Koppla gäst till medlem' in text
          path.write_text(text)

          # Remove the generic recipient/self UI component and self-confirm contract test.
          for filename in [
              'src/components/matrundan/SharedVisitMemberProposalDialog.tsx',
              'src/lib/matrundan/visit-guest-member-self-confirmation-db-contract.test.ts',
          ]:
              p = root / filename
              if p.exists():
                  p.unlink()

          # Keep only the valuable registration->sharing->precise-link browser coverage.
          old = root / 'tests/e2e/issue-214-symmetric-participation.spec.ts'
          text = old.read_text()
          start = text.index('async function mockRecipient(')
          loop = text.index('for (const viewport of VIEWPORTS) {', start)
          text = text[:start] + text[loop:]
          marker = '  test(`mottagargruppen kan föreslå egen medlem utan privat gästdata'
          cut = text.index(marker)
          text = text[:cut] + '}\n'
          new = root / 'tests/e2e/issue-214-registration-linking.spec.ts'
          new.write_text(text)
          old.unlink()

          # Example group: emulate a received precise proposal, never a self-claim.
          path = root / 'tests/e2e/issue-214-example-participation.spec.ts'
          text = path.read_text()
          text = text.replace(
              'test("exempelgruppen bevarar svar och låter medlemmen lägga till sig själv",',
              'test("exempelgruppen bevarar svar på ett mottaget deltagandeförslag",'
          )
          text = text.replace(
              '  const addParticipantButton = visitDialog.getByRole("button", { name: "Lägg till deltagare" });\n'
              '  await expect(addParticipantButton).toBeVisible();\n',
              '  await expect(visitDialog.getByRole("button", { name: "Lägg till deltagare" })).toHaveCount(0);\n'
          )
          text = text.replace(
              '  await expect(visitDialog.getByRole("button", { name: "Lägg till deltagare" })).toBeVisible();\n',
              '  await expect(visitDialog.getByRole("button", { name: "Lägg till deltagare" })).toHaveCount(0);\n'
          )
          block_start = text.index('  await visitDialog.getByRole("button", { name: "Lägg till deltagare" }).click();')
          block_end = text.index('  await page.goto("/exempel");', block_start)
          text = text[:block_start] + text[block_end:]
          assert 'Ja, lägg till mig' not in text
          path.write_text(text)

          # Visual review: source precise mapping + recipient's neutral confirmation only.
          path = root / 'tests/visual-review/issue-214-participation.spec.ts'
          text = path.read_text()
          marker = 'test("fånga exempelgruppens egen deltagandefråga och deltagarval"'
          cut = text.index(marker)
          replacement = '''test("fånga exempelgruppens mottagna deltagandefråga", async ({ page }, testInfo) => {
            await page.emulateMedia({ colorScheme: "light", reducedMotion: "reduce" });
            await page.goto("/exempel", { waitUntil: "domcontentloaded" });
            await expect(page.getByText("Exempelgrupp · Stockholm", { exact: true })).toBeVisible();
            await page.getByRole("button", { name: "Återställ" }).click();
            await expect(page.getByText("Exempelgruppen är återställd.", { exact: true })).toBeVisible();

            await page.goto("/matstallen/p9?visit=v9", { waitUntil: "domcontentloaded" });
            const visitDialog = page.getByRole("dialog").first();
            const prompt = visitDialog.getByLabel("Bekräfta deltagande");
            await expect(prompt).toBeVisible();
            await expect(visitDialog.getByRole("button", { name: "Lägg till deltagare" })).toHaveCount(0);
            await stabilize(page);
            await capture(page, testInfo, "issue-214-bekrafta-deltagande");
          });
          '''
          path.write_text(text[:cut] + replacement)

          # New forward-only correction migration. Historical staging migrations remain immutable.
          migration = root / 'supabase/migrations/20260910165000_visit_guest_member_precise_link_only_v1.sql'
          migration.write_text(r'''BEGIN;

-- Issue #214 — slutlig modell: en specifik gäst kopplas till en specifik medlem.
--
-- De tillfälliga mottagargrupps-/självvägarna kunde inte veta vilken registrerad
-- gäst en medlem motsvarade. De tas därför bort framåtriktat. Gästnamn stannar i
-- originalgruppen; den utpekade medlemmen får bara en neutral bekräftelsefråga.

DO $guard$
BEGIN
  IF EXISTS (
    SELECT 1
    FROM public.visit_guest_member_proposals proposal
    JOIN public.reviews review
      ON review.visit_id = proposal.visit_id
     AND review.user_id = proposal.target_user_id
    WHERE proposal.proposal_kind = 'shared_member'
      AND proposal.status = 'accepted'
  ) THEN
    RAISE EXCEPTION 'Kan inte återställa generell deltagarkoppling med efterföljande omdöme';
  END IF;
END;
$guard$;

UPDATE public.visit_participation_self_corrections correction
SET status = 'declined',
    updated_at = now()
WHERE correction.status = 'restored'
  AND EXISTS (
    SELECT 1
    FROM public.visit_guest_member_proposals proposal
    WHERE proposal.visit_id = correction.visit_id
      AND proposal.target_user_id = correction.user_id
      AND proposal.proposal_kind = 'shared_member'
      AND proposal.status = 'accepted'
      AND NOT EXISTS (
        SELECT 1
        FROM public.visit_guest_member_proposals precise
        WHERE precise.visit_id = proposal.visit_id
          AND precise.target_user_id = proposal.target_user_id
          AND precise.proposal_kind = 'guest_link'
          AND precise.status = 'accepted'
      )
  );

DELETE FROM public.visit_participants participant
WHERE EXISTS (
  SELECT 1
  FROM public.visit_guest_member_proposals proposal
  WHERE proposal.visit_id = participant.visit_id
    AND proposal.target_user_id = participant.user_id
    AND proposal.proposal_kind = 'shared_member'
    AND proposal.status = 'accepted'
    AND NOT EXISTS (
      SELECT 1
      FROM public.visit_guest_member_proposals precise
      WHERE precise.visit_id = proposal.visit_id
        AND precise.target_user_id = proposal.target_user_id
        AND precise.proposal_kind = 'guest_link'
        AND precise.status = 'accepted'
    )
);

DELETE FROM public.visit_guest_member_proposals
WHERE proposal_kind = 'shared_member';

DROP FUNCTION IF EXISTS public.confirm_shared_visit_self_v1(uuid, uuid);
DROP FUNCTION IF EXISTS public.propose_shared_visit_member_v1(uuid, uuid, uuid);
DROP FUNCTION IF EXISTS public.list_visit_shared_member_candidates_v1(uuid, uuid);

ALTER TABLE public.visit_guest_member_proposals
  DROP CONSTRAINT IF EXISTS visit_guest_member_proposals_kind_guest_check;
ALTER TABLE public.visit_guest_member_proposals
  ALTER COLUMN guest_id SET NOT NULL;
ALTER TABLE public.visit_guest_member_proposals
  ADD CONSTRAINT visit_guest_member_proposals_kind_guest_check
  CHECK (proposal_kind = 'guest_link' AND guest_id IS NOT NULL);

DO $assertions$
BEGIN
  IF EXISTS (
    SELECT 1 FROM public.visit_guest_member_proposals WHERE proposal_kind <> 'guest_link'
  ) THEN
    RAISE EXCEPTION 'Endast precisa gästkopplingar får finnas kvar';
  END IF;
  IF to_regprocedure('public.confirm_shared_visit_self_v1(uuid,uuid)') IS NOT NULL
     OR to_regprocedure('public.propose_shared_visit_member_v1(uuid,uuid,uuid)') IS NOT NULL
     OR to_regprocedure('public.list_visit_shared_member_candidates_v1(uuid,uuid)') IS NOT NULL THEN
    RAISE EXCEPTION 'Generella mottagar-RPC:er får inte finnas kvar';
  END IF;
  IF to_regprocedure('public.propose_visit_guest_member_v1(uuid,uuid,uuid,uuid,uuid)') IS NULL
     OR to_regprocedure('public.respond_visit_guest_proposal_v1(uuid,uuid,text)') IS NULL THEN
    RAISE EXCEPTION 'Den precisa gästkopplingsvägen saknas';
  END IF;
  IF EXISTS (
    SELECT 1
    FROM information_schema.columns
    WHERE table_schema = 'public'
      AND table_name = 'visit_guest_member_proposals'
      AND column_name = 'guest_id'
      AND is_nullable <> 'NO'
  ) THEN
    RAISE EXCEPTION 'guest_id måste vara obligatoriskt i slutmodellen';
  END IF;
  IF position('link_type = ''original''' IN pg_get_functiondef(
    to_regprocedure('public.validate_visit_participant()')
  )) > 0 THEN
    RAISE EXCEPTION 'Bekräftad målmedlem får inte åter blockeras av originalgruppstvång';
  END IF;
END;
$assertions$;

NOTIFY pgrst, 'reload schema';

COMMIT;
''')

          # Final database contract: preserve linked-group participant guard and enforce precise-only surface.
          (root / 'src/lib/matrundan/visit-guest-member-followup-db-contract.test.ts').write_text(r'''import { describe, expect, test } from "bun:test";

const followup = await Bun.file(
  "supabase/migrations/20260909070000_visit_guest_member_confirmation_followup_v1.sql",
).text();
const correction = await Bun.file(
  "supabase/migrations/20260910165000_visit_guest_member_precise_link_only_v1.sql",
).text();
const preflight = await Bun.file("supabase/production-preflight-visit-guest-member.sql").text();

describe("slutligt databaskontrakt för Issue #214", () => {
  test("deltagarvakten accepterar medlemskap i en länkad grupp utan originalgruppstvång", () => {
    const start = followup.indexOf("CREATE OR REPLACE FUNCTION public.validate_visit_participant()");
    const end = followup.indexOf("ALTER TABLE public.visit_guest_member_proposals", start);
    const body = followup.slice(start, end);

    expect(body).toContain("FROM public.visit_group_links link");
    expect(body).toContain("JOIN public.memberships membership");
    expect(body).toContain("membership.user_id = NEW.user_id");
    expect(body).toContain("membership.status = 'active'");
    expect(body).not.toContain("link_type = 'original'");
  });

  test("slutmodellen tar bort generella mottagar- och självvägar", () => {
    expect(correction).toContain("DROP FUNCTION IF EXISTS public.confirm_shared_visit_self_v1");
    expect(correction).toContain("DROP FUNCTION IF EXISTS public.propose_shared_visit_member_v1");
    expect(correction).toContain("DROP FUNCTION IF EXISTS public.list_visit_shared_member_candidates_v1");
    expect(correction).toContain("DELETE FROM public.visit_guest_member_proposals");
    expect(correction).toContain("WHERE proposal_kind = 'shared_member'");
  });

  test("varje kvarvarande identitetsförslag måste peka på en specifik gäst", () => {
    expect(correction).toContain("ALTER COLUMN guest_id SET NOT NULL");
    expect(correction).toContain("proposal_kind = 'guest_link' AND guest_id IS NOT NULL");
  });

  test("stagingdata återställs säkert innan den felaktiga modellen tas bort", () => {
    expect(correction).toContain("JOIN public.reviews review");
    expect(correction).toContain("RAISE EXCEPTION 'Kan inte återställa generell deltagarkoppling med efterföljande omdöme'");
    expect(correction).toContain("DELETE FROM public.visit_participants participant");
    expect(correction).toContain("public.visit_participation_self_corrections correction");
    expect(correction).toContain("precise.proposal_kind = 'guest_link'");
  });

  test("slutpreflight verifierar bara den precisa publika ytan", () => {
    expect(preflight).toContain("rpc:generic-recipient-paths-removed");
    expect(preflight).toContain("schema:guest-id-required");
    expect(preflight).toContain("schema:guest-link-only");
    expect(preflight).toContain("guard:targets-original-group-only");
    expect(preflight).toContain("guard:participant-linked-group-membership");
    expect(preflight).toContain("guard:response-owned-by-target-user");
  });
});
''')

          # Final production/staging preflight for the precise-only contract.
          (root / 'supabase/production-preflight-visit-guest-member.sql').write_text(r'''-- Produktions-preflight för Issue #214 — precis gäst → medlem-koppling.
-- Körs skrivskyddat efter migration och före publicering. Alla rader ska ge ok=true.

WITH checks(name, ok) AS (
  VALUES
    ('table:visit_guest_member_proposals',
      to_regclass('public.visit_guest_member_proposals') IS NOT NULL),
    ('rls:visit_guest_member_proposals',
      COALESCE((SELECT c.relrowsecurity FROM pg_class c
                WHERE c.oid = to_regclass('public.visit_guest_member_proposals')), false)),
    ('schema:guest-id-required',
      COALESCE((SELECT c.is_nullable = 'NO' FROM information_schema.columns c
                WHERE c.table_schema = 'public'
                  AND c.table_name = 'visit_guest_member_proposals'
                  AND c.column_name = 'guest_id'), false)),
    ('schema:guest-link-only',
      COALESCE((SELECT position('proposal_kind = ''guest_link''' IN pg_get_constraintdef(con.oid)) > 0
                FROM pg_constraint con
                WHERE con.conrelid = 'public.visit_guest_member_proposals'::regclass
                  AND con.conname = 'visit_guest_member_proposals_kind_guest_check'), false)
      AND NOT EXISTS (
        SELECT 1 FROM public.visit_guest_member_proposals WHERE proposal_kind <> 'guest_link'
      )),
    ('rpc:list-targets',
      to_regprocedure('public.list_visit_guest_member_targets_v1(uuid,uuid)') IS NOT NULL),
    ('rpc:propose-guest',
      to_regprocedure('public.propose_visit_guest_member_v1(uuid,uuid,uuid,uuid,uuid)') IS NOT NULL),
    ('rpc:get-own-proposal',
      to_regprocedure('public.get_own_visit_guest_proposal_v1(uuid,uuid)') IS NOT NULL),
    ('rpc:respond',
      to_regprocedure('public.respond_visit_guest_proposal_v1(uuid,uuid,text)') IS NOT NULL),
    ('rpc:generic-recipient-paths-removed',
      to_regprocedure('public.list_visit_shared_member_candidates_v1(uuid,uuid)') IS NULL
      AND to_regprocedure('public.propose_shared_visit_member_v1(uuid,uuid,uuid)') IS NULL
      AND to_regprocedure('public.confirm_shared_visit_self_v1(uuid,uuid)') IS NULL),
    ('read-rpc:current-v5k',
      to_regprocedure('public.get_group_app_state_v5k(uuid)') IS NOT NULL),
    ('read-rpc:server-only-base',
      to_regprocedure('public.get_group_app_state_v5k_guest_identity_base(uuid)') IS NOT NULL),
    ('guard:targets-original-group-only',
      COALESCE(position('link_type = ''original''' IN pg_get_functiondef(
        to_regprocedure('public.list_visit_guest_member_targets_v1(uuid,uuid)')
      )) > 0, false)),
    ('guard:targets-require-linked-target',
      COALESCE(position('visit_group_links target_link' IN pg_get_functiondef(
        to_regprocedure('public.list_visit_guest_member_targets_v1(uuid,uuid)')
      )) > 0
      AND position('actor_membership.status = ''active''' IN pg_get_functiondef(
        to_regprocedure('public.list_visit_guest_member_targets_v1(uuid,uuid)')
      )) > 0, false)),
    ('guard:participant-linked-group-membership',
      COALESCE(position('JOIN public.memberships membership' IN pg_get_functiondef(
        to_regprocedure('public.validate_visit_participant()')
      )) > 0
      AND position('membership.status = ''active''' IN pg_get_functiondef(
        to_regprocedure('public.validate_visit_participant()')
      )) > 0
      AND position('link_type = ''original''' IN pg_get_functiondef(
        to_regprocedure('public.validate_visit_participant()')
      )) = 0, false)),
    ('guard:response-owned-by-target-user',
      COALESCE(position('proposal.target_user_id = _uid' IN pg_get_functiondef(
        to_regprocedure('public.respond_visit_guest_proposal_v1(uuid,uuid,text)')
      )) > 0, false)),
    ('guard:accept-writes-canonical-participation',
      COALESCE(position('INSERT INTO public.visit_participants' IN pg_get_functiondef(
        to_regprocedure('public.respond_visit_guest_proposal_v1(uuid,uuid,text)')
      )) > 0
      AND position('VALUES (_proposal.visit_id, _uid)' IN pg_get_functiondef(
        to_regprocedure('public.respond_visit_guest_proposal_v1(uuid,uuid,text)')
      )) > 0, false)),
    ('guard:own-proposal-minimized',
      COALESCE(position('proposalId' IN pg_get_functiondef(
        to_regprocedure('public.get_own_visit_guest_proposal_v1(uuid,uuid)')
      )) > 0
      AND position('guestName' IN pg_get_functiondef(
        to_regprocedure('public.get_own_visit_guest_proposal_v1(uuid,uuid)')
      )) = 0
      AND position('proposedBy' IN pg_get_functiondef(
        to_regprocedure('public.get_own_visit_guest_proposal_v1(uuid,uuid)')
      )) = 0, false)),
    ('read-rpc:deduplicates-visible-accepted-person',
      COALESCE(position('accepted_visible_count' IN pg_get_functiondef(
        to_regprocedure('public.get_group_app_state_v5k(uuid)')
      )) > 0
      AND position('external_count - visit_row.accepted_visible_count' IN pg_get_functiondef(
        to_regprocedure('public.get_group_app_state_v5k(uuid)')
      )) > 0, false)),
    ('grant:authenticated-rpcs',
      has_function_privilege('authenticated', 'public.list_visit_guest_member_targets_v1(uuid,uuid)', 'EXECUTE')
      AND has_function_privilege('authenticated', 'public.propose_visit_guest_member_v1(uuid,uuid,uuid,uuid,uuid)', 'EXECUTE')
      AND has_function_privilege('authenticated', 'public.get_own_visit_guest_proposal_v1(uuid,uuid)', 'EXECUTE')
      AND has_function_privilege('authenticated', 'public.respond_visit_guest_proposal_v1(uuid,uuid,text)', 'EXECUTE')),
    ('isolation:no-anon-rpcs',
      NOT has_function_privilege('anon', 'public.list_visit_guest_member_targets_v1(uuid,uuid)', 'EXECUTE')
      AND NOT has_function_privilege('anon', 'public.propose_visit_guest_member_v1(uuid,uuid,uuid,uuid,uuid)', 'EXECUTE')
      AND NOT has_function_privilege('anon', 'public.get_own_visit_guest_proposal_v1(uuid,uuid)', 'EXECUTE')
      AND NOT has_function_privilege('anon', 'public.respond_visit_guest_proposal_v1(uuid,uuid,text)', 'EXECUTE')),
    ('isolation:no-authenticated-table-read',
      NOT has_table_privilege('authenticated', 'public.visit_guest_member_proposals', 'SELECT')),
    ('isolation:no-authenticated-table-write',
      NOT has_table_privilege('authenticated', 'public.visit_guest_member_proposals', 'INSERT')),
    ('isolation:no-client-v5k-base',
      NOT has_function_privilege('authenticated', 'public.get_group_app_state_v5k_guest_identity_base(uuid)', 'EXECUTE')
      AND NOT has_function_privilege('anon', 'public.get_group_app_state_v5k_guest_identity_base(uuid)', 'EXECUTE'))
)
SELECT name, ok
FROM checks
ORDER BY name;
''')

          # Release copy describes the final, precise model only.
