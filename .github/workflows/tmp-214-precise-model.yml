      ],
    },
  ],
};

'''
          path.write_text(text[:start] + block + text[end:])

          # Remove this one-off workflow from the resulting product commit.
          (root / '.github/workflows/tmp-214-precise-model.yml').unlink()
          PY

          bun install --frozen-lockfile
