          text = path.read_text()
          start = text.index('const VERSION_1_38_11_CHANGELOG')
          end = text.index('const VERSION_1_38_10_CHANGELOG', start)
          block = '''const VERSION_1_38_11_CHANGELOG: ChangelogEntry = {
