name: Format diagnostics

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          while IFS= read -r -d '' file; do
            sed -i 's/\r$//' "$file"
          done < <(git ls-files -z -- '*.ts' '*.tsx')

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print Prettier patch
        run: |
          bunx prettier --write \
            src/components/matrundan/SearchResultSectionsV16.tsx \
            src/lib/matrundan/geoapify-boundaries.functions.ts \
            src/lib/matrundan/geoapify-boundary-selection.test.ts \
            src/lib/matrundan/geoapify-boundary-selection.ts \
            src/lib/matrundan/geoapify.functions.ts \
            src/lib/matrundan/search-area-boundaries.test.ts
          echo '--- PRETTIER PATCH START ---'
          git diff --no-ext-diff -- \
            src/components/matrundan/SearchResultSectionsV16.tsx \
            src/lib/matrundan/geoapify-boundaries.functions.ts \
            src/lib/matrundan/geoapify-boundary-selection.test.ts \
            src/lib/matrundan/geoapify-boundary-selection.ts \
            src/lib/matrundan/geoapify.functions.ts \
            src/lib/matrundan/search-area-boundaries.test.ts
          echo '--- PRETTIER PATCH END ---'
