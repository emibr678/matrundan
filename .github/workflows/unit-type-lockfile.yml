name: Generate unit type lockfile

on:
  push:
    branches:
      - agent/unit-test-typecheck

permissions:
  contents: write

concurrency:
  group: unit-type-lockfile
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/unit-test-typecheck
          fetch-depth: 0

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2

      - name: Install current dependencies
        run: bun install --frozen-lockfile

      - name: Add official Bun types
        run: bun add --dev @types/bun@1.3.14

      - name: Commit generated manifest and lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "Manifest and lockfile are already current."
            exit 0
          fi
          git commit -m "Lägg till officiella Bun-typer"
          git push origin HEAD:agent/unit-test-typecheck
