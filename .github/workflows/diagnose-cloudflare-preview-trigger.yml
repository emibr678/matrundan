name: Diagnose Cloudflare termination globally

on:
  push:
    branches:
      - diagnostic/cloudflare-preview-trigger

permissions:
  contents: read

concurrency:
  group: diagnose-cloudflare-termination-global
  cancel-in-progress: true

jobs:
  diagnose:
    name: Compare all nearby staging builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      CLOUDFLARE_BUILD_UUID: 53646e86-817e-4c78-8a4c-5b296a5706e0

    steps:
      - name: List all nearby builds read-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          const token = process.env.CLOUDFLARE_BUILDS_API_TOKEN?.trim();
          const buildUuid = process.env.CLOUDFLARE_BUILD_UUID?.trim();

          async function get(path) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}${path}`,
              { headers: { Authorization: `Bearer ${token}`, Accept: "application/json" } },
            );
            const payload = await response.json();
            if (!response.ok || payload?.success === false) {
              throw new Error(`Cloudflare GET failed HTTP ${response.status}`);
            }
            return payload?.result;
          }

          const target = await get(`/builds/builds/${buildUuid}`);
          const worker = target?.trigger?.external_script_id;
          if (!worker) throw new Error("Missing worker id");
          const targetTime = Date.parse(target?.created_on ?? "");

          const list = await get(`/builds/workers/${worker}/builds`);
          const builds = (Array.isArray(list) ? list : [])
            .filter((b) => {
              const t = Date.parse(b?.created_on ?? "");
              return Number.isFinite(t) && Math.abs(t - targetTime) <= 10 * 60_000;
            })
            .map((b) => ({
              build_uuid: b?.build_uuid,
              branch: b?.build_trigger_metadata?.branch,
              commit_hash: b?.build_trigger_metadata?.commit_hash,
              source: b?.build_trigger_metadata?.build_trigger_source,
              status: b?.status,
              outcome: b?.build_outcome,
              created_on: b?.created_on,
              stopped_on: b?.stopped_on,
              modified_on: b?.modified_on,
            }))
            .sort((a,b) => String(a.created_on).localeCompare(String(b.created_on)));

          console.log(JSON.stringify(builds, null, 2));
          NODE
