name: Diagnose Cloudflare termination

on:
  push:
    branches:
      - diagnostic/cloudflare-preview-trigger

permissions:
  contents: read

concurrency:
  group: diagnose-cloudflare-termination
  cancel-in-progress: true

jobs:
  diagnose:
    name: Compare nearby Cloudflare builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      CLOUDFLARE_BUILD_UUID: 53646e86-817e-4c78-8a4c-5b296a5706e0
      EXPECTED_SHA: 24628db4c325f1f54d83696e59e5e2f407394660

    steps:
      - name: Inspect exact build and nearby builds read-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          const token = process.env.CLOUDFLARE_BUILDS_API_TOKEN?.trim();
          const buildUuid = process.env.CLOUDFLARE_BUILD_UUID?.trim();
          const expectedSha = process.env.EXPECTED_SHA?.trim();

          async function get(path) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}${path}`,
              { headers: { Authorization: `Bearer ${token}`, Accept: "application/json" } },
            );
            const payload = await response.json();
            if (!response.ok || payload?.success === false) {
              const msg = (payload?.errors ?? []).map((e) => e?.message ?? e?.code).join("; ");
              throw new Error(`Cloudflare GET failed (HTTP ${response.status})${msg ? `: ${msg}` : ""}`);
            }
            return payload?.result;
          }

          const build = await get(`/builds/builds/${buildUuid}`);
          const metadata = build?.build_trigger_metadata ?? {};
          const trigger = build?.trigger ?? {};
          const externalScriptId = trigger?.external_script_id;

          console.log("EXACT_BUILD");
          console.log(JSON.stringify({
            build_uuid: build?.build_uuid,
            status: build?.status,
            build_outcome: build?.build_outcome,
            created_on: build?.created_on,
            initializing_on: build?.initializing_on,
            running_on: build?.running_on,
            stopped_on: build?.stopped_on,
            modified_on: build?.modified_on,
            preview_url: build?.preview_url,
            branch: metadata?.branch,
            commit_hash: metadata?.commit_hash,
            trigger_uuid: trigger?.trigger_uuid,
            external_script_id: externalScriptId ?? null,
          }, null, 2));

          if (metadata?.commit_hash !== expectedSha) throw new Error("Unexpected SHA.");
          if (!externalScriptId) throw new Error("Missing external_script_id.");

          const list = await get(`/builds/workers/${externalScriptId}/builds`);
          const builds = Array.isArray(list) ? list : [];
          const nearby = builds
            .filter((b) => {
              const branch = b?.build_trigger_metadata?.branch;
              const created = Date.parse(b?.created_on ?? "");
              const target = Date.parse(build?.created_on ?? "");
              return branch === metadata?.branch && Number.isFinite(created) && Math.abs(created - target) <= 15 * 60_000;
            })
            .map((b) => ({
              build_uuid: b?.build_uuid,
              status: b?.status,
              build_outcome: b?.build_outcome,
              created_on: b?.created_on,
              stopped_on: b?.stopped_on,
              modified_on: b?.modified_on,
              commit_hash: b?.build_trigger_metadata?.commit_hash,
              source: b?.build_trigger_metadata?.build_trigger_source,
            }))
            .sort((a,b) => String(a.created_on).localeCompare(String(b.created_on)));

          console.log("NEARBY_SAME_BRANCH_BUILDS");
          console.log(JSON.stringify(nearby, null, 2));

          const logs = await get(`/builds/builds/${buildUuid}/logs`);
          const raw = Array.isArray(logs?.lines) ? logs.lines : [];
          const tail = raw.slice(-25).map((entry) => ({
            ts: Array.isArray(entry) ? entry[0] : null,
            line: Array.isArray(entry) ? String(entry.at(-1) ?? "") : String(entry ?? ""),
          }));
          console.log("FINAL_LOG_LINES_WITH_TIMESTAMPS");
          console.log(JSON.stringify(tail, null, 2));
          NODE
