name: Verify repaired Cloudflare preview

on:
  push:
    branches:
      - diagnostic/cloudflare-preview-trigger

permissions:
  contents: read

concurrency:
  group: verify-cloudflare-preview-trigger
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repaired preview build
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      CLOUDFLARE_BUILD_UUID: 7372996d-950b-4f2f-b212-29eb5f4722c1
      EXPECTED_TRIGGER_UUID: 9d42b7f3-f017-48f4-ac3b-4612535d53b6
      TARGET_BRANCH: feature/389-canonical-place-discovery
      TARGET_SHA: 5722f6c9f8696a850e10e5f92a7c443fa954c19f

    steps:
      - name: Poll exact rebuilt preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          const token = process.env.CLOUDFLARE_BUILDS_API_TOKEN?.trim();
          const buildUuid = process.env.CLOUDFLARE_BUILD_UUID?.trim();
          const expectedTriggerUuid = process.env.EXPECTED_TRIGGER_UUID?.trim();
          const targetBranch = process.env.TARGET_BRANCH?.trim();
          const targetSha = process.env.TARGET_SHA?.trim();

          if (!accountId || !token || !buildUuid || !expectedTriggerUuid || !targetBranch || !targetSha) {
            throw new Error("Missing Cloudflare preview verification configuration.");
          }

          async function getBuild() {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}/builds/builds/${buildUuid}`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/json",
                },
              },
            );
            const payload = await response.json();
            if (!response.ok || payload?.success === false) {
              throw new Error(`Cloudflare build read failed (HTTP ${response.status}).`);
            }
            return payload?.result;
          }

          let build;
          for (let attempt = 1; attempt <= 45; attempt++) {
            build = await getBuild();
            console.log(`Cloudflare build status attempt ${attempt}: ${build?.status ?? "unknown"} / ${build?.build_outcome ?? "pending"}`);
            if (build?.status === "stopped") break;
            await new Promise((resolve) => setTimeout(resolve, 4000));
          }

          if (build?.status !== "stopped") {
            throw new Error("Cloudflare preview build did not finish within verification window.");
          }

          const metadata = build?.build_trigger_metadata ?? {};
          const trigger = build?.trigger ?? {};
          const variableNames = Object.keys(metadata?.environment_variables ?? {}).sort();
          const expectedVariableNames = [
            "VITE_GEOAPIFY_MAPS_KEY",
            "VITE_SUPABASE_PROJECT_ID",
            "VITE_SUPABASE_PUBLISHABLE_KEY",
            "VITE_SUPABASE_URL",
          ].sort();

          if (build?.build_outcome !== "success") {
            throw new Error(`Cloudflare preview build failed with outcome ${build?.build_outcome ?? "unknown"}.`);
          }
          if (metadata?.branch !== targetBranch || metadata?.commit_hash !== targetSha) {
            throw new Error("Cloudflare preview build does not match the exact PR branch/SHA.");
          }
          if (metadata?.build_command !== "bun run cloudflare:build") {
            throw new Error(`Unexpected build command: ${metadata?.build_command ?? "missing"}.`);
          }
          if (metadata?.deploy_command !== "npx wrangler versions upload --env staging") {
            throw new Error("Unexpected preview deploy command.");
          }
          if (trigger?.trigger_uuid !== expectedTriggerUuid) {
            throw new Error("Preview build used an unexpected Cloudflare trigger.");
          }
          if (JSON.stringify(variableNames) !== JSON.stringify(expectedVariableNames)) {
            throw new Error(`Unexpected build-variable names: ${variableNames.join(", ")}.`);
          }

          const previewUrl = build?.preview_url;
          if (!previewUrl || !/^https:\/\/[a-z0-9-]+-staging\.matrundan\.workers\.dev\/?$/i.test(previewUrl)) {
            throw new Error(`Cloudflare did not expose an expected staging preview URL: ${previewUrl ?? "missing"}.`);
          }

          const healthResponse = await fetch(new URL("/api/health", previewUrl));
          if (!healthResponse.ok) {
            throw new Error(`Preview health endpoint failed (HTTP ${healthResponse.status}).`);
          }
          const health = await healthResponse.json();
          if (health?.release !== targetSha) {
            throw new Error(`Preview health SHA mismatch: expected ${targetSha}, got ${health?.release ?? "missing"}.`);
          }

          console.log("Verified repaired Cloudflare preview build:");
          console.log(JSON.stringify({
            build_uuid: buildUuid,
            branch: metadata.branch,
            commit_hash: metadata.commit_hash,
            build_command: metadata.build_command,
            deploy_command: metadata.deploy_command,
            build_variable_names: variableNames,
            preview_url: previewUrl,
            health_release: health.release,
          }, null, 2));

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${previewUrl}\n`);
          NODE

      - name: Check exact live map background
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/emibr678/matrundan.git repo
          cd repo
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach "$TARGET_SHA"
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun scripts/live-preview-map-smoke.mjs "$PREVIEW_URL" "$TARGET_SHA"
