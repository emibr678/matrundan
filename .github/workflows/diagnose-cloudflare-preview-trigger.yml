name: Diagnose exact Cloudflare build

on:
  push:
    branches:
      - diagnostic/cloudflare-preview-trigger

permissions:
  contents: read

concurrency:
  group: diagnose-exact-cloudflare-build
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read Cloudflare build outcome and logs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      CLOUDFLARE_BUILD_UUID: 53646e86-817e-4c78-8a4c-5b296a5706e0
      EXPECTED_SHA: 24628db4c325f1f54d83696e59e5e2f407394660

    steps:
      - name: Inspect exact build read-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          const token = process.env.CLOUDFLARE_BUILDS_API_TOKEN?.trim();
          const buildUuid = process.env.CLOUDFLARE_BUILD_UUID?.trim();
          const expectedSha = process.env.EXPECTED_SHA?.trim();

          if (!accountId || !token || !buildUuid || !expectedSha) {
            throw new Error("Missing Cloudflare diagnostic configuration.");
          }

          async function get(path) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}${path}`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/json",
                },
              },
            );
            const payload = await response.json();
            if (!response.ok || payload?.success === false) {
              const msg = (payload?.errors ?? []).map((e) => e?.message ?? e?.code).join("; ");
              throw new Error(`Cloudflare GET failed (HTTP ${response.status})${msg ? `: ${msg}` : ""}`);
            }
            return payload?.result;
          }

          const build = await get(`/builds/builds/${buildUuid}`);
          const metadata = build?.build_trigger_metadata ?? {};
          const trigger = build?.trigger ?? {};

          const summary = {
            build_uuid: build?.build_uuid ?? buildUuid,
            status: build?.status ?? null,
            build_outcome: build?.build_outcome ?? null,
            created_on: build?.created_on ?? null,
            initializing_on: build?.initializing_on ?? null,
            running_on: build?.running_on ?? null,
            stopped_on: build?.stopped_on ?? null,
            modified_on: build?.modified_on ?? null,
            preview_url: build?.preview_url ?? null,
            branch: metadata?.branch ?? null,
            commit_hash: metadata?.commit_hash ?? null,
            build_trigger_source: metadata?.build_trigger_source ?? null,
            build_command: metadata?.build_command ?? null,
            deploy_command: metadata?.deploy_command ?? null,
            environment_variable_names: Object.keys(metadata?.environment_variables ?? {}).sort(),
            trigger_uuid: trigger?.trigger_uuid ?? null,
            trigger_name: trigger?.trigger_name ?? null,
            trigger_build_command: trigger?.build_command ?? null,
            trigger_deploy_command: trigger?.deploy_command ?? null,
          };

          console.log("CLOUDFLARE_BUILD_SUMMARY");
          console.log(JSON.stringify(summary, null, 2));

          if (metadata?.commit_hash !== expectedSha) {
            throw new Error(`Build SHA mismatch: expected ${expectedSha}, got ${metadata?.commit_hash ?? "missing"}.`);
          }

          const logs = await get(`/builds/builds/${buildUuid}/logs`);
          const rawLines = Array.isArray(logs?.lines) ? logs.lines : [];
          const messages = rawLines
            .map((entry) => Array.isArray(entry) ? String(entry.at(-1) ?? "") : String(entry ?? ""))
            .filter(Boolean);

          const interesting = messages.filter((line) =>
            /error|fail|terminat|wrangler|deploy|version|build command|executing|success|upload|preview/i.test(line)
          );

          const redact = (line) =>
            line
              .replace(/(api[_-]?key|token|secret|authorization)\s*[:=]\s*\S+/gi, "$1=[REDACTED]")
              .replace(/Bearer\s+\S+/gi, "Bearer [REDACTED]");

          console.log("CLOUDFLARE_INTERESTING_LOG_LINES");
          for (const line of interesting.slice(-120)) console.log(redact(line));

          console.log("CLOUDFLARE_LOG_TAIL");
          for (const line of messages.slice(-80)) console.log(redact(line));
          NODE
