name: Recovery restore drill

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA to verify before reading backup source data
        required: true
        type: string
      source:
        description: Supabase source to back up and restore locally
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirm_production_source:
        description: Confirm read-only backup of Matrundan Prod when source=production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: recovery-restore-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  restore:
    name: Backup + local restore (${{ inputs.source }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.MATRUNDAN_RECOVERY_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 40
    environment: ${{ inputs.source }}
    env:
      CI: 'true'
      SOURCE_SUPABASE_PROJECT_ID: ${{ inputs.source == 'production' && 'wsikirbxqejjwtgxcvjl' || 'wpihfmwbubvdiaavtpia' }}
      SOURCE_SUPABASE_URL: ${{ inputs.source == 'production' && 'https://wsikirbxqejjwtgxcvjl.supabase.co' || 'https://wpihfmwbubvdiaavtpia.supabase.co' }}
      SOURCE_SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.source == 'production' && secrets.PROD_SUPABASE_SERVICE_ROLE_KEY || secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ inputs.source == 'production' && secrets.PROD_SUPABASE_DB_URL || secrets.STAGING_SUPABASE_DB_URL }}
      SUPABASE_CLI_VERSION: 2.115.0
      SUPABASE_CLI_WINDOWS_AMD64_SHA256: 76782a0316c6f368dd41c94184faec8a0a3f6ca214b76bf16615536e5ed32bfa
      POSTGRES_MAJOR: '17'
      POSTGRES_CLIENT_IMAGE: postgres:17-bookworm
      RECOVERY_MIN_FREE_KB: '10485760'

    steps:
      - name: Check out exact main recovery candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Guard source, trusted ref and exact SHA
        shell: bash
        env:
          RECOVERY_SOURCE: ${{ inputs.source }}
          CONFIRM_PRODUCTION_SOURCE: ${{ inputs.confirm_production_source }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Recovery restore drill may only run from main." >&2
            exit 1
          fi

          case "$RECOVERY_SOURCE" in
            staging)
              expected_project_id="wpihfmwbubvdiaavtpia"
              ;;
            production)
              expected_project_id="wsikirbxqejjwtgxcvjl"
              if [[ "$CONFIRM_PRODUCTION_SOURCE" != "true" ]]; then
                echo "Production recovery requires explicit confirmation of the read-only Prod backup source." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported recovery source." >&2
              exit 1
              ;;
          esac

          if [[ "$SOURCE_SUPABASE_PROJECT_ID" != "$expected_project_id" ]]; then
            echo "Recovery source project id does not match the selected environment." >&2
            exit 1
          fi
          if [[ "$SOURCE_SUPABASE_URL" != "https://${SOURCE_SUPABASE_PROJECT_ID}.supabase.co" ]]; then
            echo "Recovery source URL does not match the locked Supabase project." >&2
            exit 1
          fi

          expected_sha="${{ inputs.expected_sha }}"
          if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected SHA must be a full 40-character Git SHA." >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$expected_sha" ]]; then
            echo "Expected SHA does not match the checked-out main SHA." >&2
            echo "expected=$expected_sha" >&2
            echo "actual=$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Prepare recovery runner paths
        shell: bash
        run: |
          set -euo pipefail
          recovery_temp="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            command -v cygpath >/dev/null 2>&1 || {
              echo "Git for Windows cygpath is required on a Windows recovery runner." >&2
              exit 1
            }
            recovery_temp="$(cygpath -u "$RUNNER_TEMP")"
          fi
          echo "RECOVERY_RUNNER_TEMP=$recovery_temp" >> "$GITHUB_ENV"
          echo "Recovery runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)" >> "$GITHUB_STEP_SUMMARY"
          echo "Configured recovery target: ${{ vars.MATRUNDAN_RECOVERY_RUNNER || 'ubuntu-24.04' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up pinned Supabase CLI on non-Windows runner
        if: runner.os != 'Windows'
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Set up pinned Supabase CLI on Windows runner
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_ARCH" != "X64" ]]; then
            echo "Direct Supabase CLI setup currently supports only Windows X64." >&2
            exit 1
          fi
          command -v cygpath >/dev/null 2>&1 || {
            echo "Git for Windows cygpath is required to install Supabase CLI." >&2
            exit 1
          }
          command -v sha256sum >/dev/null 2>&1 || {
            echo "sha256sum is required to verify the Supabase CLI archive." >&2
            exit 1
          }

          install_dir="$RECOVERY_RUNNER_TEMP/supabase-cli-${SUPABASE_CLI_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="$install_dir/supabase.zip"
          mkdir -p "$install_dir"
          archive_windows="$(cygpath -w "$archive")"
          install_dir_windows="$(cygpath -w "$install_dir")"

          curl.exe --fail --location --retry 3 --silent --show-error \
            --output "$archive_windows" \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_windows_amd64.zip"

          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$SUPABASE_CLI_WINDOWS_AMD64_SHA256" ]]; then
            echo "Supabase CLI archive checksum mismatch." >&2
            exit 1
          fi

          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command \
            "Expand-Archive -LiteralPath '$archive_windows' -DestinationPath '$install_dir_windows' -Force"
          if [[ ! -f "$install_dir/supabase.exe" ]]; then
            echo "Supabase CLI executable was not found after archive extraction." >&2
            exit 1
          fi

          echo "$install_dir_windows" >> "$GITHUB_PATH"

      - name: Set up PostgreSQL 17 client on Linux recovery runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          client_bin="$RECOVERY_RUNNER_TEMP/matrundan-postgres-${POSTGRES_MAJOR}-bin"
          mkdir -p "$client_bin"

          cat > "$client_bin/psql" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --network host "${POSTGRES_CLIENT_IMAGE:-postgres:17-bookworm}" psql "$@"
          SCRIPT

          cat > "$client_bin/pg_dump" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --network host "${POSTGRES_CLIENT_IMAGE:-postgres:17-bookworm}" pg_dump "$@"
          SCRIPT

          chmod 700 "$client_bin/psql" "$client_bin/pg_dump"
          echo "$client_bin" >> "$GITHUB_PATH"

      - name: Recovery environment preflight
        shell: bash
        run: bash scripts/recovery-preflight.sh

      - name: Start and validate empty local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          eval "$(supabase status -o env)"
          : "${DB_URL:?Supabase CLI status did not expose DB_URL}"

          local_version_num="$(
            psql "$DB_URL" \
              -X \
              --no-psqlrc \
              --tuples-only \
              --no-align \
              --set ON_ERROR_STOP=1 \
              --command "show server_version_num" |
              tr -d '[:space:]'
          )"
          if [[ ! "$local_version_num" =~ ^[0-9]+$ ]]; then
            echo "Could not read the local recovery database version." >&2
            exit 1
          fi
          local_major=$((local_version_num / 10000))
          if [[ "$local_major" != "$POSTGRES_MAJOR" ]]; then
            echo "Local recovery database major version is $local_major; expected $POSTGRES_MAJOR." >&2
            exit 1
          fi

          initial_counts="$(
            psql "$DB_URL" \
              -X \
              --no-psqlrc \
              --tuples-only \
              --no-align \
              --set ON_ERROR_STOP=1 <<'SQL' |
          select
            (select count(*) from auth.users)::text || '|' ||
            (select count(*) from public.groups)::text || '|' ||
            (select count(*) from public.visit_media)::text;
          SQL
              tr -d '[:space:]'
          )"
          if [[ "$initial_counts" != "0|0|0" ]]; then
            echo "Local recovery target is not empty (auth.users|groups|visit_media=$initial_counts)." >&2
            exit 1
          fi

          echo "Local recovery target: PostgreSQL $local_major, empty schema from repo migrations." >> "$GITHUB_STEP_SUMMARY"

      - name: Create private backup generation
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="$RECOVERY_RUNNER_TEMP/matrundan-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "backup_dir=$backup_dir" >> "$GITHUB_OUTPUT"

          bash scripts/backup-supabase.sh "$backup_dir"
          bun scripts/visit-photo-backup.mjs export "$backup_dir"

          app_version="$(bun -e 'import { APP_VERSION } from "./src/lib/matrundan/version.ts"; process.stdout.write(APP_VERSION)')"
          MATRUNDAN_BACKUP_SOURCE_REF="$SOURCE_SUPABASE_PROJECT_ID" \
          MATRUNDAN_BACKUP_APP_VERSION="$app_version" \
          MATRUNDAN_BACKUP_RELEASE_SHA="$GITHUB_SHA" \
            bun scripts/backup-manifest.mjs create "$backup_dir"
          bun scripts/backup-manifest.mjs verify "$backup_dir"

      - name: Restore and verify locally
        shell: bash
        env:
          BACKUP_DIR: ${{ steps.backup.outputs.backup_dir }}
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          : "${DB_URL:?Supabase CLI status did not expose DB_URL}"
          : "${API_URL:?Supabase CLI status did not expose API_URL}"
          : "${SERVICE_ROLE_KEY:?Supabase CLI status did not expose SERVICE_ROLE_KEY}"

          export LOCAL_SUPABASE_DB_URL="$DB_URL"
          export TARGET_SUPABASE_URL="$API_URL"
          export TARGET_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          bash scripts/restore-supabase-local.sh "$BACKUP_DIR"

      - name: Summarize recovery drill
        if: success()
        shell: bash
        env:
          RECOVERY_SOURCE: ${{ inputs.source }}
        run: |
          {
            echo '## Recovery restore drill'
            echo
            echo "- Candidate SHA: \`$GITHUB_SHA\`"
            echo "- Source: \`$RECOVERY_SOURCE\` (read-only backup/export)"
            echo '- Restore target: ephemeral local Supabase/Docker stack'
            echo '- Runner preflight: Linux, Docker, PostgreSQL 17, source DB/API and disk verified'
            echo '- Database/Auth restore: verified'
            echo '- Auth schema compatibility: verified before import'
            echo '- Private visit media: byte-verified'
            echo '- Inventory + production preflight: verified'
            echo '- Authenticated group read: verified'
            echo '- Source Supabase project: not modified'
            echo '- Backup artifacts: not uploaded or retained by this workflow'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy local restore target and private backup files
        if: always()
        shell: bash
        env:
          BACKUP_DIR: ${{ steps.backup.outputs.backup_dir }}
        run: |
          set +e
          supabase stop --no-backup >/dev/null 2>&1
          if [[ -n "${BACKUP_DIR:-}" && "$BACKUP_DIR" == "$RECOVERY_RUNNER_TEMP"/matrundan-recovery-* ]]; then
            rm -rf -- "$BACKUP_DIR"
          fi
