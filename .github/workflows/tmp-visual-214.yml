name: Temporary #214 visual review

on:
  push:
    branches:
      - feat/214-confirm-cross-group-participation
    paths:
      - '.github/workflows/tmp-visual-214.yml'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/214-confirm-cross-group-participation
          show-progress: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Capture visual review
        run: bun run test:visual-review
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-214-visual-review
          path: visual-review
          if-no-files-found: error
          retention-days: 2
