name: Temporary format diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  format-diagnostic:
    if: github.head_ref == 'agent/issue-204-pending-reviews'
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          while IFS= read -r -d '' file; do
            sed -i 's/\r$//' "$file"
          done < <(git ls-files -z -- '*.ts' '*.tsx')

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          bunx prettier --write 'src/routes/matstallen.$placeId.tsx' 'tests/e2e/v1-36-pending-visit-reviews.spec.ts'
          git diff -- 'src/routes/matstallen.$placeId.tsx' 'tests/e2e/v1-36-pending-visit-reviews.spec.ts'
