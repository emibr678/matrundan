name: Temporary format diagnostic

on:
  push:
    branches:
      - agent/issue-169-shared-visit-participation

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          while IFS= read -r -d '' file; do
            sed -i 's/\r$//' "$file"
          done < <(git ls-files -z -- '*.ts' '*.tsx' '*.sql')

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed files and print exact patch
        run: |
          export MATRUNDAN_BASE_SHA="$(git merge-base origin/main HEAD)"
          bun run format:changed
          echo '--- BEGIN FORMAT PATCH ---'
          git diff -- src/components/matrundan/VisitParticipationControls.tsx src/lib/matrundan/demo-visit-participation.ts src/lib/matrundan/visit-participation-demo.test.ts
          echo '--- END FORMAT PATCH ---'
