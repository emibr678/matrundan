name: Temporary #213 Supabase type sync

on:
  push:
    branches:
      - feat/213-prevent-duplicate-canonical-visits
    paths:
      - '.github/workflows/tmp-213-sync-supabase-types.yml'
      - 'supabase/migrations/**'
      - 'src/integrations/supabase/types.ts'

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  SUPABASE_CLI_VERSION: '2.115.0'
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/213-prevent-duplicate-canonical-visits
          fetch-depth: 0
          show-progress: false

      - name: Set up pinned Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0

      - name: Start migration-built local Postgres
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" db start

      - name: Generate canonical Supabase types
        run: bash scripts/supabase-types.sh generate src/integrations/supabase/types.ts

      - name: Commit generated types when changed
        run: |
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            echo "Generated types already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          git commit -m "chore: synka genererade Supabase-typer (#213)"
          git push origin HEAD:feat/213-prevent-duplicate-canonical-visits

      - name: Stop local Supabase database
        if: always()
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup
