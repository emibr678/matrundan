name: Apply PlaceMap canvas fix

on:
  push:
    branches: [fix/placemap-canvas-rendering]
    paths:
      - .github/workflows/apply-placemap-canvas-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/placemap-canvas-rendering
      - uses: oven-sh/setup-bun@v2
      - name: Apply and verify focused map fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/matrundan/PlaceMap.tsx')
          text = path.read_text()

          replacements = [
              (
                  '          let loaded = false;\n',
                  '          let loaded = false;\n          let initialIdleReached = false;\n',
              ),
              (
                  '              map.once("idle", () => {\n                window.clearTimeout(resourceTimeout);\n                if (!cancelled) setTileStatus("ready");\n              });\n            } else setTileStatus("missing");',
                  '              map.once("idle", () => {\n                window.clearTimeout(resourceTimeout);\n                if (!cancelled) {\n                  initialIdleReached = true;\n                  setTileStatus("ready");\n                }\n              });\n            } else {\n              initialIdleReached = true;\n              setTileStatus("missing");\n            }',
              ),
              (
                  '            if (!cancelled) {\n              setMapFailure(failure);\n              setMapStatus("error");\n              if (geoapifyKey) setTileStatus("error");\n            }',
                  '            if (cancelled || initialIdleReached) return;\n            setMapFailure(failure);\n            setMapStatus("error");\n            if (geoapifyKey) setTileStatus("error");',
              ),
              (
                  '        className="absolute inset-0 z-0 cursor-grab active:cursor-grabbing"',
                  '        className="absolute inset-0 z-0 cursor-grab active:cursor-grabbing [&_.maplibregl-canvas]:!h-full [&_.maplibregl-canvas]:!w-full [&_.maplibregl-canvas]:!max-w-none"',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected PlaceMap anchor: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          bun install --frozen-lockfile
          bunx prettier --write src/components/matrundan/PlaceMap.tsx
          bunx tsc --noEmit
          bunx eslint src/components/matrundan/PlaceMap.tsx
          bun run build

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/matrundan/PlaceMap.tsx
          git rm .github/workflows/apply-placemap-canvas-fix.yml
          git commit -m "Rätta MapLibre-canvas i PlaceMap"
          git push
