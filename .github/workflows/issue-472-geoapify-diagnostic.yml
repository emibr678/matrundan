name: Issue 472 temporary Geoapify boundary diagnosis
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  probe:
    name: Inspect Stockholm boundary provider responses
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/472-stockholm-boundaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: staging
    steps:
      - name: Read-only, bounded provider diagnosis
        env:
          GEOAPIFY_API_KEY: ${{ secrets.STAGING_GEOAPIFY_API_KEY || vars.STAGING_GEOAPIFY_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.GEOAPIFY_API_KEY || "";
          if (!secret) {
            console.error("BLOCKED: STAGING_GEOAPIFY_API_KEY is not available to this staging GitHub Actions job.");
            process.exit(2);
          }
          let calls = 0;
          async function api(path, params) {
            calls++;
            if (calls > 24) throw new Error("Diagnostic request cap (24) reached");
            const url = new URL("https://api.geoapify.com" + path);
            for (const [key, value] of Object.entries(params)) url.searchParams.set(key, String(value));
            url.searchParams.set("apiKey", secret);
            const response = await fetch(url, { headers: { accept: "application/json" }, signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error("Geoapify " + path + " responded HTTP " + response.status);
            const json = await response.json();
            if (!Array.isArray(json.features)) throw new Error("Malformed feature collection from " + path);
            return json.features;
          }
          function details(feature) {
            const p = feature?.properties ?? {};
            const raw = p.datasource?.raw ?? {};
            return {
              name: p.name ?? null,
              resultType: p.result_type ?? null,
              city: p.city ?? null,
              municipality: p.municipality ?? null,
              id: p.place_id ?? null,
              osm: raw.osm_type && raw.osm_id ? String(raw.osm_type) + "/" + String(raw.osm_id) : null,
              geometry: feature?.geometry?.type ?? null
            };
          }
          function names(features) {
            return features.slice(0, 18).map(f => ({
              name: f?.properties?.name ?? null,
              id: f?.properties?.place_id ?? null,
              geometry: f?.geometry?.type ?? null,
              boundary: f?.properties?.boundary ?? null,
              categories: f?.properties?.categories?.slice?.(0, 5) ?? null
            }));
          }
          function matching(features, target) {
            const normal = s => String(s ?? "").trim().toLocaleLowerCase("sv-SE").replace(/\s+/g, " ");
            return features.filter(f => normal(f?.properties?.name) === normal(target));
          }
          const cases = [
            {query: "Stockholm", kind: "city"},
            {query: "Stockholms kommun", kind: "municipality"},
            {query: "Nacka", kind: null},
            {query: "Nacka kommun", kind: "municipality"},
            {query: "Enskedefältet", kind: null},
            {query: "Värmdö kommun", kind: "municipality"}
          ];
          const selected = [];
          for (const testCase of cases) {
            const features = await api("/v1/geocode/autocomplete", {
              text: testCase.query, filter: "countrycode:se", lang: "sv",
              format: "geojson", limit: 8, bias: "countrycode:se"
            });
            const all = features.map(details);
            const preferred = features.find(f =>
              f?.properties?.result_type === testCase.kind &&
              String(f?.properties?.name ?? "").toLocaleLowerCase("sv-SE").includes(testCase.query.split(" ")[0].toLocaleLowerCase("sv-SE"))
            ) ?? features.find(f => f?.properties?.result_type === testCase.kind) ?? features[0];
            const item = details(preferred);
            console.log("AUTOCOMPLETE " + JSON.stringify({query:testCase.query, hits:all, chosen:item}));
            if (item.id) selected.push({ ...testCase, chosen: item });
          }
          for (const row of selected) {
            const place = row.chosen;
            const query = row.query;
            console.log("SELECTED " + JSON.stringify({query, chosen:place}));
            if (query === "Stockholm" || query === "Nacka") {
              for (const features of ["details", "details,details.full_geometry"]) {
                const found = await api("/v2/place-details", {id:place.id, features, lang:"sv"});
                console.log("PLACE_DETAILS " + JSON.stringify({query, features, found:names(found)}));
              }
            }
            const types = query === "Stockholm" || query === "Nacka"
              ? ["administrative", "administrative,place,neighborhood"]
              : ["administrative"];
            for (const boundaries of types) {
              const found = await api("/v1/boundaries/part-of", {
                id:place.id, boundaries, geometry:"point", lang:"sv"
              });
              console.log("PART_OF_POINTS " + JSON.stringify({
                query, boundaries, found:names(found),
                exactMatch:matching(found, place.name).map(f=>details(f))
              }));
              if (matching(found, place.name).length > 0) {
                const polygons = await api("/v1/boundaries/part-of", {
                  id:place.id, boundaries, geometry:"geometry_1000", lang:"sv"
                });
                const candidates = matching(polygons,place.name).map(f=>details(f));
                console.log("PART_OF_GEOMETRY " + JSON.stringify({query, boundaries, candidates}));
              }
            }
          }
          console.log("DIAGNOSTIC COMPLETE: " + calls + " read-only requests, no credentials or private group data logged.");
          NODE
