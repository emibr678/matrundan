name: Issue 472 temporary Geoapify boundary diagnosis
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  probe:
    name: Inspect Stockholm boundary provider responses
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/472-stockholm-boundaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: staging
    steps:
      - name: Read-only, bounded provider diagnosis
        env:
          GEOAPIFY_API_KEY: ${{ secrets.STAGING_GEOAPIFY_API_KEY || vars.STAGING_GEOAPIFY_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.GEOAPIFY_API_KEY || "";
          if (!secret) { console.error("BLOCKED: staging Geoapify key unavailable"); process.exit(2); }
          let count = 0;
          async function api(path, fields) {
            if (++count > 18) throw new Error("18-request diagnostic safety cap reached");
            const url = new URL("https://api.geoapify.com" + path);
            for (const [k,v] of Object.entries(fields)) url.searchParams.set(k, String(v));
            url.searchParams.set("apiKey", secret);
            const response = await fetch(url, {headers:{accept:"application/json"},signal:AbortSignal.timeout(15000)});
            if (!response.ok) throw new Error(path + " responded HTTP " + response.status);
            const json=await response.json();
            if (!Array.isArray(json.features)) throw new Error("Malformed Geoapify response on " + path);
            return json.features;
          }
          function slim(f) {
            const p=f?.properties ?? {};
            const geometry=f?.geometry ?? {};
            return {name:p.name ?? null,id:p.place_id ?? null,resultType:p.result_type ?? null,
              geometry:geometry.type ?? null,geometryBytes:JSON.stringify(geometry).length,
              categories:p.categories?.slice?.(0,4) ?? null};
          }
          const selection={};
          for (const query of ["Stockholm","Stockholms kommun","Nacka kommun","Värmdö kommun"]) {
            const features=await api("/v1/geocode/autocomplete",{text:query,filter:"countrycode:se",lang:"sv",format:"geojson",limit:5,bias:"countrycode:se"});
            const choice=features.find(f=>f?.properties?.name===query) ?? features[0];
            if (!choice?.properties?.place_id) throw new Error("Missing provider id for " + query);
            selection[query]=choice.properties.place_id;
            console.log("CHOICE " + JSON.stringify({query,feature:slim(choice)}));
            for (const variant of ["details","details,details.full_geometry"]) {
              try {
                const details=await api("/v2/place-details",{id:choice.properties.place_id,features:variant,lang:"sv"});
                console.log("DIRECT_DETAILS " + JSON.stringify({query,variant,features:details.map(slim)}));
              } catch(e) {console.log("DIRECT_DETAILS_FAILED " + JSON.stringify({query,variant,error:String(e?.message ?? e).slice(0,150)}));}
            }
          }
          const parents=await api("/v1/boundaries/part-of",{
            id:selection.Stockholm,boundaries:"administrative",geometry:"geometry_1000",lang:"sv"
          });
          console.log("STOCKHOLM_CONTAINING_POLYGONS " + JSON.stringify(parents.map(slim)));
          const municipality=parents.find(f=>f?.properties?.name==="Stockholms kommun" &&
            ["Polygon","MultiPolygon"].includes(f?.geometry?.type));
          if (municipality?.properties?.place_id) {
            const id=municipality.properties.place_id;
            for (const variant of ["details","details,details.full_geometry"]) {
              try {
                const details=await api("/v2/place-details",{id,features:variant,lang:"sv"});
                console.log("BOUNDARY_ID_DETAILS " + JSON.stringify({variant,features:details.map(slim)}));
                if (details.some(f=>["Polygon","MultiPolygon"].includes(f?.geometry?.type))) break;
              } catch(e) {console.log("BOUNDARY_ID_DETAILS_FAILED "+String(e?.message??e).slice(0,120));}
            }
            try {
              const places=await api("/v2/places",{categories:"catering.restaurant",filter:"place:"+id,limit:3,lang:"sv"});
              console.log("VERIFIED_PLACE_FILTER " + JSON.stringify({returned:places.length,features:places.map(slim)}));
            } catch(e) {console.log("PLACE_FILTER_FAILED "+String(e?.message??e).slice(0,120));}
          }
          console.log("FOLLOWUP DONE: " + count + " read-only requests; no secret or private group data logged");
          NODE
