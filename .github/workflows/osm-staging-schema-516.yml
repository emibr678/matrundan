name: OSM staging schema contract (Issue 516)

on:
  push:
    branches: [feature/osm-staging-comparison-516]
    paths:
      - scripts/diagnostics/osm-staging-schema-516.sql
      - scripts/diagnostics/osm-staging-smoke-516.sql
      - .github/workflows/osm-staging-schema-516.yml
  pull_request:
    paths:
      - scripts/diagnostics/osm-staging-schema-516.sql
      - scripts/diagnostics/osm-staging-smoke-516.sql
      - .github/workflows/osm-staging-schema-516.yml

permissions:
  contents: read

jobs:
  database-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    name: Disposable PostgreSQL / PostGIS security contract
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_DB: osm_poc
          POSTGRES_USER: poc
          POSTGRES_PASSWORD: poc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poc -d osm_poc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: poc
      PGPASSWORD: poc
      PGDATABASE: osm_poc
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y postgresql-client
          psql -v ON_ERROR_STOP=1 -c "select version(),postgis_version();"
      - name: Create minimal mocked Supabase auth roles (container only)
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE SET search_path = '' AS $$
            SELECT nullif(pg_catalog.current_setting('request.jwt.claim.sub',true),'')::uuid;
          $$;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Apply isolated schema to disposable database
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/diagnostics/osm-staging-schema-516.sql
      - name: Exercise read-only RPC and generation guard
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/diagnostics/osm-staging-smoke-516.sql
