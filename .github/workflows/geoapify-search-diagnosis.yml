name: Geoapify search diagnosis (#465)

on:
  push:
    branches: [feature/465-robust-place-search]
    paths:
      - .github/workflows/geoapify-search-diagnosis.yml
      - scripts/geoapify-search-diagnosis.mjs
  workflow_dispatch:
    inputs:
      max_credits:
        description: Upper bound of reserved credits (capped at 500)
        required: false
        default: '250'
        type: string

permissions:
  contents: read

concurrency:
  group: geoapify-search-diagnosis
  cancel-in-progress: false

jobs:
  diagnose:
    name: Live provider and server adapter (read only)
    if: github.repository == 'emibr678/matrundan'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 15
    env:
      GEOAPIFY_DIAGNOSTIC_KEY: ${{ secrets.STAGING_GEOAPIFY_API_KEY || vars.STAGING_GEOAPIFY_API_KEY }}
      MAX_DIAGNOSTIC_CREDITS: ${{ inputs.max_credits || '250' }}
      DIAGNOSTIC_OUTPUT_DIR: search-diagnostic
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Live provider and real search adapter diagnostics
        run: bun scripts/geoapify-search-diagnosis.mjs

      - name: Include summary in run
        if: always()
        run: |
          if [[ -f search-diagnostic/summary.md ]]; then
            cat search-diagnostic/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: check staging key and setup." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: geoapify-search-diagnosis-${{ github.run_id }}
          path: search-diagnostic/
          if-no-files-found: warn
          retention-days: 7
