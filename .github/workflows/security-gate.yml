name: Security gate

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact commit SHA that must be checked
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA that must be checked
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/security-gate.yml'

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: '2.115.0'
  SUPABASE_TELEMETRY_DISABLED: '1'
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.expected_sha || github.sha }}

jobs:
  baseline:
    name: Repository, supply chain and database security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          show-progress: false

      - name: Guard exact candidate
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "TARGET_SHA must be a full 40-character Git SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo "Checked out candidate does not match TARGET_SHA." >&2
            exit 1
          fi

      - name: Set up CI runtime
        uses: ./.github/actions/setup-ci

      - name: Repository security contracts
        run: |
          bun run check:public-readiness
          bun run check:database

      - name: Audit locked dependency graph
        run: bun audit --audit-level=high

      - name: Full-history secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Start migration-built local Postgres
        run: npx --yes "supabase@${{ env.SUPABASE_CLI_VERSION }}" db start

      - name: Run negative database security tests
        run: npx --yes "supabase@${{ env.SUPABASE_CLI_VERSION }}" test db

      - name: Stop local Supabase database
        if: always()
        run: npx --yes "supabase@${{ env.SUPABASE_CLI_VERSION }}" stop --no-backup

  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          show-progress: false

      - name: Guard exact candidate
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "TARGET_SHA must be a full 40-character Git SHA." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$TARGET_SHA" ]]; then
            echo "Checked out candidate does not match TARGET_SHA." >&2
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:javascript-typescript"

  required:
    name: Security gate / required
    if: always()
    needs: [baseline, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASELINE_RESULT: ${{ needs.baseline.result }}
      CODEQL_RESULT: ${{ needs.codeql.result }}
    steps:
      - name: Summarize security gate
        run: |
          set -euo pipefail
          printf '%-24s %s\n' baseline "$BASELINE_RESULT"
          printf '%-24s %s\n' codeql "$CODEQL_RESULT"
          if [[ "$BASELINE_RESULT" != "success" || "$CODEQL_RESULT" != "success" ]]; then
            echo "Production security gate failed or was cancelled." >&2
            exit 1
          fi
          echo "Security gate passed for \`$TARGET_SHA\`." >> "$GITHUB_STEP_SUMMARY"
