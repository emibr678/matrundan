name: Patch Paket 5C

on:
  push:
    branches:
      - agent/paket-5c-besoksfoto
    paths:
      - .github/workflows/patch-package-5c.yml
      - scripts/patch-package-5c.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/paket-5c-besoksfoto
          fetch-depth: 0

      - name: Apply Paket 5C patch
        run: python3 scripts/patch-package-5c.py

      - name: Commit product changes
        run: |
          git config user.name "Matrundan automation"
          git config user.email "actions@users.noreply.github.com"
          git add src public supabase tests
          git diff --cached --quiet && exit 0
          git commit -m "Paket 5C: implementera privata besöksfoton"
          git push origin HEAD:agent/paket-5c-besoksfoto
