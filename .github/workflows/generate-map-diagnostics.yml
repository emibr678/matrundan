name: Apply map diagnostics patch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/package-4a5a-start-diagnostics
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Patch PlaceMap
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/matrundan/PlaceMap.tsx')
          text = path.read_text()
          if 'type MapFailureCode =' in text:
              print('Diagnostics already applied')
              raise SystemExit(0)
          text = text.replace(
              'interface ClusterMarkerEntry {\n  marker: MapLibreMarker;\n  element: HTMLButtonElement;\n}\n',
              'interface ClusterMarkerEntry {\n  marker: MapLibreMarker;\n  element: HTMLButtonElement;\n}\n\ntype MapFailureCode = "webgl" | "style-auth" | "style-network" | "worker" | "timeout" | "runtime";\n\nfunction supportsWebGl() {\n  const canvas = document.createElement("canvas");\n  try {\n    return Boolean(canvas.getContext("webgl2") || canvas.getContext("webgl"));\n  } catch {\n    return false;\n  }\n}\n\nfunction classifyMapFailure(error: unknown): MapFailureCode {\n  const message = error instanceof Error ? error.message : String(error);\n  if (/webgl|gpu|graphics context|context lost/i.test(message)) return "webgl";\n  if (/401|403|unauthori[sz]ed|forbidden|api.?key/i.test(message)) return "style-auth";\n  if (/worker|securityerror|content security|csp/i.test(message)) return "worker";\n  if (/network|fetch|load failed|failed to load|http/i.test(message)) return "style-network";\n  return "runtime";\n}\n\nfunction failureNotice(code: MapFailureCode | null) {\n  switch (code) {\n    case "webgl": return "Enheten kunde inte starta WebGL för kartan. Felkod: WEBGL.";\n    case "style-auth": return "Geoapify nekade kartstilen. Kontrollera nyckelns tillåtna preview-domän. Felkod: STYLE-AUTH.";\n    case "style-network": return "Kartstilen kunde inte hämtas från Geoapify. Felkod: STYLE-NETWORK.";\n    case "worker": return "Kartmotorns worker blockerades av previewmiljön. Felkod: WORKER.";\n    case "timeout": return "Kartmotorn svarade inte inom 15 sekunder. Felkod: TIMEOUT.";\n    default: return "Kartan kunde inte startas. Felkod: RUNTIME.";\n  }\n}\n',
          )
          text = text.replace(
              '  const [mapStatus, setMapStatus] = React.useState<"loading" | "ready" | "error">("loading");\n',
              '  const [mapStatus, setMapStatus] = React.useState<"loading" | "ready" | "error">("loading");\n  const [mapFailure, setMapFailure] = React.useState<MapFailureCode | null>(null);\n',
          )
          text = text.replace(
              '    const element = mapElementRef.current;\n    if (!element) return;\n\n    void waitForMapLibre()\n',
              '    const element = mapElementRef.current;\n    if (!element) return;\n\n    setMapFailure(null);\n    if (!supportsWebGl()) {\n      setMapFailure("webgl");\n      setMapStatus("error");\n      if (geoapifyKey) setTileStatus("error");\n      return;\n    }\n\n    void waitForMapLibre()\n',
          )
          text = text.replace(
              '              setMapStatus("error");\n              if (geoapifyKey) setTileStatus("error");\n',
              '              setMapFailure("timeout");\n              setMapStatus("error");\n              if (geoapifyKey) setTileStatus("error");\n',
              1,
          )
          text = text.replace(
              '            console.error("[Matrundan] MapLibre-fel:", event.error ?? event);\n            if (!loaded && !cancelled) {\n              setMapStatus("error");\n',
              '            const failure = classifyMapFailure(event.error ?? event);\n            console.error("[Matrundan] MapLibre-fel:", event.error ?? event);\n            if (!loaded && !cancelled) {\n              setMapFailure(failure);\n              setMapStatus("error");\n',
          )
          text = text.replace(
              '          console.error("[Matrundan] MapLibre kunde inte startas:", error);\n          setMapStatus("error");\n',
              '          console.error("[Matrundan] MapLibre kunde inte startas:", error);\n          setMapFailure(classifyMapFailure(error));\n          setMapStatus("error");\n',
          )
          text = text.replace(
              '        console.error("[Matrundan] MapLibre kunde inte laddas:", error);\n        if (!cancelled) {\n          setMapStatus("error");\n',
              '        console.error("[Matrundan] MapLibre kunde inte laddas:", error);\n        if (!cancelled) {\n          setMapFailure(classifyMapFailure(error));\n          setMapStatus("error");\n',
          )
          text = text.replace(
              '    mapStatus === "error"\n      ? "Kartan kunde inte startas på den här enheten. Använd listvyn och försök igen senare."\n',
              '    mapStatus === "error"\n      ? failureNotice(mapFailure)\n',
          )
          text = text.replace(
              '      data-map-tile-status={tileStatus}\n',
              '      data-map-tile-status={tileStatus}\n      data-map-error-code={mapFailure ?? ""}\n',
          )
          path.write_text(text)
      - name: Format and commit
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/components/matrundan/PlaceMap.tsx
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/matrundan/PlaceMap.tsx
          git commit -m "Diagnostisera kartstart i verklig preview"
          git push origin HEAD:fix/package-4a5a-start-diagnostics
