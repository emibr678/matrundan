name: Prettier backup diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  format:
    if: github.event.pull_request.number == 222
    runs-on: matrundan-self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: ./.github/actions/setup-bun
      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile
      - name: Print exact Prettier output
        shell: bash
        run: |
          bunx prettier --write scripts/visit-photo-backup.mjs
          echo '---BEGIN_FORMATTED_FILE---'
          cat scripts/visit-photo-backup.mjs
          echo '---END_FORMATTED_FILE---'
