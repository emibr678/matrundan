name: Artifact lifecycle cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  actions: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.MATRUNDAN_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5

    steps:
      - name: Check out cleanup helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          show-progress: false

      - name: Remove closed PR artifacts
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const cleanup = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/artifact-lifecycle.cjs`);
            await cleanup({
              github,
              context,
              core,
              prNumber: context.payload.pull_request.number,
              currentRunId: process.env.GITHUB_RUN_ID,
              scope: 'all',
              cleanupLegacy: true,
            });
