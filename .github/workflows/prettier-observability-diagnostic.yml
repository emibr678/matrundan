name: Prettier observability diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  format:
    if: github.event.pull_request.number == 222
    runs-on: matrundan-self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - uses: ./.github/actions/setup-bun
      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile
      - name: Print exact Prettier output
        shell: bash
        run: |
          bunx prettier --write src/lib/observability.test.ts src/lib/observability.ts src/routes/__root.tsx
          echo '---BEGIN_observability.test.ts---'
          cat src/lib/observability.test.ts
          echo '---END_observability.test.ts---'
          echo '---BEGIN_observability.ts---'
          cat src/lib/observability.ts
          echo '---END_observability.ts---'
          echo '---BEGIN___root.tsx---'
          cat src/routes/__root.tsx
          echo '---END___root.tsx---'
