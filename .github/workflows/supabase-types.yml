name: Supabase type drift

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'src/integrations/supabase/types.ts'
      - 'scripts/supabase-types.sh'
      - '.github/workflows/supabase-types.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'src/integrations/supabase/types.ts'
      - 'scripts/supabase-types.sh'
      - '.github/workflows/supabase-types.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: supabase-types-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: '2.115.0'
  SUPABASE_TELEMETRY_DISABLED: '1'

jobs:
  types:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Start migration-built local Postgres
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" db start

      - name: Verify generated Supabase types
        run: bash scripts/supabase-types.sh check src/integrations/supabase/types.ts

      - name: Generate expected types on failure
        if: failure()
        run: bash scripts/supabase-types.sh generate supabase-types.generated.ts

      - name: Upload expected types on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-types-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
          path: supabase-types.generated.ts
          if-no-files-found: ignore
          retention-days: 5

      - name: Stop local Supabase database
        if: always()
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup
